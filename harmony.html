  });
  n.appendChild(track);
}

function tipFor(t, l, bad) {
  let s = t.ref + '  ' + t.paxName + (t.account ? ' (' + t.account + ')' : '') +
    '\n' + svcName(t) + '  ' + H.LOC[t.from].name + ' → ' + H.LOC[t.to].name +
    '\nBooked ' + H.hhmm(t.pickup) + '   projected ' + H.hhmm(l.start) +
    (l.late > 0.5 ? '   (' + Math.round(l.late) + ' min late)' : '   (on time)') +
    '\n' + t.pax + ' pax · ' + H.CLASS_LABEL[t.reqCls] + ' requested' + (t.vip ? ' · VIP' : '') +
    '\nDeadhead in ' + l.repoMi.toFixed(1) + ' mi, buffer ' + Math.round(l.slack) + ' min';
  if (bad && bad.length) s += '\n\n! ' + bad.map(b => M.CODE_TEXT[b.code]).join('\n! ');
  return s;
}
function svcName(t) {
  return { arrival: 'Airport arrival', departure: 'Airport departure',
           waitreturn: 'Wait & return', hourly: 'Hourly as directed' }[t.svc];
}

function positionNow() {
  const n = $('#nowline');
  n.style.left = 'calc(150px + (100% - 150px) * ' + (xp(S.clock) / 100) + ')';
  $('#nowlabel').textContent = H.hhmm24(S.clock);
}

/* ================= log ================= */
/* Log stamps carry seconds so successive entries are distinguishable even while
   the simulation clock is paused. The minute is the simulated minute; the
   seconds are real elapsed time in this session. */
function stamp() {
  return H.hhmm24(S.clock) + ':' + String(Math.floor((Date.now() - S.t0) / 1000) % 60).padStart(2, '0');
}
function logLine(kind, title, text) {
  const n = el('div', 'li ' + kind,
    '<time>' + stamp() + '</time><div class="body"><b>' + title + '</b>' +
    (text ? '<p>' + text + '</p>' : '') + '</div>');
  $('#log').appendChild(n);
  $('#log').scrollTop = $('#log').scrollHeight;
  return n;
}
function reportState(prefix) {
  const p = S.lastProj, v = S.lastViol;
  logLine(v.length ? 'bad' : p.totals.failures ? 'warn' : 'ok',
    prefix + (v.length ? ' — ' + v.length + ' hard violation' + (v.length > 1 ? 's' : '') : ' — feasible'),
    p.totals.onTimePct.toFixed(1) + '% projected on-time · ' + p.totals.failures + ' service failure' +
    (p.totals.failures === 1 ? '' : 's') + ' · ' + p.totals.unassigned + ' unassigned · ' +
    Math.round(p.totals.deadheadMi) + ' deadhead mi · ' + Math.round(p.totals.overtimeMin) + ' overtime min');
}

/* ================= optimize ================= */
function runOptimize(reason) {
  const btn = $('#optBtn');
  btn.disabled = true; btn.textContent = 'WORKING…';
  const before = M.project(S);
  const beforeViol = M.validate(S, before);

  /* the run happens now, in full. The lines below reveal its real counters in
     sequence so the operator can follow the reasoning - the numbers are
     measurements taken from this run, not a script. */
  const res = O.optimize(S, { budgetMs: 240 });
  S.proposal = res;

  const steps = [
    ['sys', 'Scanning plan' + (reason ? ' — ' + reason : ''),
      S.day.trips.length + ' reservations, ' + before.totals.vehiclesUsed + ' vehicles working, ' +
      Object.keys(before.leg).length + ' legs re-timed through the traffic model at ' +
      S.day.traffic.toFixed(2) + '×.'],
    [beforeViol.length ? 'bad' : 'sys', 'Checking hard constraints',
      beforeViol.length ? beforeViol.length + ' violation' + (beforeViol.length > 1 ? 's' : '') + ': ' +
        summarise(beforeViol) : 'No hard violations. ' + before.totals.failures +
        ' trips projected more than ' + M.SERVICE_FAIL + ' min late.'],
    ['sys', 'Evaluating alternatives',
      res.stats.candidates.toLocaleString() + ' vehicle–trip pairings evaluated, ' +
      res.stats.feasible.toLocaleString() + ' feasible (' +
      (res.stats.candidates ? Math.round(res.stats.feasible / res.stats.candidates * 100) : 0) +
      '%). ' + res.stats.crewSwapsTested.toLocaleString() + ' chauffeur re-pairings tested.'],
    ['sys', 'Local search',
      res.stats.iterations.toLocaleString() + ' ruin-and-recreate iterations, ' +
      res.stats.movesTested.toLocaleString() + ' reinsertions, ' + res.stats.movesAccepted +
      ' accepted. Objective ' + Math.round(res.stats.costBefore).toLocaleString() + ' → ' +
      Math.round(res.stats.costAfter).toLocaleString() + ' in ' + res.stats.ms + ' ms.']
  ];

  let i = 0;
  const running = logLine('sys run', 'Optimizing', 'Locked assignments held fixed.');
  const iv = setInterval(function () {
    if (i < steps.length) { logLine(steps[i][0], steps[i][1], steps[i][2]); i++; return; }
    clearInterval(iv);
    running.classList.remove('run');
    btn.disabled = false; btn.textContent = '◈ REOPTIMIZE';
    finishOptimize(res);
  }, 210);
}

function summarise(viol) {
  const c = {};
  viol.forEach(v => c[v.code] = (c[v.code] || 0) + 1);
  return Object.keys(c).map(k => c[k] + '× ' + M.CODE_TEXT[k]).join('; ');
}

/* Say plainly when the only thing standing between the plan and legality is a
   lock the operator set. The fix belongs to them, not to the optimizer. */
function reportLocks() {
  const viol = M.validate(S, M.project(S));
  const lc = lockedConflicts(viol);
  if (!lc.length) return;
  logLine('bad', lc.length + ' locked assignment' + (lc.length > 1 ? 's are' : ' is') + ' now infeasible',
    lc.map(function (id) {
      const t = S.tById[id];
      const v = viol.filter(x => x.trip === id)[0];
      return t.ref + ' ' + t.paxName + ' — ' + (v.detail || M.CODE_TEXT[v.code]);
    }).join('\n') +
    '\nHarmony will not break a lock to repair itself. Unlock ' +
    (lc.length > 1 ? 'these' : 'this') + ' and reoptimize, or move ' +
    (lc.length > 1 ? 'them' : 'it') + ' by hand.');
}

function finishOptimize(res) {
  reportLocks();
  const moves = res.moves.filter(m => !m.kind);
  const crew = res.moves.filter(m => m.kind === 'crew');
  if (!moves.length && !crew.length) {
    S.proposal = null;
    logLine('ok', 'No better plan found',
      'The current assignment is already the best this objective can find. Nothing moved.');
    render();
    toast('ok', 'Plan already optimal', 'Harmony evaluated ' + res.stats.candidates.toLocaleString() +
      ' pairings and kept the plan as it stands.');
    return;
  }
  logLine('ok', 'Proposal ready',
    moves.length + ' reassignment' + (moves.length === 1 ? '' : 's') +
    (crew.length ? ' and ' + crew.length + ' chauffeur re-pairing' + (crew.length === 1 ? '' : 's') : '') +
    '. Ghost bars show where the trips would go.');
  renderProposal(res);
  render();
}

function renderProposal(res) {
  const d = res.delta, b = res.before.totals, a = res.after.totals;
  const vBefore = M.validate(S, res.before).length;
  const wsAfter = O.workState(S, res.plan); M.index(wsAfter);
  const vAfter = M.validate(wsAfter, res.after).length;

  const cell = (label, before, after, betterLower) => {
    const same = Math.abs(after - before) < 0.05;
    const good = betterLower ? after < before : after > before;
    return '<div><span>' + label + '</span><b class="' + (same ? 'flat' : good ? 'up' : 'down') + '">' +
      fmt(before) + ' → ' + fmt(after) + '</b></div>';
  };
  const fmt = n => Math.abs(n % 1) > 0.01 ? n.toFixed(1) : String(Math.round(n));

  $('#propGrid').innerHTML =
    cell('ON-TIME %', b.onTimePct, a.onTimePct, false) +
    cell('HARD VIOLATIONS', vBefore, vAfter, true) +
    cell('SERVICE FAILURES', b.failures, a.failures, true) +
    cell('DEADHEAD MI', b.deadheadMi, a.deadheadMi, true);

  $('#propCount').textContent = res.moves.length + ' change' + (res.moves.length === 1 ? '' : 's') +
    ' · ' + res.stats.ms + ' ms';

  $('#propMoves').innerHTML = res.moves.map(function (m) {
    if (m.kind === 'crew') {
      return '<div class="mv"><span class="ar">⇄</span><span class="txt"><b>' + m.vehicleLabel +
        ' crew: ' + m.fromLabel + ' → ' + m.toLabel + '</b><small>' + m.why + '</small></span></div>';
    }
    const t = S.tById[m.tripId];
    return '<div class="mv" data-t="' + m.tripId + '"><span class="ar">→</span><span class="txt"><b>' +
      t.ref + ' ' + t.paxName + ': ' + m.fromLabel + ' → ' + m.toLabel + '</b><small>' +
      cap(m.why) + (m.lateAfter != null ? ' · projected ' +
        (m.lateAfter > 0.5 ? Math.round(m.lateAfter) + ' min late' : 'on time') : '') +
      '</small></span></div>';
  }).join('');
  $('#propMoves').querySelectorAll('.mv[data-t]').forEach(n =>
    n.onclick = () => openTrip(n.dataset.t));

  $('#proposal').classList.remove('hidden');
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function applyProposal() {
  if (!S.proposal) return;
  push();
  S.plan = M.clonePlan(S.proposal.plan);
  const n = S.proposal.moves.length;
  S.proposal = null;
  $('#proposal').classList.add('hidden');
  M.index(S);
  render();
  logLine('ok', 'Plan applied', n + ' change' + (n === 1 ? '' : 's') + ' committed.');
  reportState('After apply');
  const a = AUD.audit(S);
  logLine(a.clean ? 'ok' : 'bad', a.clean ? 'Post-apply audit clean' : 'Post-apply audit FAILED',
    a.performed.toLocaleString() + ' independent checks. ' +
    (a.clean ? 'No hard constraint broken.' : a.failures.length + ' failures — open AUDIT.'));
  toast(a.clean ? 'ok' : 'bad', 'Plan applied', n + ' changes committed and re-verified against ' +
    a.performed.toLocaleString() + ' constraint checks.');
}
function clearProposal() { S.proposal = null; $('#proposal').classList.add('hidden'); }

/* ================= disruptions ================= */
function inject(kind) {
  push();
  let e = null;
  if (kind === 'flight') e = SIM.flightDelay(S, 45);
  else if (kind === 'breakdown') e = SIM.breakdown(S);
  else if (kind === 'callout') e = SIM.callout(S);
  else if (kind === 'traffic') e = SIM.trafficSurge(S, 1.25);
  else if (kind === 'reservation') e = SIM.lastMinute(S, 1);
  else if (kind === 'surge') e = SIM.airportSurge(S);
  else if (kind === 'chaos') e = SIM.chaos(S);

  if (!e) { S.history.pop(); toast('warn', 'Nothing to disrupt', 'No eligible target left for that event on this day.'); return; }
  M.index(S);
  clearProposal();
  render();
  logLine('bad', e.title, e.detail);
  reportState('Impact');
  toast(kind === 'chaos' ? 'bad' : 'warn', e.title, e.detail);
  if (S.autoOpt) setTimeout(() => runOptimize(e.title.toLowerCase()), 500);
}

/* ================= drag & drop ================= */
let dragId = null;
function onDragStart(e) {
  const host = e.currentTarget;      /* e.target may be one of the prism faces */
  dragId = host.dataset.t;
  e.dataTransfer.setData('text/plain', dragId);
  e.dataTransfer.effectAllowed = 'move';
  /* Browsers snapshot the dragged element, and a rotated prism photographs
     badly. Hand them a flat stand-in instead. */
  const face = host.querySelector('.face');
  const ghost = el('div', 'dragghost', face ? face.innerHTML : '');
  ghost.style.width = host.offsetWidth + 'px';
  ghost.style.height = host.offsetHeight + 'px';
  ghost.style.background = getComputedStyle(host).getPropertyValue('--bar');
  ghost.style.color = getComputedStyle(host).getPropertyValue('--barink');
  document.body.appendChild(ghost);
  try { e.dataTransfer.setDragImage(ghost, 12, 12); } catch (err) {}
  setTimeout(() => ghost.remove(), 0);
}
function onDragOver(e) {
  if (!dragId) return;
  e.preventDefault();
  const row = e.currentTarget;
  const vid = row.dataset.v;
  const ok = quickCheck(dragId, vid).length === 0;
  row.classList.toggle('drop', ok);
  row.classList.toggle('nodrop', !ok);
  e.dataTransfer.dropEffect = 'move';
}
/* the same predicate the optimizer uses, so the hover colour cannot lie */
function quickCheck(tripId, vid) {
  const t = S.tById[tripId];
  const plan = M.clonePlan(S.plan);
  plan.assign[tripId] = vid;
  const ws = O.workState(S, plan); M.index(ws); ws.plan = plan;
  return M.staticViolations(ws, t, vid, M.project(ws));
}
function onDrop(e) {
  e.preventDefault();
  const row = e.currentTarget;
  row.classList.remove('drop', 'nodrop');
  const vid = row.dataset.v, tid = dragId; dragId = null;
  if (!tid || S.plan.assign[tid] === vid) return;
  const t = S.tById[tid];
  if (t.locked) { toast('bad', 'Assignment locked', t.ref + ' is locked to ' + S.vById[t.lockedTo].label + '. Unlock it first.'); return; }
  if (M.committed(S, t)) {
    toast('bad', 'Trip already under way',
      t.ref + ' started at ' + H.hhmm(t.startedAt) + ' on ' + S.vById[t.startedOn].label +
      '. Harmony cannot move a car that already has the client aboard.');
    return;
  }

  const v = quickCheck(tid, vid);
  if (!v.length) {
    push();
    S.plan.assign[tid] = vid;
    clearProposal(); render();
    const l = S.lastProj.leg[tid];
    logLine('ok', 'Manual reassignment accepted',
      t.ref + ' ' + t.paxName + ' → ' + S.vById[vid].label + '. Projected ' + H.hhmm(l.start) +
      (l.late > 0.5 ? ', ' + Math.round(l.late) + ' min late' : ', on time') + '. ' +
      'Downstream trips on that car re-timed.');
    reportState('After manual move');
    toast('ok', 'Accepted', t.ref + ' moved to ' + S.vById[vid].label + '.');
    if (S.autoOpt) setTimeout(() => runOptimize('manual move'), 400);
    return;
  }
  rejectSheet(t, S.vById[vid], v);
}

function rejectSheet(t, v, viol) {
  openSheet(
    '<h3>Assignment rejected</h3>' +
    '<p>' + t.ref + ' ' + t.paxName + ' onto ' + v.label + ' (' + H.CLASS_LABEL[v.cls] + ', ' +
    v.cap + ' seats) breaks ' + viol.length + ' hard constraint' + (viol.length > 1 ? 's' : '') + '.</p>' +
    '<div class="banner bad">' + viol.map(x => '<div><b>' + x.code + '</b> — ' +
      (x.detail || M.CODE_TEXT[x.code]) + '</div>').join('') + '</div>' +
    '<h4>WHAT HARMONY WOULD DO INSTEAD</h4>' + candidateHtml(t) +
    '<div class="sheetacts">' +
    '<button class="ghostbtn" id="ovBtn">Override anyway — show me the damage</button>' +
    '<button class="primary" id="okBtn">Cancel</button></div>');
  $('#okBtn').onclick = closeSheet;
  $('#ovBtn').onclick = function () {
    push();
    S.plan.assign[t.id] = v.id;
    closeSheet(); clearProposal(); render();
    logLine('bad', 'Constraint overridden by operator',
      t.ref + ' forced onto ' + v.label + '. ' + viol.map(x => x.detail || M.CODE_TEXT[x.code]).join('; ') +
      '. This plan is now illegal and the audit will say so.');
    reportState('After override');
    toast('bad', 'Override recorded', 'The plan is now illegal. Run AUDIT — Harmony will not hide it.');
  };
}

function candidateHtml(t) {
  const ex = O.explainTrip(S, t.id);
  const yes = ex.feasible.map(f =>
    '<div class="cand yes"><span class="v">' + S.vById[f.vehicleId].label + '</span>' +
    '<span class="d">feasible · cost +' + Math.round(f.score) + ' · ' +
    (f.late > 0.5 ? Math.round(f.late) + ' min late' : 'on time') + ' · ' +
    f.repoMi.toFixed(1) + ' mi deadhead · ' + Math.round(f.slack) + ' min buffer</span></div>').join('');
  const no = ex.rejected.slice(0, 6).map(f =>
    '<div class="cand no"><span class="v">' + S.vById[f.vehicleId].label + '</span>' +
    '<span class="d">' + f.reasons.join('; ') + '</span></div>').join('');
  return '<div class="rows2">' + (yes || '<div class="cand no"><span class="v">none</span><span class="d">No vehicle in the fleet can legally take this trip right now.</span></div>') + no + '</div>' +
    '<p style="margin-top:10px;color:var(--ink3)">' + ex.stats.candidates +
    ' pairings evaluated for this trip, ' + ex.stats.feasible + ' feasible.</p>';
}

/* ================= trip sheet ================= */
function openTrip(id) {
  const t = S.tById[id];
  const proj = S.lastProj;
  const l = proj.leg[id];
  const vid = S.plan.assign[id];
  const v = vid && vid !== 'AFFILIATE' ? S.vById[vid] : null;
  const c = v ? S.cById[S.plan.crew[v.id]] : null;
  const bad = S.lastViol.filter(x => x.trip === id);

  let html = '<h3>' + t.ref + ' · ' + t.paxName + (t.vip ? ' <span style="color:var(--gold)">◆ VIP</span>' : '') + '</h3>' +
    '<p>' + svcName(t) + ' · ' + H.LOC[t.from].name + ' → ' + H.LOC[t.to].name +
    (t.account ? ' · ' + t.account : '') + (t.flight ? ' · ' + t.flight.code +
      (t.flight.delayMin ? ' (delayed ' + t.flight.delayMin + ' min)' : '') : '') + '</p>' +
    '<div class="facts">' +
    f('BOOKED', H.hhmm(t.basePickup)) +
    f('REQUESTED', H.hhmm(t.pickup)) +
    f('PROJECTED', l ? H.hhmm(l.start) : '—') +
    f('LATE BY', l ? (l.late > 0.5 ? Math.round(l.late) + ' min' : 'on time') : '—') +
    f('PASSENGERS', t.pax + ' · needs ' + H.CLASS_LABEL[t.reqCls]) +
    f('ASSIGNED', v ? v.label + ' (' + H.CLASS_LABEL[v.cls] + ')' : vid === 'AFFILIATE' ? 'Affiliate' : 'Unassigned') +
    f('CHAUFFEUR', c ? c.name + ' · ' + H.TIER[c.tier] : '—') +
    f('DEADHEAD IN', l ? l.repoMi.toFixed(1) + ' mi / ' + Math.round(l.repoMin) + ' min' : '—') +
    '</div>';

  if (bad.length) html += '<div class="banner bad">' + bad.map(x =>
    '<div><b>' + x.code + '</b> — ' + (x.detail || M.CODE_TEXT[x.code]) + '</div>').join('') + '</div>';
  if (t.notified) html += '<div class="banner warn">The customer has already been told who is driving. ' +
    'Moving this trip carries a ' + (S.weights.disruption * (t.vip ? 48 : 24)) +
    '-point disruption penalty in the objective, so Harmony will only move it for a real gain.</div>';

  html += '<h4>EVERY VEHICLE, SCORED RIGHT NOW</h4>' + candidateHtml(t);
  html += '<div class="sheetacts">' +
    '<button class="ghostbtn" id="lockBtn">' + (t.locked ? '⌧ Unlock' : '⌧ Lock to this vehicle') + '</button>' +
    (vid !== 'AFFILIATE' ? '<button class="ghostbtn" id="affBtn">Farm out to affiliate ($' + M.AFFILIATE_FEE + ')</button>' : '') +
    '<button class="ghostbtn" id="delayBtn">Delay pickup 30 min</button>' +
    '<button class="primary" id="closeB">Close</button></div>';

  openSheet(html);
  $('#closeB').onclick = closeSheet;
  $('#lockBtn').onclick = function () {
    push();
    t.locked = !t.locked; t.lockedTo = t.locked ? vid : null;
    closeSheet(); render();
    logLine('sys', t.locked ? 'Assignment locked' : 'Lock released',
      t.ref + (t.locked ? ' pinned to ' + (v ? v.label : 'its current state') +
        '. The optimizer must now solve around it.' : ' is movable again.'));
  };
  const ab = $('#affBtn');
  if (ab) ab.onclick = function () {
    push(); S.plan.assign[id] = 'AFFILIATE'; t.affiliate = true;
    closeSheet(); clearProposal(); render();
    logLine('warn', 'Farmed to affiliate', t.ref + ' released to an affiliate at $' + M.AFFILIATE_FEE + '.');
    reportState('After farm-out');
  };
  $('#delayBtn').onclick = function () {
    push(); t.pickup += 30;
    closeSheet(); clearProposal(); M.index(S); render();
    logLine('warn', 'Pickup moved', t.ref + ' now requested at ' + H.hhmm(t.pickup) + '.');
    reportState('After pickup change');
  };
}
function f(k, v) { return '<div><span>' + k + '</span><b>' + v + '</b></div>'; }

/* ================= audit ================= */
function runAudit() {
  const a = AUD.audit(S);
  let html = '<h3>Independent plan audit</h3>' +
    '<p>This check does not ask the optimizer whether it did well. It walks the plan that ' +
    'currently exists and re-derives every hard constraint from the world — including the ones ' +
    'the scheduler believes it guarantees by construction.</p>' +
    '<div class="banner ' + (a.clean ? 'ok' : 'bad') + '">' +
    (a.clean
      ? '✓ PASS — ' + a.performed.toLocaleString() + ' checks performed, no hard constraint broken.'
      : '✕ FAIL — ' + a.failures.length + ' of ' + a.performed.toLocaleString() +
        ' checks failed. The plan on screen is not legally executable.') + '</div>' +
    '<h4>CHECKS PERFORMED</h4><div class="rows2">' +
    a.checks.map(c => '<div class="rw ' + (c.failed ? 'fail' : 'pass') + '"><span class="tick">' +
      (c.failed ? '✕' : '✓') + '</span><span class="l">' + c.name + '</span><span class="r">' +
      c.n.toLocaleString() + ' checked' + (c.failed ? ' · ' + c.failed + ' FAILED' : '') +
      '</span></div>').join('') + '</div>';

  if (a.failures.length) html += '<h4>FAILURES</h4><div class="rows2">' +
    a.failures.map(x => '<div class="rw fail"><span class="tick">✕</span><span class="l">' +
      x.detail + '</span><span class="r">' + x.check + '</span></div>').join('') + '</div>';

  html += '<h4>SERVICE QUALITY — REPORTED, NOT ASSERTED</h4>' +
    '<p>Lateness is not a constraint violation. A legal plan can still be a bad day, and Harmony ' +
    'shows both numbers separately rather than folding them together.</p>' +
    '<div class="facts c3">' +
    f('LATE OVER ' + M.LATE_THRESHOLD + ' MIN', a.service.late) +
    f('OVER ' + M.SERVICE_FAIL + ' MIN', a.service.failed) +
    f('UNASSIGNED', a.service.unassigned) +
    f('AFFILIATE', a.service.affiliate) +
    f('DEADHEAD', Math.round(a.proj.totals.deadheadMi) + ' mi') +
    f('OVERTIME', Math.round(a.proj.totals.overtimeMin) + ' min') + '</div>' +
    '<div class="sheetacts"><button class="primary" id="closeB">Close</button></div>';

  openSheet(html);
  $('#closeB').onclick = closeSheet;
  logLine(a.clean ? 'ok' : 'bad', a.clean ? 'Audit passed' : 'Audit FAILED',
    a.performed.toLocaleString() + ' independent checks across ' + a.checks.length + ' constraint families. ' +
    (a.clean ? 'No violations.' : a.failures.length + ' failures.'));
}

/* ================= sheet & toast ================= */
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').hidden = false; }
function closeSheet() { $('#sheet').hidden = true; }
let toastTimer;
function toast(kind, title, text) {
  const t = $('#toast');
  t.className = 'toast on ' + (kind === 'ok' ? '' : kind);
  t.innerHTML = '<b>' + title + '</b><p>' + text + '</p>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 4600);
}

/* ================= clock ================= */
/* Commit elapsed time to history. A trip the clock has passed the start of is
   under way and can no longer be reassigned; one whose end has passed keeps the
   times it actually ran, so raising traffic this afternoon cannot retroactively
   make this morning late. */
function freezeElapsed() {
  const proj = M.project(S);
  let changed = false;
  S.day.trips.forEach(function (t) {
    const vid = S.plan.assign[t.id];
    if (!vid || vid === 'AFFILIATE') return;
    const l = proj.leg[t.id]; if (!l) return;
    if (t.startedAt == null && S.clock >= l.start) {
      t.startedAt = l.start; t.startedOn = vid; changed = true;
    }
    if (!t.actual && t.startedAt != null && S.clock >= l.end) {
      t.actual = { v: vid, start: l.start, end: l.end, late: l.late,
                   repoMi: l.repoMi, repoMin: l.repoMin, dur: l.dur };
      changed = true;
    }
  });
  return changed;
}

/* Cheap signature of the whole board's lifecycle, so the clock only forces a
   re-render when something actually changed state. */
function statusSig(proj) {
  let out = '';
  for (let i = 0; i < S.day.trips.length; i++) out += proj.status[S.day.trips[i].id].charAt(0);
  return out;
}

function tick(sp) {
  S.clock = Math.min(1440, S.clock + sp / 4);
  $('#clock').textContent = H.hhmm24(S.clock);
  const froze = freezeElapsed();
  const proj = M.project(S);
  const sig = statusSig(proj);
  if (froze || sig !== S.lastSig) { S.lastSig = sig; render(); }
  else positionNow();
  if (S.clock >= 1440) { setSpeed(0); logLine('sys', 'Day complete', 'Simulation reached midnight.'); }
}

function setSpeed(sp) {
  S.speed = sp;
  document.querySelectorAll('#speeds button').forEach(b => b.classList.toggle('on', +b.dataset.sp === sp));
  clearInterval(S.timer);
  if (!sp) return;
  S.timer = setInterval(() => tick(sp), 250);
}

/* ================= wiring ================= */
function wire() {
  $('#optBtn').onclick = () => runOptimize();
  $('#applyBtn').onclick = applyProposal;
  $('#discardBtn').onclick = function () {
    clearProposal(); render();
    logLine('sys', 'Proposal discarded', 'The plan is unchanged.');
  };
  $('#auditBtn').onclick = runAudit;
  $('#resetBtn').onclick = () => { loadDay(S.dayCfg.id); toast('ok', 'Day restored', S.dayCfg.name + ' rebuilt from scratch. Nothing you did persists.'); };
  $('#undoBtn').onclick = function () {
    if (!S.history.length) return;
    restore(S.history.pop());
    $('#undoBtn').disabled = !S.history.length;
    clearProposal(); render();
    logLine('sys', 'Undone', 'Reverted to the previous state.');
  };
  document.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => inject(b.dataset.ev));
  document.querySelectorAll('#speeds button').forEach(b => b.onclick = () => setSpeed(+b.dataset.sp));
  $('#fProblems').onchange = e => { S.problemsOnly = e.target.checked; render(); };
  $('#autoOpt').onchange = e => { S.autoOpt = e.target.checked; };
  $('#setupBtn').onclick = e => { e.stopPropagation(); $('#setup').hidden ? openSetup() : closeSetup(); };
  document.addEventListener('click', function (e) {
    const n = $('#setup');
    if (!n.hidden && !n.contains(e.target) && e.target.id !== 'setupBtn') closeSetup();
  });
  $('#sheetClose').onclick = closeSheet;
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeSheet();
    if (e.key === 'o' && !e.metaKey && !e.ctrlKey) runOptimize();
    if (e.key === 'a' && !e.metaKey && !e.ctrlKey) runAudit();
  });
  document.addEventListener('dragend', () =>
    document.querySelectorAll('.vrow').forEach(r => r.classList.remove('drop', 'nodrop')));

  /* Wheel over a trip turns the whole board's prisms, free-angle, so it can be
     parked between two faces. Anywhere else the wheel still scrolls the board -
     taking that away on a thirty-row grid would be a bad trade. */
  $('#gridwrap').addEventListener('wheel', function (e) {
    const bar = e.target.closest && e.target.closest('.trip');
    if (!bar) return;
    e.preventDefault();
    if (S.overlayAuto) { S.overlayAuto = false; clearInterval(S.autoTimer); S.autoTimer = null; }
    S.angle += e.deltaY * WHEEL_DEG;
    applyRotation(false);
  }, { passive: false });
}

let booted = false;
function once() { if (booted) return; booted = true; boot(); }
document.addEventListener('DOMContentLoaded', once);
if (document.readyState !== 'loading') once();
})(window);

</script>
</body>
</html>
