        td.appendChild(who);
      }
      tr.appendChild(td);
    });
    tbl.appendChild(tr);
  });
  wrap.appendChild(tbl);
  r.appendChild(wrap);
}

async function saveRatingFor(n,systemId,channelId,scaleValueId){
  // Attribution is resolved before the write, never taken from the browser.
  // evaluator_id is the trustworthy column; the evaluator text stays alongside
  // it as a readable snapshot of the name at the time of rating.
  const mine = await ensureMyEvaluator();

  // REFUSE rather than write an unattributed row.
  //
  // Previously this wrote evaluator_id:null when you had no membership row,
  // producing a rating attributed to nobody. Under migration 21's
  // UNIQUE (node_id, system_id) a second attempt now collides with a 409
  // rather than quietly doubling up, but an unattributed row is still wrong:
  // the whole point of one-rating-per-cell is that you can see WHOSE it is.
  // Saying no out loud is the honest answer, and it is the same condition the
  // Evaluate panel already warns about.
  if(!mine){
    setSave("failed");
    flashNav("Not saved — you are not on this project's evaluator list. An administrator has to add you.");
    renderRight();          // puts the dropdown back to what the database says
    return;
  }

  // ⚠ channel_id is NOT NULL in the database (migration 22). Refuse here
  // rather than let PostgREST bounce it with a 400 nobody reads.
  if(!channelId){
    setSave("failed");
    flashNav("Not saved — no channel selected for this system. Add one in ⚙ Settings → Systems.");
    return;
  }

  const ex = ratingFor(n.id, systemId, channelId);

  /* ⚠ DO NOT read the response body inside the saveOp callback, and do not
     mutate S.evals in there either.

     saveOp has to CLONE the response to spot an RLS refusal (200 + []), and a
     Response whose body has already been consumed CANNOT be cloned — the clone
     throws, the check swallows it, and the refusal sails through reporting
     "Saved" exactly as before the fix. A check that cannot fail is not a check.

     So the callback returns the Response untouched and every state change
     happens below, only once saveOp has confirmed the database actually did it.

     The DELETE now asks for the representation too, so a REFUSED delete is
     caught as well — without the header it answers 204 and looks identical to
     a successful one. */
  let op = null;
  const res = await saveOp(()=>{
    if(scaleValueId===""){
      if(!ex) return null;                                  // nothing to clear
      op = "delete";
      return api("evaluations?id=eq."+ex.id,
        { method:"DELETE", headers:{...H,"Prefer":"return=representation"} });
    }
    if(ex){
      op = "update";
      return api("evaluations?id=eq."+ex.id,
        { method:"PATCH", headers:{...H,"Prefer":"return=representation"},
          body:JSON.stringify({ scale_value_id:scaleValueId, co_evaluator:S.coEvaluator,
                                evaluator_id:mine.id }) });
    }
    op = "insert";
    return api("evaluations",
      { method:"POST", headers:{...H,"Prefer":"return=representation"},
        body:JSON.stringify({ project_id:n.project_id, node_id:n.id, system_id:systemId,
                              channel_id:channelId,
                              evaluator:S.evaluator, co_evaluator:S.coEvaluator,
                              evaluator_id:mine.id, scale_value_id:scaleValueId }) });
  });

  if(!op) return;                                  // no-op: cleared an empty cell

  if(!res){
    // saveOp already set the pill to "failed" and stashed the reason.
    flashNav("Not saved — "+(lastSaveError||"the write did not go through")+
             " Your rating is NOT recorded.");
    renderRight();                                 // show what the database says
    return;
  }

  const rows = await res.json().catch(()=>[]);
  if(op==="delete")      S.evals = S.evals.filter(e=>e.id!==ex.id);
  else if(op==="update") Object.assign(ex, rows[0]);
  else                   S.evals.push(rows[0]);
  // S.evals is now current, and the tree swatch reads S.evals directly (D9), so
  // repaint the tree. The right panel is NOT re-rendered: the user is mid-edit
  // in it and rebuilding would blow away focus and scroll position.
  renderTree();
}

// support level (1-based) for a node/system, from that node's OWN rating only.
// Same rule as colorForSystem — no roll-up, no inheritance. D9.
function levelFor(nodeId, systemId, channelId){
  const ch = channelId || (currentChannelFor(systemId) || {}).id;
  const ex=ratingFor(nodeId, systemId, ch);
  if(!ex) return null;
  const idx=S.scaleValues.findIndex(v=>v.id===ex.scale_value_id);
  if(idx<0) return null;
  return { num:idx+1, color:S.scaleValues[idx].color, label:S.scaleValues[idx].label };
}

// mix a color toward white by amt (0..1) to make a pastel tint
function tint(hex, amt){
  const m=/^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$/i.exec(hex||"");
  if(!m) return "#eeeeee";
  let r=parseInt(m[1],16), g=parseInt(m[2],16), b=parseInt(m[3],16);
  r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt);
  return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
}

/* ---------- MULTI-LINE PASTE (S14) ----------
   Pasting several lines into any add box offers to create one child per line
   under the current parent. Flat only — indented outlines are NOT turned into
   hierarchy (declined in the guidelines for complexity/surprise); we detect the
   indentation and say so instead of silently discarding it.

   Why a paste listener and not a check on .value: these are <input> elements,
   and the browser flattens newlines on paste. By the time any handler reads
   .value the structure is already gone.

   Why one POST with an array: forty sequential inserts can fail at seventeen
   and leave orphans with no record of where it stopped. One request lands or
   doesn't. -------------------------------------------------------------- */

// single-letter markers only strip before ")" — "A. Fleet" is a plausible name,
// "a) Fleet" is not.
const LIST_MARKER = /^[ \t]*(?:[•▪◦‣·*–—-]|\d+[.)]|[a-zA-Z]\))[ \t]+/;

function parsePaste(text){
  const raw = text.replace(/\r\n?/g, "\n").split("\n");
  const kept = raw.filter(l => l.trim().length);
  const blank = raw.length - kept.length;

  const indents = kept.map(l => (l.match(/^[ \t]*/) || [""])[0].replace(/\t/g, "    ").length);
  const indented = new Set(indents).size > 1;

  let markers = 0;
  const cleaned = [];
  for(const line of kept){
    let s = line;
    if(LIST_MARKER.test(s)){ s = s.replace(LIST_MARKER, ""); markers++; }
    s = s.trim();
    if(s) cleaned.push(s);
  }

  const seen = new Set(); const names = []; let dupes = 0;
  for(const n of cleaned){
    const k = n.toLowerCase();
    if(seen.has(k)){ dupes++; continue; }
    seen.add(k); names.push(n);
  }
  return { names, indented, markers, dupes, blank };
}

async function bulkAddNodes(parentId, names, kind){
  // ⚠ An empty list would POST `[]`, and PostgREST answers `[]` — which the
  // refusal check in saveOp reads as "the database declined this write". It
  // would be a false alarm on a request that should never have been sent.
  if(!names || !names.length) return [];
  // A pasted block keeps the order it was pasted in — that order is the whole
  // reason someone pasted a list rather than typing names one at a time.
  const base = nextSortOrder(parentId);
  const k = forcedChildKind(parentId) || kind || KIND_CAP;
  const rows = names.map((name, i) => ({
    project_id: S.projectId, parent_id: parentId, name, kind: k,
    is_evaluable: true, is_essential: true, sort_order: base + i
  }));
  const res = await saveOp(() => api("nodes", {
    method: "POST",
    headers: { ...H, "Prefer": "return=representation" },
    body: JSON.stringify(rows)
  }));
  if(!res) return null;
  const created = await res.json();
  created.forEach(c => S.nodes.push(c));
  if(parentId) S.collapsed.delete(parentId);
  return created;
}

function pastePreview(info, parentNode, onConfirm, kind){
  const names = info.names;
  const parentLabel = parentNode ? "“" + parentNode.name + "”" : "the top level";

  const existing = new Set(
    (parentNode ? childrenOf(parentNode.id) : roots()).map(n => n.name.toLowerCase())
  );
  const collide = names.filter(n => existing.has(n.toLowerCase()));

  const sorted = names.slice().sort((a,b) => a.localeCompare(b));
  const alreadyAlpha = names.every((n,i) => n === sorted[i]);

  const ov = el("div","overlay");
  const modal = el("div","modal");
  const head = el("div","mhead");
  head.appendChild(el("h3", null, "Add " + names.length + " children under " + parentLabel + "?"));
  const x = el("button","x","×"); head.appendChild(x);
  modal.appendChild(head);

  const body = el("div","mbody");

  if(names.length > 50){
    const big = el("div","pv-big", names.length + " lines — that is a lot to undo one at a time.");
    body.appendChild(big);
  }

  const list = el("div","pv-list");
  const show = names.length > 50 ? names.slice(0,20) : names;
  show.forEach(n => list.appendChild(el("span","pv-item", n)));
  if(show.length < names.length){
    list.appendChild(el("span","pv-more", "…and " + (names.length - show.length) + " more"));
  }
  body.appendChild(list);

  const warn = (cls, txt) => body.appendChild(el("div","pv-note " + cls, txt));
  if(info.indented)
    warn("warn", "⚠ Lines appeared indented — all " + names.length +
                 " will be added at the same level under " + parentLabel + ".");
  if(info.markers)
    warn("warn", "⚠ Bullets or numbering removed from " + info.markers +
                 " line" + (info.markers>1?"s":"") + " — check the names above.");
  if(info.dupes)
    warn("warn", "⚠ " + info.dupes + " duplicate line" + (info.dupes>1?"s":"") + " removed.");
  if(collide.length)
    warn("warn", "⚠ Already under " + parentLabel + ": " + collide.slice(0,4).join(", ") +
                 (collide.length>4 ? " and " + (collide.length-4) + " more" : "") +
                 ". They will be added again.");
  if(!alreadyAlpha)
    warn("info", "ℹ Children display alphabetically, not in paste order.");

  const bar = el("div","pv-bar");
  const ok = el("button","btn", "Add " + names.length);
  const no = el("button","btn ghost", "Cancel");
  bar.appendChild(ok); bar.appendChild(no);
  body.appendChild(bar);

  modal.appendChild(body); ov.appendChild(modal); document.body.appendChild(ov);
  ok.focus();

  const close = () => { document.removeEventListener("keydown", key); ov.remove(); };
  const key = e => {
    if(e.key === "Escape"){ e.preventDefault(); close(); }
    if(e.key === "Enter"){ e.preventDefault(); go(); }
  };
  const go = async () => {
    ok.disabled = true; no.disabled = true; ok.textContent = "Adding…";
    const created = await bulkAddNodes(parentNode ? parentNode.id : null, names, kind);
    close();
    if(created) onConfirm(created);
  };
  ok.addEventListener("click", go);
  no.addEventListener("click", close);
  x.addEventListener("click", close);
  ov.addEventListener("click", e => { if(e.target === ov) close(); });
  document.addEventListener("keydown", key);
}

// Returns true if it handled the paste (multi-line); false to let the browser
// paste normally.
// `kind` matters only when the paste creates the FIRST children of a node —
// pasting a list of field names is exactly that case. Once siblings exist,
// bulkAddNodes takes the kind from them and ignores this.
function handleMultiPaste(e, parentNode, onConfirm, kind){
  const text = (e.clipboardData || window.clipboardData).getData("text") || "";
  if(!/\n/.test(text.trim())) return false;          // single line — behave as today
  const info = parsePaste(text);
  if(info.names.length < 2) return false;            // nothing multi-line survived cleaning
  e.preventDefault();
  pastePreview(info, parentNode, onConfirm, kind);
  return true;
}

/* ---------- NOTES TO ADMINISTRATOR (B14) ----------
   One free-text message from an evaluator to the administrator, anchored to the
   node that prompted it. Deliberately UNTYPED — no categories, no kinds. Typed
   discussion flags clutter the screen and evaluators end up guessing which one
   to pick; one box, one purpose.

   This replaces two backlog ideas: B12 ("possible decomposition" flag — that's
   just a note) and B1 (wish-list flag — a mis-capture of "put this on the
   backlog").

   The affordance has to live in the MATRIX, not only the Build pane: the tree
   is hidden in Evaluate mode, which is exactly where an evaluator is sitting
   when they realise a node needs decomposing. ------------------------------ */

function openNotesFor(nodeId){
  return S.notes.filter(x => x.node_id === nodeId && x.status === "open");
}
function openNoteCount(){
  return S.notes.filter(x => x.status === "open").length;
}
function refreshNoteBadge(){
  const b = $("notesbtn"); if(!b) return;
  const n = openNoteCount();
  b.textContent = n ? "✉ Notes (" + n + ")" : "✉ Notes";
  b.classList.toggle("hasnotes", n > 0);
}

// small dot shown on a node that already carries an open note, so the same
// thing doesn't get flagged three times by three people
function noteDot(node){
  const open = openNotesFor(node.id);
  if(!open.length) return null;
  const d = el("span", "notedot", "●");
  d.title = open.length + " open note" + (open.length>1?"s":"") + " — " +
            open.map(x => x.evaluator).join(", ");
  return d;
}

function noteButton(node, onDone){
  const b = el("button", "notebtn", "✉");
  b.title = "Send a note about “" + node.name + "” to the administrator";
  b.addEventListener("click", e => { e.stopPropagation(); noteComposer(node, onDone); });
  return b;
}

function noteComposer(node, onDone){
  const ov = el("div","overlay");
  const modal = el("div","modal");
  const head = el("div","mhead");
  head.appendChild(el("h3", null, "Note to administrator"));
  const x = el("button","x","×"); head.appendChild(x);
  modal.appendChild(head);

  const body = el("div","mbody");
  body.appendChild(el("div","kv", "About: " + pathOf(node)));

  const ta = el("textarea","notearea");
  ta.placeholder = "What should the administrator know? e.g. “this needs further decomposition — there are at least two ways to assign a driver”";
  ta.rows = 5;
  body.appendChild(ta);

  const who = el("div","kv", "From " + (S.evaluator || "unattributed") +
    " — change this in the Evaluate bar if it's not you.");
  body.appendChild(who);

  const msg = el("div","smsg");
  const bar = el("div","pv-bar");
  const send = el("button","btn","Send");
  const cancel = el("button","btn ghost","Cancel");
  bar.appendChild(send); bar.appendChild(cancel);
  body.appendChild(bar); body.appendChild(msg);

  modal.appendChild(body); ov.appendChild(modal); document.body.appendChild(ov);
  ta.focus();

  const close = () => { document.removeEventListener("keydown", key); ov.remove(); };
  const key = e => { if(e.key === "Escape"){ e.preventDefault(); close(); } };
  document.addEventListener("keydown", key);

  const go = async () => {
    const text = ta.value.trim();
    if(!text){ msg.className = "smsg bad"; msg.textContent = "Write something first."; return; }
    send.disabled = true; cancel.disabled = true; send.textContent = "Sending…";
    const mine = await ensureMyEvaluator();
    const row = {
      project_id: S.projectId, node_id: node.id, body: text,
      evaluator: S.evaluator || "unattributed",
      evaluator_id: mine ? mine.id : null
    };
    const res = await saveOp(() => api("admin_notes", {
      method: "POST",
      headers: { ...H, "Prefer": "return=representation" },
      body: JSON.stringify(row)
    }));
    if(!res){
      send.disabled = false; cancel.disabled = false; send.textContent = "Send";
      msg.className = "smsg bad";
      msg.textContent = "Couldn't send — has 06_admin_notes.sql been run?";
      return;
    }
    S.notes.push((await res.json())[0]);
    close(); refreshNoteBadge();
    if(onDone) onDone();
  };
  send.addEventListener("click", go);
  cancel.addEventListener("click", close);
  x.addEventListener("click", close);
  // Ctrl/Cmd+Enter sends without reaching for the mouse
  ta.addEventListener("keydown", e => { if(e.key === "Enter" && (e.ctrlKey || e.metaKey)) go(); });
}

function pathOf(node){
  const parts = []; let cur = node;
  while(cur){ parts.unshift(cur.name); cur = cur.parent_id ? nodeById(cur.parent_id) : null; }
  return parts.join(" › ");
}

function openNotesList(){
  let showResolved = false;
  const ov = el("div","overlay");
  const modal = el("div","modal");
  const head = el("div","mhead");
  head.appendChild(el("h3", null, "Notes to administrator"));
  const x = el("button","x","×"); x.addEventListener("click", () => ov.remove()); head.appendChild(x);
  modal.appendChild(head);
  const body = el("div","mbody"); modal.appendChild(body);

  const draw = () => {
    body.innerHTML = "";
    const all = S.notes.slice().sort((a,b) => (b.created_at||"").localeCompare(a.created_at||""));
    const open = all.filter(n => n.status === "open");
    const done = all.filter(n => n.status === "resolved");

    if(!open.length) body.appendChild(el("p", null, "No open notes."));

    const render = (list, resolved) => list.forEach(note => {
      const node = nodeById(note.node_id);
      const card = el("div", "notecard" + (resolved ? " done" : ""));

      const top = el("div","notehead");
      const link = el("button","notelink", node ? pathOf(node) : "(node deleted)");
      if(node){
        link.addEventListener("click", () => { ov.remove(); goTo(node.id); });
      } else { link.disabled = true; }
      top.appendChild(link);
      top.appendChild(el("span","notemeta", note.evaluator + " · " + auditWhen(note.created_at)));
      card.appendChild(top);

      card.appendChild(el("div","notebody", note.body));

      if(!resolved && atLeast("builder")){        // resolving a note is a builder act
        const slot = el("div","resolveslot");
        const act = el("button","btn ghost sm","Resolve");
        act.addEventListener("click", () => {
          slot.innerHTML = "";
          const ta = el("textarea","notearea resolvearea");
          ta.rows = 2;
          ta.placeholder = "What was done about it? (optional — Enter to resolve)";
          const row = el("div","pv-bar");
          const ok = el("button","btn sm","Resolve");
          const no = el("button","btn ghost sm","Cancel");
          row.appendChild(ok); row.appendChild(no);
          slot.appendChild(ta); slot.appendChild(row);
          ta.focus();
          no.addEventListener("click", () => { slot.innerHTML = ""; slot.appendChild(act); });
          const go = async () => {
            ok.disabled = true; no.disabled = true; ok.textContent = "…";
            const res = await saveOp(() => api("admin_notes?id=eq." + note.id, {
              method: "PATCH",
              headers: { ...H, "Prefer": "return=representation" },
              body: JSON.stringify({ status: "resolved", resolved_at: new Date().toISOString(),
                                     resolved_by: S.evaluator || "unattributed",
                                     resolution: ta.value.trim() || null })
            }));
            if(res){
              const upd = (await res.json())[0];
              const i = S.notes.findIndex(n => n.id === note.id);
              if(i >= 0) S.notes[i] = upd;
              refreshNoteBadge(); draw(); renderTree(); renderRight();
            } else {
              ok.disabled = false; no.disabled = false; ok.textContent = "Resolve";
            }
          };
          ok.addEventListener("click", go);
          ta.addEventListener("keydown", e => {
            if(e.key === "Escape"){ slot.innerHTML=""; slot.appendChild(act); }
            if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); go(); }
          });
        });
        slot.appendChild(act);
        card.appendChild(slot);
      } else {
        const foot = el("div","noteres");
        foot.textContent = note.resolution
          ? "Resolved by " + (note.resolved_by || "?") + " — " + note.resolution
          : "Resolved by " + (note.resolved_by || "?") + " — no comment recorded";
        if(!note.resolution) foot.classList.add("bare");
        card.appendChild(foot);
      }
      body.appendChild(card);
    });

    render(open, false);

    if(done.length){
      const t = el("button","btn ghost sm",
        (showResolved ? "Hide" : "Show") + " " + done.length + " resolved");
      t.style.marginTop = "14px";
      t.addEventListener("click", () => { showResolved = !showResolved; draw(); });
      body.appendChild(t);
      if(showResolved) render(done, true);
    }
  };
  draw();
  ov.appendChild(modal); document.body.appendChild(ov);
  ov.addEventListener("click", e => { if(e.target === ov) ov.remove(); });
}

/* ---------- SCREENSHOTS / EVIDENCE (S5) ----------
   Shared project evidence, not per-evaluator: one upload, visible to everyone.
   Attaches to any node; optionally tagged with the system it depicts (a
   workflow diagram or whiteboard photo depicts no single system).

   Where things live, and why:
     ADD  — Build pane only. Attaching is authoring work, and it is rare.
     VIEW — in place, from the Evaluate matrix. A corner fold on the cell for
            (node × system), opening a lightbox over the matrix. Viewing must
            not cost a mode switch: goTo() collapses you into Build, so a round
            trip loses scroll position, the domain filter and your place.
     The row's "⛶ add" button is the deliberate mode switch, for the rare case.

   Untagged screenshots have no cell to sit on, so they mark the row name.
------------------------------------------------------------------------- */

const SHOT_BUCKET = "screenshots";
const SHOT_MAX_BYTES = 5 * 1024 * 1024;

function shotsFor(nodeId, systemId){
  return S.shots.filter(x => x.node_id === nodeId &&
    (systemId === undefined ? true
     : systemId === null ? !x.system_id
     : x.system_id === systemId));
}
function shotUrl(path){
  return SUPABASE_URL + "/storage/v1/object/public/" + SHOT_BUCKET + "/" + path;
}

async function uploadShot(file, node, systemId, caption, msgEl){
  if(file.size > SHOT_MAX_BYTES){
    msgEl.className = "smsg bad";
    msgEl.textContent = "Too big (" + Math.round(file.size/1024/1024) + " MB). Limit is 5 MB.";
    return null;
  }
  const ext = (file.type.split("/")[1] || "png").replace("jpeg","jpg");
  // no Date.now-free constraint here; this runs in the browser
  const stamp = new Date().toISOString().replace(/[:.]/g,"-");
  const path = S.projectId + "/" + node.id + "/" + stamp + "." + ext;

  const res = await saveOp(() => fetch(
    SUPABASE_URL + "/storage/v1/object/" + SHOT_BUCKET + "/" + path, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: H.Authorization,
                 "Content-Type": file.type || "image/png", "x-upsert": "false" },
      body: file
    }));
  if(!res){
    msgEl.className = "smsg bad";
    const why = lastSaveError || "";
    msgEl.textContent = /row-level security|Unauthorized|403/i.test(why)
      ? "Upload blocked by storage security. The bucket needs an INSERT policy — run 08_storage_policies.sql. (" + why.slice(0,120) + ")"
      : /404|Bucket not found/i.test(why)
      ? "No “" + SHOT_BUCKET + "” bucket found. Supabase → Storage → New bucket."
      : "Upload failed: " + (why.slice(0,180) || "unknown error — check the browser console");
    return null;
  }
  const row = await saveOp(() => api("screenshots", {
    method: "POST",
    headers: { ...H, "Prefer": "return=representation" },
    body: JSON.stringify({ project_id: S.projectId, node_id: node.id,
                           system_id: systemId || null,
                           storage_path: path, caption: caption || null })
  }));
  if(!row){
    msgEl.className = "smsg bad";
    msgEl.textContent = "Image uploaded but the record failed to save.";
    return null;
  }
  const created = (await row.json())[0];
  S.shots.push(created);
  return created;
}

// The single live paste handler. Module-level on purpose: it has to outlive
// the `box` it was created for, so the NEXT render can unregister it.
let shotPasteHandler = null;

function renderShotBlock(r, n){
  const box = el("div","block");
  box.appendChild(el("div","mvttl","Evidence — screenshots for this node"));
  box.appendChild(el("div","kv",
    "Shared with everyone on the project, not per-evaluator. Tag the system it "+
    "shows, or leave it untagged for a diagram or whiteboard photo."));

  const msg = el("div","smsg");
  const grid = el("div","shotgrid");

  const draw = () => {
    grid.innerHTML = "";
    const mine = shotsFor(n.id);
    if(!mine.length){ grid.appendChild(el("div","kv","None yet.")); return; }
    mine.forEach(sh => {
      const card = el("div","shotcard");
      const img = Object.assign(el("img"), { src: shotUrl(sh.storage_path), loading:"lazy" });
      img.addEventListener("click", () => shotLightbox(sh, n));
      card.appendChild(img);
      const sys = sh.system_id ? (S.systems.find(x=>x.id===sh.system_id)||{}).code : null;
      card.appendChild(el("div","shotmeta", (sys ? sys + " · " : "") +
        (sh.caption || "no caption")));
      if(!atLeast("admin")){ grid.appendChild(card); return; }   // deleting evidence is an administrative act
      const del = el("button","btn ghost sm","Delete");
      del.addEventListener("click", async () => {
        if(!confirm("Delete this screenshot? Evidence deletion is an administrative act.")) return;
        del.disabled = true;
        await saveOp(() => fetch(
          SUPABASE_URL + "/storage/v1/object/" + SHOT_BUCKET + "/" + sh.storage_path,
          { method:"DELETE", headers:{ apikey:SUPABASE_KEY, Authorization:H.Authorization } }));
        const ok = await saveOp(() => api("screenshots?id=eq." + sh.id, { method:"DELETE" }));
        if(ok){ S.shots = S.shots.filter(x => x.id !== sh.id); draw(); renderTree(); }
        else del.disabled = false;
      });
      card.appendChild(del);
      grid.appendChild(card);
    });
  };
  draw();
  box.appendChild(grid);

  // ---- add controls ----
  const bar = el("div","shotadd");
  const sysSel = el("select");
  sysSel.appendChild(Object.assign(el("option",null,"— no system (diagram, whiteboard) —"),{value:""}));
  S.systems.forEach(sy => sysSel.appendChild(Object.assign(el("option",null,sy.name),{value:sy.id})));
  const cap = Object.assign(el("input"), { placeholder:"Caption (optional)" });
  const pick = Object.assign(el("input"), { type:"file", accept:"image/*" });
  const pickBtn = el("button","btn ghost sm","Choose file…");
  pickBtn.addEventListener("click", () => pick.click());
  bar.appendChild(sysSel); bar.appendChild(cap); bar.appendChild(pickBtn); bar.appendChild(pick);
  box.appendChild(bar);

  const zone = el("div","shotzone");
  zone.tabIndex = 0;
  zone.textContent = "Click here and press Ctrl+V to paste a screenshot";
  box.appendChild(zone);
  box.appendChild(msg);

  const take = async (file) => {
    if(!file) return;
    msg.className = "smsg"; msg.textContent = "Uploading…";
    const created = await uploadShot(file, n, sysSel.value || null, cap.value.trim(), msg);
    if(created){
      msg.className = "smsg ok";
      msg.textContent = "Added.";
      cap.value = ""; pick.value = "";
      draw(); renderTree();
    }
  };
  pick.addEventListener("change", () => take(pick.files[0]));
  const grab = e => {
    const items = (e.clipboardData || {}).items || [];
    for(const it of items){
      if(it.type && it.type.startsWith("image/")){ e.preventDefault(); take(it.getAsFile()); return true; }
    }
    return false;
  };
  zone.addEventListener("click", () => zone.focus());

  // ⚠ NO `zone.addEventListener("paste", ...)`. There used to be one, and the
  // event BUBBLES: pasting into the focused zone fired the zone handler and
  // then the document handler below, uploading the same image twice.
  // e.preventDefault() does not stop propagation. The document handler alone
  // covers both cases, because the zone is inside the document.
  //
  // ⚠ AND THE OLD HANDLER IS REMOVED FIRST. It used to be stashed on `box`
  // — which is a NEW element on every render — and never unregistered, so
  // every node visited left another live listener behind, each closed over
  // its own stale node. Measured before the fix: one paste after visiting
  // three nodes produced FOUR uploads, attached to Node Three, Node One,
  // Node Two and Node Three. Not just duplicates: evidence landing on nodes
  // the user was not looking at.
  if(shotPasteHandler) document.removeEventListener("paste", shotPasteHandler);
  shotPasteHandler = e => {
    const t = e.target;
    if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    grab(e);
  };
  document.addEventListener("paste", shotPasteHandler);

  r.appendChild(box);
}

function shotLightbox(sh, node){
  const ov = el("div","overlay");
  const modal = el("div","modal shotmodal");
  const head = el("div","mhead");
  const sys = sh.system_id ? (S.systems.find(x=>x.id===sh.system_id)||{}).name : null;
  head.appendChild(el("h3", null, sys ? sys : "Evidence"));
  const x = el("button","x","×"); head.appendChild(x);
  modal.appendChild(head);
  const body = el("div","mbody");
  body.appendChild(Object.assign(el("img","shotfull"), { src: shotUrl(sh.storage_path) }));
  if(sh.caption) body.appendChild(el("div","shotcap", sh.caption));
  body.appendChild(el("div","shotmeta2",
    (node ? pathOf(node) : "") + " · added " + auditWhen(sh.created_at)));
  modal.appendChild(body); ov.appendChild(modal); document.body.appendChild(ov);

  const close = () => { document.removeEventListener("keydown", key); ov.remove(); };
  const key = e => { if(e.key === "Escape"){ e.preventDefault(); close(); } };
  document.addEventListener("keydown", key);
  x.addEventListener("click", close);
  ov.addEventListener("click", e => { if(e.target === ov) close(); });
}

// corner fold for a matrix cell that has evidence for this node × system
function shotFold(node, systemId){
  const list = shotsFor(node.id, systemId);
  if(!list.length) return null;
  const f = el("span","shotfold");
  f.title = list.length + " screenshot" + (list.length>1?"s":"") + " — click to view";
  f.addEventListener("click", e => { e.stopPropagation(); shotLightbox(list[0], node); });
  return f;
}

/* ---------- MODES ---------- */
function setMode(m){
  if(m!=="build") flushOrder();   // fire-and-forget: never block a mode switch on the network
  S.mode=m;
  document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  $("lefttitle").textContent = m==="build"?"Structure":(m==="evaluate"?"Evaluate":"Chart");
  // The left panel is hidden entirely in Evaluate, so the alias toggle only
  // makes sense in Build and Chart.
  $("aliasbtn").style.display = (m==="evaluate") ? "none" : "";
  syncAliasChrome();
  // Structure-editing controls are builder+. Hidden, not disabled: evaluators
  // are the largest and least technical group, and a clean screen beats a
  // screen full of things they can't touch.
  $("addbar").style.display  = (m==="build" && atLeast("builder"))?"flex":"none";
  $("rootbar").style.display = (m==="build" && atLeast("builder"))?"flex":"none";
  document.querySelector(".left").style.display = (m==="evaluate")?"none":"block";
  renderTree(); renderRight();
}

/* ---------- LOAD ---------- */
async function loadProjectData(){
  // everything scoped to the current project
  const pid=S.projectId;
  // scales for this project, then their values (two simple steps, no fancy join)
  const scRes=await api("scales?select=id&project_id=eq."+pid);
  const scales=await scRes.json();
  const scaleIds=scales.map(s=>s.id);
  let svPromise;
  if(scaleIds.length){
    svPromise=api("scale_values?select=*&order=sort_order&scale_id=in.("+scaleIds.join(",")+")");
  } else {
    svPromise=Promise.resolve({json:async()=>[]});
  }
  // node_rollup is deliberately NOT fetched. Colour comes from each node's own
  // rating (D9); the view remains in the database, read by nothing.
  const [n,sy,sv,ev,evl,al,nt,sc,ch]=await Promise.all([
    api("nodes?select=*&project_id=eq."+pid),
    api("systems?select=*&project_id=eq."+pid),
    svPromise,
    api("evaluations?select=*&project_id=eq."+pid),
    api("evaluators?select=*&project_id=eq."+pid+"&order=name"),
    api("aliases?select=*&project_id=eq."+pid),
    api("admin_notes?select=*&project_id=eq."+pid),
    api("screenshots?select=*&project_id=eq."+pid),
    api("channels?select=*&order=sort_order&project_id=eq."+pid)
  ]);
  S.nodes=await n.json(); S.systems=await sy.json(); S.scaleValues=await sv.json();
  S.evals=await ev.json(); S.evaluators=await evl.json();
  S.aliases=al.ok?await al.json():[];
  S.notes=nt.ok?await nt.json():[];
  S.shots=sc.ok?await sc.json():[];   // table may not exist until 06_admin_notes.sql is run
  S.channels=ch.ok?await ch.json():[];
  refreshNoteBadge();
  S.currentSystem = S.systems[0] ? S.systems[0].id : null;
  // Default to the current system's first channel. Recomputed rather than
  // remembered across projects — a channel id from another project would
  // silently match nothing and grey the whole tree.
  S.currentChannel = (currentChannelFor(S.currentSystem) || {}).id || null;
  // Identity comes from the session, not from a picker. Re-derived per project
  // because membership is per-project: the same login can be a different
  // evaluator row (or none) in a different project.
  setIdentityFromSession();
  const sp=$("syspick"); sp.innerHTML="";
  S.systems.forEach(s=>sp.appendChild(Object.assign(el("option",null,s.name),{value:s.id})));
  await loadMeaningChanges();
  $("status").textContent=S.nodes.length+" nodes · "+S.systems.length+" system(s) · "
    +S.channels.length+" channel(s)";
}

async function reload(){ await loadProjectData(); renderTree(); renderRight(); }

async function loadProjectList(selectId){
  const pr=await api("projects?select=*&order=created_at");
  S.projects=await pr.json();
  const pp=$("projpick"); pp.innerHTML="";
  S.projects.forEach(p=>pp.appendChild(Object.assign(el("option",null,p.name),{value:p.id})));
  // choose which project is active: requested, or last-used, or first
  let want = selectId || localStorage.getItem("cct_project") || (S.projects[0]&&S.projects[0].id);
  if(!S.projects.some(p=>p.id===want)) want = S.projects[0] && S.projects[0].id;
  S.projectId = want;
  if(want){ pp.value=want; localStorage.setItem("cct_project", want); }
}

async function switchProject(pid){
  await flushOrder();          // reload() replaces S.nodes; an unsaved order would vanish
  S.projectId=pid; S.currentId=null; S.collapsed=new Set(); S.evalDomain="all"; S.coEvaluator=null;
  $("nodesearch").value=""; closeSearch();
  localStorage.setItem("cct_project", pid);
  await reload();
}

/* ---------- SETTINGS (project config) ---------- */
function openSettings(){
  const ov=el("div","overlay");
  const modal=el("div","modal wide");
  const head=el("div","mhead");
  head.appendChild(Object.assign(el("h3",null,"Project Settings"),{}));
  const x=el("button","x","×"); x.addEventListener("click",()=>ov.remove()); head.appendChild(x);
  modal.appendChild(head);
  const body=el("div","mbody"); modal.appendChild(body);

  const tabs=el("div","stab");
  const tSys=el("button",null,"Systems"); tSys.classList.add("on");
  const tEval=el("button",null,"Evaluators");
  const tScale=el("button",null,"Support scale");
  tabs.appendChild(tSys); tabs.appendChild(tEval); tabs.appendChild(tScale); body.appendChild(tabs);
  const panel=el("div"); body.appendChild(panel);

  const setOn=b=>{ [tSys,tEval,tScale].forEach(x=>x.classList.remove("on")); b.classList.add("on"); };
  tSys.addEventListener("click",()=>{ setOn(tSys); renderSystemsPanel(panel); });
  tEval.addEventListener("click",()=>{ setOn(tEval); renderEvaluatorsPanel(panel); });
  tScale.addEventListener("click",()=>{ setOn(tScale); renderScalePanel(panel); });

  renderSystemsPanel(panel);
  ov.appendChild(modal);
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
}

function renderSystemsPanel(panel){
  panel.innerHTML="";
  panel.appendChild(el("p",null,"Systems you're evaluating against. The 3-character code is used in compact/bulk views."));
  const tbl=el("table","syslist");
  const thead=el("tr"); ["Name","Code",""].forEach(h=>thead.appendChild(el("th",null,h))); tbl.appendChild(thead);
  S.systems.forEach(s=>{
    const tr=el("tr");
    const nmTd=el("td"); const nm=Object.assign(el("input"),{value:s.name});
    nm.addEventListener("change",()=>updateSystem(s,{name:nm.value.trim()},msg));
    nmTd.appendChild(nm); tr.appendChild(nmTd);
    const cdTd=el("td"); const cd=Object.assign(el("input","codeinp"),{value:s.code||"",maxLength:3});
    cd.addEventListener("input",()=>{ cd.value=cd.value.toUpperCase().slice(0,3); });
    cd.addEventListener("change",()=>updateSystem(s,{code:cd.value.trim().toUpperCase()||null},msg));
    cdTd.appendChild(cd); tr.appendChild(cdTd);
    const delTd=el("td"); const del=el("button","del","Delete");
    del.addEventListener("click",()=>deleteSystem(s,panel,msg));
    delTd.appendChild(del); tr.appendChild(delTd);
    tbl.appendChild(tr);
  });
  panel.appendChild(tbl);

  const add=el("div","addsys");
  const nm=Object.assign(el("input","nm"),{placeholder:"New system name"});
  const cd=Object.assign(el("input","cd"),{placeholder:"COD",maxLength:3});
  cd.addEventListener("input",()=>{ cd.value=cd.value.toUpperCase().slice(0,3); });
  const btn=el("button","btn sm","Add system");
  const msg=el("div","smsg");
  btn.addEventListener("click",async()=>{
    const name=nm.value.trim(), code=cd.value.trim().toUpperCase()||null;
    if(!name){ msg.className="smsg bad"; msg.textContent="Enter a system name."; return; }
    const res=await saveOp(()=>api("systems",{method:"POST",headers:{...H,"Prefer":"return=representation"},
      body:JSON.stringify({project_id:S.projectId,name,code})}));
    if(res){ const created=(await res.json())[0]; S.systems.push(created); nm.value=""; cd.value="";
      msg.className="smsg ok"; msg.textContent="Added "+name+"."; renderSystemsPanel(panel); refreshSystemPickers(); }
    else { msg.className="smsg bad"; msg.textContent="Couldn't add — that code may already be used in this project."; }
  });
  add.appendChild(nm); add.appendChild(cd); add.appendChild(btn);
  panel.appendChild(add); panel.appendChild(msg);

  /* ---- B18: channels, per system ---- */
  panel.appendChild(el("h4","chanh","Channels"));
  panel.appendChild(el("p","chansub",
    "A channel is a way a system is reached — who is using it (audience) and how they get to it "
    + "(surface). Each becomes a column group in Evaluate. "
    + "A system only lists the channels it actually offers, so a missing one already means "
    + "“doesn’t exist in that form” — there is no need for a “not applicable” rating."));
  S.systems.forEach(s=>renderChannelBlock(panel, s, msg));
}

const AUDIENCE_HINTS = ["Office","Customer","Driver","Partner"];
const SURFACE_HINTS  = ["Desktop","Web","App","Phone"];

function renderChannelBlock(panel, s, msg){
  const box=el("div","chanblock");
  box.appendChild(el("div","chansys", s.name + (s.code?" ("+s.code+")":"")));
  const list=channelsFor(s.id);

  if(!list.length){
    // ⚠ Not cosmetic. channel_id is NOT NULL, so a system with no channels
    // cannot be rated at all — say so here rather than letting the matrix
    // silently drop its columns.
    box.appendChild(el("div","smsg bad",
      "No channels — this system cannot be rated until it has at least one."));
  }

  const tbl=el("table","syslist");
  const th=el("tr"); ["Audience","Surface","Short name","Description",""]
    .forEach(h=>th.appendChild(el("th",null,h)));
  tbl.appendChild(th);

  list.forEach(c=>{
    const tr=el("tr");
    const mk=(val, hints, key, maxLen)=>{
      const td=el("td");
      const inp=Object.assign(el("input"),{value:val||""});
      if(maxLen) inp.maxLength=maxLen;
      if(hints){
        const id="dl_"+key+"_"+c.id;
        inp.setAttribute("list", id);
        const dl=el("datalist"); dl.id=id;
        hints.forEach(h=>dl.appendChild(Object.assign(el("option"),{value:h})));
        td.appendChild(dl);
      }
      inp.addEventListener("change",()=>updateChannel(c,{[key]:inp.value.trim()},panel,msg));
      td.appendChild(inp); return td;
    };
    tr.appendChild(mk(c.audience,   AUDIENCE_HINTS, "audience"));
    tr.appendChild(mk(c.surface,    SURFACE_HINTS,  "surface"));
    tr.appendChild(mk(c.short_name, null,           "short_name", 8));
    tr.appendChild(mk(c.description,null,           "description"));
    const delTd=el("td"); const del=el("button","del","Delete");
    del.addEventListener("click",()=>deleteChannel(c,s,panel,msg));
    delTd.appendChild(del); tr.appendChild(delTd);
    tbl.appendChild(tr);
  });
  box.appendChild(tbl);

  const addRow=el("div","addsys");
  const aud=Object.assign(el("input","nm"),{placeholder:"Audience (Office, Customer, Driver…)"});
  const srf=Object.assign(el("input","nm"),{placeholder:"Surface (Desktop, Web, App…)"});
  const shn=Object.assign(el("input","cd"),{placeholder:"Short",maxLength:8});
  const b=el("button","btn sm","Add channel");
  b.addEventListener("click",async()=>{
    const audience=aud.value.trim(), surface=srf.value.trim();
    if(!audience || !surface){
      msg.className="smsg bad"; msg.textContent="A channel needs both an audience and a surface."; return;
    }
    const short_name=(shn.value.trim() || audience).slice(0,8);
    const res=await saveOp(()=>api("channels",{method:"POST",
      headers:{...H,"Prefer":"return=representation"},
      body:JSON.stringify({ project_id:s.project_id, system_id:s.id, audience, surface, short_name,
                            sort_order:(list.length?Math.max(...list.map(x=>x.sort_order||0)):0)+1 })}));
    if(res){
      S.channels.push((await res.json())[0]);
      msg.className="smsg ok"; msg.textContent="Added "+audience+" · "+surface+" to "+s.name+".";
      renderSystemsPanel(panel); refreshSystemPickers();
    } else {
      msg.className="smsg bad";
      msg.textContent="Couldn’t add — "+(lastSaveError||"that audience and surface pair may already exist on this system.");
    }
  });
  addRow.appendChild(aud); addRow.appendChild(srf); addRow.appendChild(shn); addRow.appendChild(b);
  box.appendChild(addRow);
  panel.appendChild(box);
}

async function updateChannel(c, patch, panel, msg){
  const res=await saveOp(()=>api("channels?id=eq."+c.id,
    {method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(patch)}));
  if(res){ Object.assign(c,(await res.json())[0]);
    if(msg){ msg.className="smsg ok"; msg.textContent="Saved."; }
    refreshSystemPickers();
  } else if(msg){
    msg.className="smsg bad";
    msg.textContent="Couldn’t save — "+(lastSaveError||"that audience and surface pair may already exist on this system.");
  }
}

async function deleteChannel(c, s, panel, msg){
  // ⚠ evaluations.channel_id cascades. Count first and say the number out loud
  // — "its evaluations will be removed too" is not the same warning as "this
  // deletes 41 ratings".
  const n = S.evals.filter(e=>e.channel_id===c.id).length;
  const warn = "Delete channel “"+channelLabel(c)+"” from "+s.name+"?"
    + (n ? "\n\n⚠ This also deletes "+n+" rating"+(n>1?"s":"")+" recorded against it. "
           + "That cannot be undone from here." : "\n\nIt has no ratings.");
  if(!confirm(warn)) return;
  const res=await saveOp(()=>api("channels?id=eq."+c.id,{method:"DELETE"}));
  if(res){
    S.channels=S.channels.filter(x=>x.id!==c.id);
    S.evals=S.evals.filter(e=>e.channel_id!==c.id);
    if(S.currentChannel===c.id) S.currentChannel=null;
    renderSystemsPanel(panel); refreshSystemPickers();
  } else if(msg){
    msg.className="smsg bad"; msg.textContent="Couldn’t delete — "+(lastSaveError||"refused.");
  }
}

async function updateSystem(s,patch,msg){
  const res=await saveOp(()=>api("systems?id=eq."+s.id,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(patch)}));
  if(res){ Object.assign(s,(await res.json())[0]); refreshSystemPickers(); if(msg){msg.className="smsg ok"; msg.textContent="Saved.";} }
  else if(msg){ msg.className="smsg bad"; msg.textContent="Couldn't save — that code may already be in use."; }
}
async function deleteSystem(s,panel,msg){
  if(!confirm("Delete system “"+s.name+"”? Its evaluations will be removed too."))return;
  const res=await saveOp(()=>api("systems?id=eq."+s.id,{method:"DELETE"}));
  if(res){ S.systems=S.systems.filter(x=>x.id!==s.id); renderSystemsPanel(panel); refreshSystemPickers(); }
  else if(msg){ msg.className="smsg bad"; msg.textContent="Couldn't delete."; }
}
function refreshSystemPickers(){
  const sp=$("syspick"); const cur=sp.value; sp.innerHTML="";
  S.systems.forEach(s=>sp.appendChild(Object.assign(el("option",null,s.name+(s.code?" ("+s.code+")":"")),{value:s.id})));
  if(S.systems.some(s=>s.id===cur)) sp.value=cur; else if(S.systems[0]){ sp.value=S.systems[0].id; S.currentSystem=S.systems[0].id; }
  $("status").textContent=S.nodes.length+" nodes · "+S.systems.length+" system(s) · "
    +S.channels.length+" channel(s)";
  if(S.mode!=="build") renderTree();
  renderRight();
}

function renderEvaluatorsPanel(panel){
  panel.innerHTML="";
  panel.appendChild(el("p",null,
    "Who may evaluate in this project. Each row should be linked to a login \u2014 "+
    "an unlinked row is inert: nobody can ever sign in as it."));

  const tbl=el("table","syslist");
  const thead=el("tr"); ["Name","Login","Assigned system"].forEach(h=>thead.appendChild(el("th",null,h)));
  tbl.appendChild(thead);

  const msg=el("div","smsg");

  S.evaluators.forEach(ev=>{
    const tr=el("tr");

    // Name is now READ-ONLY here. Renaming an evaluator orphans every rating
    // they made, because the app still matches ratings on the name text. Until
    // reads move to evaluator_id, this field is a loaded gun.
    const nmTd=el("td"); nmTd.appendChild(el("span",null,ev.name));
    if(myEvaluatorFor() && myEvaluatorFor().id===ev.id){
      const you=el("span","mini"); you.textContent="you"; you.style.marginLeft="6px";
      nmTd.appendChild(you);
    }
    tr.appendChild(nmTd);

    // Linked or not. This is the distinction that matters under RLS: a row with
    // no user_id cannot be signed in as, and cannot own a rating.
    const linkTd=el("td");
    if(ev.user_id){
      const ok=el("span","mini leaf","linked");
      ok.title="Linked to a login. This person can sign in and rate.";
      linkTd.appendChild(ok);
    } else {
      const no=el("span","mini hold","no login");
      no.title="Not linked to any account \u2014 inert. Link it in cct-admin.html.";
      linkTd.appendChild(no);
    }
    tr.appendChild(linkTd);

    // The assigned system stays editable: it is a working decision a facilitator
    // makes mid-session, and it restricts nothing \u2014 it only outlines their
    // column in the matrix.
    const sysTd=el("td"); const sysSel=el("select");
    sysSel.appendChild(Object.assign(el("option",null,"\u2014 none \u2014"),{value:""}));
    S.systems.forEach(s=>sysSel.appendChild(Object.assign(el("option",null,s.name),{value:s.id})));
    sysSel.value=ev.default_system_id||"";
    sysSel.title="A usability hint \u2014 their column is outlined in the matrix. It does not gate access.";
    sysSel.addEventListener("change",()=>updateEvaluator(ev,{default_system_id:sysSel.value||null},msg));
    sysTd.appendChild(sysSel); tr.appendChild(sysTd);

    tbl.appendChild(tr);
  });
  panel.appendChild(tbl);

  // Adding and removing people is deliberately NOT here.
  //
  // To add someone you must choose WHICH LOGIN they are, and auth.users is not
  // exposed to this API \u2014 only the cct-admin Edge Function can list accounts.
  // The old "Add evaluator" box created name-only rows with no user_id: inert,
  // indistinguishable from real membership in this list, and exactly how "Chip"
  // and "Seebo" became two people for the same human. Divergence D8.
  const hint=el("div","kv"); hint.style.marginTop="12px";
  hint.innerHTML = "<b>Adding or removing people happens in <code>cct-admin.html</code></b>, "+
    "the local administration app \u2014 because linking a person to a login needs the "+
    "account list, which only the server can see. Names are set there too: renaming "+
    "someone here would orphan every rating they have made.";
  panel.appendChild(hint);
  panel.appendChild(msg);
}
async function updateEvaluator(ev,patch,msg){
  const res=await saveOp(()=>api("evaluators?id=eq."+ev.id,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(patch)}));
  if(res){ Object.assign(ev,(await res.json())[0]); if(msg){msg.className="smsg ok"; msg.textContent="Saved.";} }
  else if(msg){ msg.className="smsg bad"; msg.textContent="Couldn't save."; }
}
// No longer reachable from the UI \u2014 removing a membership happens in
// cct-admin.html, where the consequence (their ratings become unowned) can be
// spelled out against a named account. Kept so nothing else breaks.
async function deleteEvaluator(ev,panel){
  if(!confirm("Remove evaluator “"+ev.name+"”? (Their existing ratings stay.)"))return;
  const res=await saveOp(()=>api("evaluators?id=eq."+ev.id,{method:"DELETE"}));
  if(res){ S.evaluators=S.evaluators.filter(x=>x.id!==ev.id); renderEvaluatorsPanel(panel); }
}

function renderScalePanel(panel){
  panel.innerHTML="";
  // The lock: once any rating exists, the scale's meaning is load-bearing.
  // Renaming, reordering or deleting a value would silently rewrite what past
  // judgments say. Adding stays allowed — additive change can't invalidate an
  // existing rating, the same reasoning that lets nodes be added after a
  // branch is marked evaluation-ready.
  const locked = S.evals.length > 0;
  const scaleId = S.scaleValues[0] ? S.scaleValues[0].scale_id : null;

  if(locked){
    const note=el("div","msg ok");
    note.style.display="block";
    note.textContent="Locked — "+S.evals.length+" rating"+(S.evals.length>1?"s":"")+
      " already use this scale. Colors can still be changed and new values added; "+
      "renaming and reordering are blocked because they would silently change what past ratings mean. "+
      "A value no rating uses can still be deleted — it has nothing to orphan.";
    panel.appendChild(note);
  } else {
    panel.appendChild(el("p",null,"No ratings exist yet, so the scale is fully editable. Once the first rating is saved it locks: colors and additions stay open, edits to existing values do not."));
  }
  panel.appendChild(el("p",null,"Order runs best → worst. That order defines the roll-up: a parent scores as its weakest essential descendant."));

  const msg=el("div","smsg");
  const tbl=el("table","syslist");
  const thead=el("tr"); ["","Label","Color",""].forEach(h=>thead.appendChild(el("th",null,h))); tbl.appendChild(thead);

  S.scaleValues.forEach((v,i)=>{
    const tr=el("tr");

    // reorder
    const ordTd=el("td");
    if(!locked){
      const up=el("button","btn ghost sm","↑"); up.disabled = i===0;
      const dn=el("button","btn ghost sm","↓"); dn.disabled = i===S.scaleValues.length-1;
      up.addEventListener("click",()=>swapScale(i,i-1,panel));
      dn.addEventListener("click",()=>swapScale(i,i+1,panel));
      dn.style.marginLeft="4px";
      ordTd.appendChild(up); ordTd.appendChild(dn);
    } else {
      ordTd.appendChild(el("span","kv",String(i+1)));
    }
    tr.appendChild(ordTd);

    // how many ratings actually reference this value — decides whether deleting
    // it can hurt anything
    const uses=S.evals.filter(e=>e.scale_value_id===v.id).length;

    // label
    const labTd=el("td");
    if(locked){
      labTd.appendChild(el("span",null,v.label));
      const u=el("span","kv", uses ? "  "+uses+" rating"+(uses>1?"s":"") : "  unused");
      u.style.marginLeft="8px"; if(!uses) u.style.color="var(--muted)";
      labTd.appendChild(u);
    }
    else{
      const inp=Object.assign(el("input"),{value:v.label});
      inp.style.width="180px";
      inp.addEventListener("change",()=>updateScaleValue(v,{label:inp.value.trim()||v.label},msg,panel));
      labTd.appendChild(inp);
    }
    tr.appendChild(labTd);

    // color — editable even when locked; a color carries no meaning a rating depends on
    const colTd=el("td");
    const col=Object.assign(el("input"),{type:"color",value:v.color||"#cccccc"});
    col.style.cssText="width:44px;height:28px;padding:2px;";
    col.addEventListener("change",()=>updateScaleValue(v,{color:col.value},msg,panel));
    colTd.appendChild(col);
    tr.appendChild(colTd);

    // delete
    const delTd=el("td");
    // The lock exists to stop ratings being orphaned or re-meant. A value that
    // NO rating uses can do neither, so deleting it stays safe even when locked.
    if(!locked || uses===0){
      const d=el("button","btn ghost sm","Delete");
      if(locked) d.title="Safe to delete — no rating uses this value";
      d.addEventListener("click",async()=>{
        if(!confirm("Delete the “"+v.label+"” value from the scale?")) return;
        const res=await saveOp(()=>api("scale_values?id=eq."+v.id,{method:"DELETE"}));
        if(res){ S.scaleValues=S.scaleValues.filter(x=>x.id!==v.id); renderScalePanel(panel); }
      });
      delTd.appendChild(d);
    }
    tr.appendChild(delTd);
    tbl.appendChild(tr);
  });
  panel.appendChild(tbl);
  panel.appendChild(msg);

  // add — allowed even when locked
  if(scaleId){
    const add=el("div","addbar"); add.style.marginTop="12px";
    const nm=Object.assign(el("input"),{placeholder:"New value label (added as worst)"});
    const cl=Object.assign(el("input"),{type:"color",value:"#cccccc"});
    cl.style.cssText="width:44px;height:34px;padding:2px;";
    const btn=el("button","btn sm","Add value");
    const doAdd=async()=>{
      const label=nm.value.trim(); if(!label) return;
      const maxOrder=S.scaleValues.reduce((m,v)=>Math.max(m,v.sort_order||0),0);
      const res=await saveOp(()=>api("scale_values",{method:"POST",headers:{...H,"Prefer":"return=representation"},
        body:JSON.stringify({scale_id:scaleId,label,color:cl.value,sort_order:maxOrder+1})}));
      if(res){ S.scaleValues.push((await res.json())[0]); nm.value=""; renderScalePanel(panel); }
      else { msg.className="smsg bad"; msg.textContent="Couldn't add — a value with that label may already exist."; }
    };
    btn.addEventListener("click",doAdd);
    nm.addEventListener("keydown",e=>{ if(e.key==="Enter") doAdd(); });
    add.appendChild(nm); add.appendChild(cl); add.appendChild(btn);
    panel.appendChild(add);
    if(locked) panel.appendChild(el("div","kv","A new value is added as the worst option. Evaluators who rated earlier never saw it, so consider whether earlier ratings deserve a second look."));
  } else {
    panel.appendChild(el("div","kv","No support scale exists for this project yet."));
  }
}

async function updateScaleValue(v,patch,msg,panel){
  const res=await saveOp(()=>api("scale_values?id=eq."+v.id,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},
    body:JSON.stringify(patch)}));
  if(res){
    Object.assign(v,(await res.json())[0]);
    msg.className="smsg ok"; msg.textContent="Saved.";
    renderTree(); renderRight();       // colors and labels show up everywhere
  } else { msg.className="smsg bad"; msg.textContent="Couldn't save — that label may already be in use."; }
}

// Swap two values' sort_order. Order is the roll-up's definition of "worse",
// so this is only reachable before any rating exists.
async function swapScale(i,j,panel){
  const a=S.scaleValues[i], b=S.scaleValues[j];
  const ao=a.sort_order, bo=b.sort_order;
  // Prefer: return=representation is not decoration — without it PostgREST
  // answers 204, and a refused write looks exactly like a successful one.
  const r1=await saveOp(()=>api("scale_values?id=eq."+a.id,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify({sort_order:bo})}));
  if(!r1) return;
  const r2=await saveOp(()=>api("scale_values?id=eq."+b.id,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify({sort_order:ao})}));
  if(!r2) return;
  a.sort_order=bo; b.sort_order=ao;
  S.scaleValues.sort((x,y)=>x.sort_order-y.sort_order);
  renderScalePanel(panel);
}

/* ---------- TYPE-AHEAD NODE SEARCH ---------- */
let searchHits=[], searchIdx=-1;
function escHtml(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function closeSearch(){ $("searchresults").classList.remove("open"); searchHits=[]; searchIdx=-1; }
function runSearch(){
  const q=$("nodesearch").value.trim().toLowerCase();
  const box=$("searchresults");
  if(!q){ closeSearch(); return; }
  // whole-word-ish starts rank above mid-word matches; then shallower nodes first
  searchHits=S.nodes
    .map(n=>({n,i:n.name.toLowerCase().indexOf(q)}))
    .filter(h=>h.i>=0)
    .sort((a,b)=> (a.i-b.i) || a.n.name.length-b.n.name.length || a.n.name.localeCompare(b.n.name))
    .slice(0,12);
  box.innerHTML="";
  if(!searchHits.length){
    box.appendChild(el("div","snone","No node matches “"+$("nodesearch").value.trim()+"”"));
    box.classList.add("open"); searchIdx=-1; return;
  }
  searchHits.forEach((h,idx)=>{
    const row=el("div","sres");
    const nm=el("span","sname");
    const raw=h.n.name;
    nm.innerHTML=escHtml(raw.slice(0,h.i))+"<mark>"+escHtml(raw.substr(h.i,q.length))+"</mark>"+escHtml(raw.slice(h.i+q.length));
    row.appendChild(nm);
    const parent=nodeById(h.n.parent_id);
    row.appendChild(el("span","spath", parent?pathOf(parent):"top level"));
    row.addEventListener("mouseenter",()=>{ searchIdx=idx; paintSearch(); });
    row.addEventListener("click",()=>chooseHit(idx));
    box.appendChild(row);
  });
  searchIdx=0; paintSearch();
  box.classList.add("open");
}
function paintSearch(){
  [...$("searchresults").children].forEach((c,i)=>c.classList.toggle("active",i===searchIdx));
}
function chooseHit(idx){
  const h=searchHits[idx]; if(!h) return;
  $("nodesearch").value=""; closeSearch();
  goTo(h.n.id);
}
$("nodesearch").addEventListener("input",runSearch);
$("nodesearch").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    if(!searchHits.length) return;
    e.preventDefault();
    searchIdx=(searchIdx+(e.key==="ArrowDown"?1:-1)+searchHits.length)%searchHits.length;
    paintSearch();
    $("searchresults").children[searchIdx].scrollIntoView({block:"nearest"});
  } else if(e.key==="Enter"){ e.preventDefault(); chooseHit(searchIdx); }
  else if(e.key==="Escape"){ $("nodesearch").value=""; closeSearch(); $("nodesearch").blur(); }
});
document.addEventListener("click",e=>{ if(!e.target.closest(".searchwrap")) closeSearch(); });
// "/" focuses search from anywhere you're not already typing
document.addEventListener("keydown",e=>{
  if(e.key!=="/"||e.metaKey||e.ctrlKey) return;
  const t=e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT") return;
  if(S.mode!=="build") return;
  e.preventDefault(); $("nodesearch").focus();
});

/* ---------- EVALUATION READINESS & STALE RATINGS ----------
   The original design froze a subtree and blocked meaning-changing edits. With
   the audit log recording every change, that enforcement is heavier than it
   needs to be: `evaluation_ready` is now a SIGNAL ("this branch is settled,
   start rating"), edits are warned about rather than blocked, and any rating
   they undermine is flagged stale automatically. Staleness is computed from
   the log, never stored.                                                     */
// ⚠ PARKED 2026-08-30 by Seebo's decision, not deleted. Flip to true to revive.
//
// The idea: editing a node's name, problem_solved or parent changes what a
// rating MEANT, so ratings made before that edit get flagged "stale" for
// review. It works, and it is off because the concept needs rethinking rather
// than because it is broken -- so it is one line to bring back.
//
// `details` is deliberately NOT in this list. Seebo: details do not change
// meaning. It describes how something works; it does not redefine what "Full
// support" would mean, which is problem_solved's job.
//
// While false: no stale flags, no "N stale ratings" button, and no
// meaning-changed confirmation when editing a node. Nothing is lost -- the
// audit log still records every edit, so turning this back on recomputes the
// whole history from scratch.
const MEANING_TRACKING = false;
const MEANING_FIELDS=["name","problem_solved","parent_id"];   // not is_essential/is_evaluable:
                                                              // those change roll-up, not meaning
async function loadMeaningChanges(){
  S.meaningChanges={};
  if(!MEANING_TRACKING) return;   // parked; staleFor() and allStale() then find nothing
  try{
    const r=await api("audit_log?table_name=eq.nodes&action=eq.UPDATE&project_id=eq."+S.projectId+
                      "&select=row_id,changed_at,old_row,new_row&order=changed_at.desc&limit=2000");
    if(!r.ok) return;                       // audit_log not installed yet — degrade quietly
    const rows=await r.json();
    rows.forEach(e=>{                        // ordered newest first, so first hit per node wins
      const fields=MEANING_FIELDS.filter(f=>
        JSON.stringify((e.old_row||{})[f])!==JSON.stringify((e.new_row||{})[f]));
      if(!fields.length) return;
      if(!S.meaningChanges[e.row_id]) S.meaningChanges[e.row_id]={ at:e.changed_at, fields };
    });
  }catch{ /* connection pill already reports the failure */ }
}
// A rating is stale when its node's meaning moved after the rating was last touched.
function staleFor(ev){
  const mc=S.meaningChanges[ev.node_id]; if(!mc) return null;
  const rated=ev.updated_at||ev.created_at; if(!rated) return null;
  return new Date(mc.at) > new Date(rated) ? mc : null;
}
function allStale(){
  return S.evals.map(e=>({e,mc:staleFor(e)})).filter(x=>x.mc);
}
// evaluation_ready is stored on a subtree root; descendants inherit by walking up
// Everything is ready by default. What inherits is the HOLD: the nearest
// ancestor (or the node itself) that has been deliberately unchecked.
function holdRoot(n){ if(!n.evaluation_ready) return n; return ancestorsOf(n.id).find(a=>!a.evaluation_ready)||null; }
function isHeld(n){ return !!holdRoot(n); }
// How many ratings ride on this node and everything under it — the number that
// makes "are you sure" a real question rather than a reflex.
function ratingsUnder(id){
  const ids=descendantIds(id);
  return S.evals.filter(e=>ids.has(e.node_id)).length;
}

/* ---------- NODE HISTORY (audit_log, backlog #13) ----------
   Two queries: the node's own row history, plus rating history for that node
   (evaluations reference it via node_id inside the JSONB payload). Merged into
   one timeline, because "what changed here" means both.                      */
const AUDIT_HIDE=new Set(["id","project_id","created_at","top_domain_id","proposal_id"]);
const FIELD_LABEL={ name:"Name", problem_solved:"Problem solved", parent_id:"Parent",
  is_evaluable:"Evaluable", is_essential:"Essential", evaluation_ready:"Evaluation-ready",
  kind:"Kind", details:"Details", sort_order:"Position",
  scale_value_id:"Rating", evaluator:"Evaluator", co_evaluator:"Co-evaluator",
  note:"Note", system_id:"System" };

function auditValue(field,v){
  if(v===null||v===undefined||v==="") return "—";
  if(field==="parent_id"){ const p=nodeById(v); return p?p.name:"(removed node)"; }
  if(field==="scale_value_id"){ const sv=svById(v); return sv?sv.label:"(removed value)"; }
  if(field==="system_id"){ const s=S.systems.find(x=>x.id===v); return s?(s.code||s.name):"(removed system)"; }
  if(v===true) return "yes"; if(v===false) return "no";
  return String(v);
}
function auditWhen(ts){
  const d=new Date(ts);
  return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function auditDiff(e){
  const out=[];
  const keys=new Set([...Object.keys(e.old_row||{}),...Object.keys(e.new_row||{})]);
  keys.forEach(k=>{
    if(AUDIT_HIDE.has(k)) return;
    const a=(e.old_row||{})[k], b=(e.new_row||{})[k];
    if(JSON.stringify(a)===JSON.stringify(b)) return;
    out.push({ field:FIELD_LABEL[k]||k, from:auditValue(k,a), to:auditValue(k,b) });
  });
  return out;
}

async function openHistory(n){
  const ov=el("div","overlay");
  const modal=el("div","modal");
  const head=el("div","mhead");
  head.appendChild(el("h3",null,"History — "+n.name));
  const x=el("button","x","×"); x.addEventListener("click",()=>ov.remove()); head.appendChild(x);
  modal.appendChild(head);
  const body=el("div","mbody"); modal.appendChild(body);
  body.appendChild(el("div","kv","Loading…"));
  ov.appendChild(modal);
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);

  let rows=[];
  try{
    const [own,rat]=await Promise.all([
      api("audit_log?row_id=eq."+n.id+"&order=changed_at.desc&limit=200"),
      api("audit_log?table_name=eq.evaluations&or=(new_row->>node_id.eq."+n.id+",old_row->>node_id.eq."+n.id+")&order=changed_at.desc&limit=200")
    ]);
    if(!own.ok) throw new Error(await own.text());
    rows=[...await own.json(), ...(rat.ok?await rat.json():[])]
         .sort((a,b)=> new Date(b.changed_at)-new Date(a.changed_at));
  }catch(err){
    body.innerHTML="";
    body.appendChild(el("div","msg bad","Couldn't load history: "+err+
      "\n\nIf audit_log doesn't exist yet, run 02_audit_log.sql in Supabase."));
    return;
  }

  body.innerHTML="";
  if(!rows.length){
    body.appendChild(el("div","kv","No recorded changes. History starts from when the audit triggers were installed — anything before that wasn't captured."));
    return;
  }
  rows.forEach(e=>{
    const item=el("div","hitem");
    const top=el("div","hhead");
    const what = e.table_name==="evaluations" ? "Rating" : "Node";
    const verb = e.action==="INSERT"?"created" : e.action==="DELETE"?"deleted" : "changed";
    top.appendChild(el("span","hact"+(e.action==="DELETE"?" bad":""), what+" "+verb));
    top.appendChild(el("span","hwhen",auditWhen(e.changed_at)));
    top.appendChild(el("span","hwho", e.actor || "unattributed"));
    item.appendChild(top);

    if(e.action==="UPDATE"){
      const diffs=auditDiff(e);
      diffs.forEach(d=>{
        const row=el("div","hdiff");
        row.appendChild(el("span","hfield",d.field));
        row.appendChild(el("span","hold",d.from));
        row.appendChild(el("span","harrow","→"));
        row.appendChild(el("span","hnew",d.to));
        item.appendChild(row);
      });
      if(!diffs.length) item.appendChild(el("div","kv","(no visible field changes)"));
    } else {
      const snap=e.new_row||e.old_row||{};
      const bits=Object.keys(snap).filter(k=>!AUDIT_HIDE.has(k) && snap[k]!==null && snap[k]!=="")
        .map(k=>(FIELD_LABEL[k]||k)+": "+auditValue(k,snap[k]));
      item.appendChild(el("div","hsnap",bits.join("  ·  ")));
    }
    body.appendChild(item);
  });

  const foot=el("div","kv");
  foot.style.marginTop="14px";
  foot.textContent="Attribution is blank until authentication exists — the log records what and when reliably, but not yet who.";
  body.appendChild(foot);
}

/* ---------- STALE RATINGS REPORT ---------- */
function openStaleReport(){
  const ov=el("div","overlay");
  const modal=el("div","modal");
  const head=el("div","mhead");
  head.appendChild(el("h3",null,"Ratings needing review"));
  const x=el("button","x","×"); x.addEventListener("click",()=>ov.remove()); head.appendChild(x);
  modal.appendChild(head);
  const body=el("div","mbody"); modal.appendChild(body);

  const rows=allStale().sort((a,b)=> new Date(b.mc.at)-new Date(a.mc.at));
  body.appendChild(el("p",null,"These ratings were made before their node last changed meaning. Nothing is wrong with them automatically — they just haven't been checked since the node moved under them."));

  const tbl=el("table","syslist");
  const th=el("tr"); ["Node","System","Evaluator","Rating","Changed","When"].forEach(h=>th.appendChild(el("th",null,h))); tbl.appendChild(th);
  rows.forEach(({e,mc})=>{
    const n=nodeById(e.node_id); if(!n) return;
    const sys=S.systems.find(s=>s.id===e.system_id);
    const sv=svById(e.scale_value_id);
    const tr=el("tr");
    const nameTd=el("td");
    const link=el("button","btn ghost sm",n.name);
    link.addEventListener("click",()=>{ ov.remove(); goTo(n.id); });
    nameTd.appendChild(link); tr.appendChild(nameTd);
    tr.appendChild(el("td",null,sys?(sys.code||sys.name):"—"));
    tr.appendChild(el("td",null,e.evaluator||"—"));
    tr.appendChild(el("td",null,sv?sv.label:"—"));
    tr.appendChild(el("td",null,mc.fields.map(f=>FIELD_LABEL[f]||f).join(", ")));
    tr.appendChild(el("td",null,auditWhen(mc.at)));
    tbl.appendChild(tr);
  });
  body.appendChild(tbl);
  body.appendChild(el("div","kv","Re-rating clears the flag: staleness compares the node's last meaning change against when the rating was last touched."));

  ov.appendChild(modal);
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
}

async function boot(){
  // Auth first, so every request below carries the token if there is one.
  loadSession();
  await ensureFreshSession();
  renderWhoAmI();

  // No session: the login box is the app. Not dismissible — signed-out stopped
  // being a usable state at step 2b, which is what makes the gating testable
  // before RLS is switched on.
  if(!SESSION){ showLogin(null,{dismissible:false}); return; }

  await loadRole();
  renderWhoAmI();
  applyRoleToChrome();   // before the no-role branch: an account with no role must not see admin chrome either

  // Signed in but no profile row: fail closed. Deliberately does not load the
  // project — RLS is off, so nothing else would stop this account seeing data.
  if(!S.role){
    setConn("ok"); $("status").textContent="No role assigned";
    document.querySelector(".left").style.display="none";   // nothing loaded, nothing to add to
    document.querySelectorAll(".mode").forEach(b=>b.style.display="none");
    const box=el("div","empty");
    box.appendChild(el("div",null,"Your account has no role yet."));
    box.appendChild(el("div","kv","An administrator has to grant one before you can see or change anything. "+
      "Signed in as "+((SESSION.user||{}).email||"")+"."));
    $("right").appendChild(box);
    return;
  }

  try{
    await loadProjectList();
    if(!S.projectId){
      // no projects at all — offer to make one
      setConn("ok"); $("status").textContent="No projects yet";
      $("right").appendChild(el("div","empty","No projects yet. Click “+ Project” to create one."));
      return;
    }
    await loadProjectData();
    setConn("ok");
    $("projpick").addEventListener("change",e=>switchProject(e.target.value));
    $("syspick").addEventListener("change",()=>{
      S.currentSystem=$("syspick").value;
      // Channels belong to a system, so the remembered one is meaningless
      // after a switch. Re-derive rather than carry a dangling id.
      S.currentChannel=(currentChannelFor(S.currentSystem)||{}).id||null;
      renderTree(); renderRight();
    });
    $("aliasbtn").addEventListener("click",()=>{
      if(!S.aliasMode && !S.systems.length){
        flashNav("No systems yet — aliases are a system's own word for a node. Add systems in ⚙ Settings first.");
        return;
      }
      S.aliasMode = !S.aliasMode;
      syncAliasChrome();
      renderTree();
    });
    setMode("build");
  }catch(err){
    setConn("bad", isNetworkError(err) ? "Offline" : "DB error");
    $("status").textContent="Load failed";
    $("right").appendChild(el("div","msg bad",String(err)));
  }
}

document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
$("retrybtn").addEventListener("click",async()=>{ if(lastFailedOp){ const op=lastFailedOp; await saveOp(op); } });
$("settingsbtn").addEventListener("click",openSettings);
$("notesbtn").addEventListener("click",openNotesList);
$("quickaddbtn").addEventListener("click",quickAdd);
$("quickadd").addEventListener("keydown",e=>{ if(e.key==="Enter")quickAdd(); });
$("quickadd").addEventListener("paste",e=>{
  handleMultiPaste(e, nodeById(S.currentId), created=>{
    $("quickadd").value="";
    renderTree(); renderRight(); $("quickadd").focus();
    flashNav("Added "+created.length+" children"+(S.currentId?" under "+nodeById(S.currentId).name:"")+".");
  });
});

$("newprojbtn").addEventListener("click",async()=>{
  const name=prompt("Name of the new project:");
  if(!name||!name.trim())return;
  let copyFromId=null;
  if(S.projects.length){
    const copy=confirm("Copy the systems and support scale from your current project?\n\nOK = copy config from “"+
      (S.projects.find(p=>p.id===S.projectId)||{}).name+"”\nCancel = start blank");
    if(copy) copyFromId=S.projectId;
  }
  try{
    // 1. create the project
    const pRes=await api("projects",{method:"POST",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify({name:name.trim()})});
    if(!pRes.ok) throw new Error(await pRes.text());
    const newProj=(await pRes.json())[0];

    if(copyFromId){
      // 2a. copy systems
      const sysRes=await api("systems?select=name,code&project_id=eq."+copyFromId);
      const sys=await sysRes.json();
      if(sys.length){
        await api("systems",{method:"POST",headers:H,body:JSON.stringify(sys.map(s=>({project_id:newProj.id,name:s.name,code:s.code})))});
      }
      // 2b. copy the support scale + its values
      const scRes=await api("scales?select=*&project_id=eq."+copyFromId);
      const scales=await scRes.json();
      for(const sc of scales){
        const newScRes=await api("scales",{method:"POST",headers:{...H,"Prefer":"return=representation"},
          body:JSON.stringify({project_id:newProj.id,name:sc.name,kind:sc.kind})});
        const newSc=(await newScRes.json())[0];
        const vRes=await api("scale_values?select=label,color,sort_order&scale_id=eq."+sc.id);
        const vals=await vRes.json();
        if(vals.length){
          await api("scale_values",{method:"POST",headers:H,
            body:JSON.stringify(vals.map(v=>({scale_id:newSc.id,label:v.label,color:v.color,sort_order:v.sort_order})))});
        }
      }
    }
    // 3. switch to the new project
    await loadProjectList(newProj.id);
    await switchProject(newProj.id);
  }catch(err){ alert("Could not create project: "+err); }
});

$("newrootbtn").addEventListener("click",async()=>{
  const name=prompt("Name of the new top-level domain:");
  if(!name||!name.trim())return;
  // A top-level domain is always a capability. Never a choice.
  const body={ project_id:S.projectId, parent_id:null, name:name.trim(), kind:KIND_CAP,
               is_evaluable:true, is_essential:true, sort_order:nextSortOrder(null) };
  const res=await api("nodes",{method:"POST",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(body)});
  if(res.ok){ const created=(await res.json())[0]; S.nodes.push(created); S.currentId=created.id; renderTree(); renderRight(); }
  else alert("Could not create domain: "+(await res.text()));
});
boot();
