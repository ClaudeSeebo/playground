<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harmony Dispatch Simulator</title>
<meta name="description" content="Harmony auto-dispatch simulator. Every number on screen is computed by the optimizer. Try to break it.">
<style>
/* Harmony — design language.
   Dark operations console. Density over decoration. Colour carries meaning:
   teal is the system speaking, amber is risk, red is a broken constraint,
   violet is a proposal that has not been accepted yet. */

:root{
  color-scheme:dark;   /* the page commits to a dark console; tell the host chrome */
  --bg:#080b0f; --bg2:#0d1218; --panel:#111823; --panel2:#141d29;
  --line:#1e2a38; --line2:#27384a;
  --ink:#e8eef5; --ink2:#93a5b8; --ink3:#5f7286;
  --teal:#2fdcc4; --teal-d:#0f3f3a;
  --amber:#f7b955; --amber-d:#3d2f13;
  --red:#ff5f6d; --red-d:#3d1720;
  --violet:#9b8cff; --violet-d:#241f45;
  --gold:#e9c777;
  --arrival:#3aa9ff; --departure:#5ad2a0; --waitreturn:#c68cf0; --hourly:#8fa2b8;
  /* trip lifecycle - a deliberate ramp, not five arbitrary hues:
     dormant slate -> in motion -> waiting at the curb -> client aboard -> receded */
  --st-dispatched:#5c6b7e; --st-enroute:#3f93d8; --st-onlocation:#e08a3c;
  --st-onboard:#2fbf9e;    --st-complete:#2c3a44; --st-missed:#ff5f6d;
  --st-unassigned:#7a5560; --st-affiliate:#6b6480;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --rowh:34px;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  display:flex; flex-direction:column; min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.eyebrow{margin:0 0 6px;font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--ink3)}
.hidden{display:none !important}

/* ---------- top bar ---------- */
.top{
  display:flex;align-items:center;gap:22px;padding:0 18px;height:54px;
  background:linear-gradient(180deg,#0e141c,#0a0f15);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.mark{display:flex;flex-direction:column;gap:2.5px;width:19px}
.mark i{display:block;height:3px;border-radius:2px;background:var(--teal);margin-left:auto;
  animation:settle 5s ease-in-out infinite}
.mark i:nth-child(1){width:100%;animation-delay:0s}
.mark i:nth-child(2){width:62%;animation-delay:.35s}
.mark i:nth-child(3){width:82%;animation-delay:.7s}
@keyframes settle{0%,72%,100%{width:100%}18%{width:52%}40%{width:78%}}
.wordmark{font:600 17px/1 var(--sans);letter-spacing:-.02em}
.tag{font:600 9px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);
  border:1px solid var(--line2);border-radius:3px;padding:4px 6px}

.days{display:flex;gap:6px;flex:1 1 auto}
.days button{
  display:flex;flex-direction:column;gap:1px;padding:6px 12px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel);min-width:132px;text-align:left;
  transition:border-color .15s,background .15s;
}
.days button:hover{border-color:var(--line2)}
.days button b{font:600 12px/1.3 var(--sans)}
.days button small{font:500 10px/1.3 var(--mono);color:var(--ink3);letter-spacing:.04em}
.days button.on{background:#16222f;border-color:var(--teal);box-shadow:inset 0 0 0 1px rgba(47,220,196,.18)}
.days button.on small{color:var(--teal)}
.days button.hard.on{border-color:var(--red)} .days button.hard.on small{color:var(--red)}

.topright{display:flex;align-items:center;gap:14px}
.clockbox{display:flex;align-items:center;gap:9px}
.clockval{font:600 17px/1 var(--mono);letter-spacing:.02em}
.speeds{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.speeds button{padding:4px 8px;font:600 10px/1 var(--mono);color:var(--ink3)}
.speeds button.on{background:var(--teal-d);color:var(--teal)}
.statepill{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:20px;
  border:1px solid var(--teal);background:rgba(47,220,196,.08);
  font:600 10px/1 var(--mono);letter-spacing:.1em;color:var(--teal);white-space:nowrap}
.statepill i{width:6px;height:6px;border-radius:50%;background:currentColor;
  box-shadow:0 0 0 0 currentColor;animation:beat 2.4s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(47,220,196,.5)}70%{box-shadow:0 0 0 7px rgba(47,220,196,0)}100%{box-shadow:0 0 0 0 rgba(47,220,196,0)}}
.statepill.risk{border-color:var(--amber);background:rgba(247,185,85,.08);color:var(--amber)}
.statepill.bad{border-color:var(--red);background:rgba(255,95,109,.08);color:var(--red)}

/* ---------- brief ---------- */
.brief{padding:11px 18px;border-bottom:1px solid var(--line);background:var(--bg2);
  color:var(--ink2);font-size:12.5px;max-width:1600px}
.brief b{color:var(--ink)}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border-bottom:1px solid var(--line)}
.kpi{background:var(--bg2);padding:10px 14px;min-width:0}
.kpi span{display:block;font:600 9px/1 var(--mono);letter-spacing:.11em;color:var(--ink3);margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi strong{display:block;font:600 21px/1.1 var(--sans);letter-spacing:-.02em}
.kpi em{display:block;font:500 10.5px/1.4 var(--mono);color:var(--ink3);font-style:normal;margin-top:3px}
.kpi em.up{color:var(--teal)} .kpi em.down{color:var(--red)} .kpi em.warn{color:var(--amber)}
.kpi strong.warn{color:var(--amber)} .kpi strong.bad{color:var(--red)} .kpi strong.good{color:var(--teal)}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:1px;background:var(--line);flex:1 1 auto;min-height:0}
.board{background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0}
.boardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.boardhead h2{font-size:14px}
.boardhead p{margin:2px 0 0;font:500 11px/1 var(--mono);color:var(--ink3)}
.boardtools{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.key{display:flex;gap:11px;flex-wrap:wrap;justify-content:flex-end}
.key span{display:flex;align-items:center;gap:5px;font:500 10px/1 var(--mono);color:var(--ink3)}
.sw{width:11px;height:8px;border-radius:2px;display:block}
.sw.st-dispatched{background:var(--st-dispatched)} .sw.st-enroute{background:var(--st-enroute)}
.sw.st-onlocation{background:var(--st-onlocation)} .sw.st-onboard{background:var(--st-onboard)}
.sw.st-complete{background:var(--st-complete)}
.sw.vipk{background:var(--gold);height:11px;width:11px;transform:rotate(45deg);border-radius:2px}
.sw.ghostk{background:transparent;border:1px dashed var(--violet);height:9px}
.bubbles{display:flex;gap:5px;align-items:center}
.bub{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;
  font:600 10px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);
  transition:border-color .15s,color .15s,background .15s}
.bub:hover{border-color:var(--ink3);color:var(--ink2)}
.bub.on{border-color:var(--teal);color:var(--teal);background:rgba(47,220,196,.09)}
.bub.auto.on{border-color:var(--violet);color:var(--violet);background:rgba(155,140,255,.1)}
.bub.near{border-color:var(--violet);color:var(--violet);background:rgba(155,140,255,.07)}
.angleread{font:600 9px/1 var(--mono);letter-spacing:.1em;color:var(--ink3);
  min-width:118px;text-align:right;white-space:nowrap}
.gear{width:26px;height:26px;border:1px solid var(--line2);border-radius:6px;color:var(--ink3);
  font-size:13px;line-height:1;transition:border-color .15s,color .15s}
.gear:hover{border-color:var(--teal);color:var(--teal)}

/* ---------- board setup popover ----------
   Anchored to the board, not a modal: colour and speed are judged by looking at
   the bars, so the bars have to stay visible while they change. */
.board{position:relative}
.setup{position:absolute;top:4px;right:16px;z-index:30;width:310px;
  background:var(--panel);border:1px solid var(--line2);border-radius:8px;
  padding:14px 16px 16px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.setup[hidden]{display:none}
.setuphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.setuphead b{font:600 12px/1 var(--sans)}
.setupclose{font-size:19px;color:var(--ink3);line-height:1}
.setupclose:hover{color:var(--ink)}
.setup h5{margin:16px 0 7px;font:600 9px/1 var(--mono);letter-spacing:.13em;color:var(--ink3);
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.setupnote{margin:6px 0 0;font:500 10px/1.5 var(--sans);color:var(--ink3)}
.slots{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.slot{display:flex;align-items:center;gap:8px}
.slotno{flex:0 0 16px;font:600 10px/1 var(--mono);color:var(--ink3);text-align:center}
.slot select{flex:1 1 auto;min-width:0;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line2);border-radius:5px;padding:6px 7px;font:500 11px/1 var(--sans)}
.slot input[type=color]{flex:0 0 30px;height:26px;padding:0;border:1px solid var(--line2);
  border-radius:5px;background:var(--panel2);cursor:pointer}
.bystatus{flex:0 0 auto;font:600 8.5px/1 var(--mono);letter-spacing:.06em;color:var(--ink3);
  border:1px dashed var(--line2);border-radius:5px;padding:7px 4px}
.segrow{display:flex;gap:5px}
.segrow button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:5px;
  padding:7px 5px;font:600 9.5px/1.2 var(--mono);color:var(--ink3)}
.segrow button.on{border-color:var(--teal);color:var(--teal);background:#132824}
.sliderow{display:flex;align-items:center;gap:10px}
.sliderow input[type=range]{flex:1 1 auto;accent-color:var(--teal);min-width:0}
#spdRead{flex:0 0 auto;font:600 10px/1 var(--mono);color:var(--ink2);min-width:78px;text-align:right}
.keyrow{display:flex;align-items:center;gap:14px;justify-content:flex-end;flex-wrap:wrap}
.filter{display:flex;align-items:center;gap:6px;font:500 10.5px/1 var(--mono);color:var(--ink2);cursor:pointer}
.filter input{accent-color:var(--teal);margin:0}

.axis{position:relative;height:22px;margin-left:150px;border-bottom:1px solid var(--line);flex:0 0 auto}
.axis b{position:absolute;top:5px;transform:translateX(-50%);font:500 10px/1 var(--mono);color:var(--ink3)}
.axis i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}

.gridwrap{position:relative;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0}
.rows{position:relative}
.vrow{display:flex;height:var(--rowh);border-bottom:1px solid rgba(30,42,56,.55);position:relative}
.vrow:hover{background:rgba(255,255,255,.014)}
.vrow.oos{background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,95,109,.055) 8px 16px)}
.vrow.drop{background:rgba(47,220,196,.07);box-shadow:inset 0 0 0 1px var(--teal)}
.vrow.nodrop{background:rgba(255,95,109,.07);box-shadow:inset 0 0 0 1px var(--red)}
.vlabel{flex:0 0 150px;display:flex;align-items:center;gap:8px;padding:0 10px;
  border-right:1px solid var(--line);min-width:0;position:sticky;left:0;background:var(--bg);z-index:2}
.vrow:hover .vlabel{background:#0a0f14}
.vlabel .cls{font:600 9px/1 var(--mono);padding:3px 4px;border-radius:3px;letter-spacing:.05em;flex:0 0 auto}
.cls.sedan{background:#17242f;color:#79a9c9} .cls.suv{background:#1a2333;color:#8f9ff0}
.cls.van{background:#231e33;color:#bb96e6}
.vmeta{min-width:0;line-height:1.25}
.vmeta b{display:block;font:600 11px/1.2 var(--mono);letter-spacing:.02em}
.vmeta small{display:block;font:500 9.5px/1.2 var(--sans);color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmeta small.t3{color:var(--gold)} .vmeta small.t1{color:var(--ink3)}
.vmeta small.none{color:var(--red)}
.track{position:relative;flex:1 1 auto;min-width:0}

/* ---------- trip prism ----------
   The bar is a triangular prism turning on its long axis. Three faces, three
   overlays. Perspective sits on each bar rather than the track: one shared
   vanishing point across a 1400px board would skew the right-hand bars into
   nonsense. Apothem for a 3-gon of side 25px is 25/(2*tan60) = 7.22px. */
.trip{position:absolute;top:4px;height:calc(var(--rowh) - 9px);cursor:grab;
  perspective:280px;white-space:nowrap;font:500 10px/1 var(--sans);
  --bar:var(--st-dispatched); --barink:#05090d;
  transition:left .5s cubic-bezier(.4,0,.2,1),width .5s cubic-bezier(.4,0,.2,1),opacity .2s}
.prism{position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateX(var(--rot,0deg));
  /* duration is set from JS (HARMONY.timing.rotateMs); the curve stays here.
     Strong ease-in-out on purpose: the middle of a turn is unreadable at any
     speed, so cross it fast and decelerate into the face. */
  transition:transform 850ms cubic-bezier(.65,0,.3,1)}
.face{position:absolute;inset:0;border-radius:3px;border:1px solid rgba(0,0,0,.28);
  background:var(--fbg,var(--bar));color:var(--fink,var(--barink));
  display:flex;align-items:center;gap:4px;padding:0 5px;overflow:hidden;
  backface-visibility:hidden;
  transform:rotateX(calc(var(--i) * -120deg)) translateZ(7.22px)}
/* a bar too narrow to carry a face does not turn at all */
.trip.flat .prism{transform:none;transition:none}
.trip.flat .face{transform:none;backface-visibility:visible}
.trip:hover{z-index:6}
.trip:hover .face{filter:brightness(1.15)}

.trip .ref{font:600 9.5px/1 var(--mono);opacity:.62;flex:0 0 auto}
.trip .svc{font-size:9px;opacity:.55;flex:0 0 auto}
.trip .nm{overflow:hidden;text-overflow:ellipsis;font-weight:600}
.trip .nm.swap{animation:swapin .3s ease-out}
@keyframes swapin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* status paints the whole solid, not one face */
.trip.st-dispatched{--bar:var(--st-dispatched);--barink:#e8eef5}
.trip.st-enroute{--bar:var(--st-enroute)}
.trip.st-onlocation{--bar:var(--st-onlocation)}
.trip.st-onboard{--bar:var(--st-onboard)}
.trip.st-complete{--bar:var(--st-complete);--barink:#7e8f9e}
.trip.st-missed{--bar:var(--st-missed);--barink:#fff}
.trip.st-unassigned{--bar:var(--st-unassigned);--barink:#f2dde2}
.trip.st-affiliate{--bar:var(--st-affiliate);--barink:#efe9f7}
.trip.broken{--bar:var(--red);--barink:#fff}
.trip.broken .face{background:var(--red);color:#fff;
  box-shadow:0 0 0 1px var(--red),0 0 12px rgba(255,95,109,.35)}
.trip.vip .face{box-shadow:inset 0 0 0 1.5px var(--gold)}
.trip.late .face{box-shadow:inset 0 0 0 1.5px var(--amber)}
.trip.vip .face::after{content:"c6";font-size:8px;color:#4a3a0a;margin-left:auto}
.trip.locked .face::before{content:"7";font-size:9px;opacity:.7;margin-right:1px}
.trip.committed{cursor:default}
.trip.dim{opacity:.16}
.trip.moving{outline:2px solid var(--violet);outline-offset:1px}
.trip.injected{animation:pop .55s ease-out}
@keyframes pop{0%{transform:scale(.75);opacity:0}100%{transform:scale(1);opacity:1}}

/* a rotated element photographs badly as a drag image; this flat stand-in
   is handed to setDragImage instead */
.dragghost{position:fixed;left:-9999px;top:0;border-radius:3px;padding:0 5px;
  display:flex;align-items:center;gap:4px;font:600 10px/1 var(--sans);
  border:1px solid rgba(0,0,0,.28);overflow:hidden;white-space:nowrap}

.ghost{position:absolute;top:4px;height:calc(var(--rowh) - 9px);border-radius:3px;
  border:1px dashed var(--violet);background:rgba(155,140,255,.13);
  font:600 9.5px/1 var(--mono);color:var(--violet);display:flex;align-items:center;
  padding:0 5px;overflow:hidden;pointer-events:none;z-index:5;animation:fade .35s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

.nowline{position:absolute;top:0;bottom:0;width:1px;background:var(--teal);z-index:8;
  pointer-events:none;box-shadow:0 0 9px rgba(47,220,196,.55)}
.nowline b{position:absolute;top:0;left:3px;font:600 9px/1 var(--mono);color:var(--teal);
  background:var(--bg);padding:2px 3px;letter-spacing:.06em}

.unrow{border-top:1px solid var(--line2);background:#150f14;min-height:var(--rowh);
  display:flex;position:relative}
.unrow .vlabel{background:#150f14;flex:0 0 150px}
.unrow .vlabel b{color:var(--red)}
.unrow .track{padding:4px 0}
.unrow .trip{position:relative;display:inline-flex;top:0;margin:0 4px 4px 0;height:22px}
.unrow .track{display:flex;flex-wrap:wrap;align-items:flex-start;overflow-x:auto}

/* ---------- intelligence panel ---------- */
.intel{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.intelhead{display:flex;justify-content:space-between;align-items:flex-start;
  padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.intelhead h2{font-size:14px}
.log{flex:1 1 auto;overflow-y:auto;padding:10px 14px;font-family:var(--mono);font-size:11px;min-height:120px}
.li{display:flex;gap:9px;padding:5px 0;border-bottom:1px solid rgba(30,42,56,.4);animation:slide .25s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.li time{flex:0 0 58px;color:var(--ink3);font-size:10px;padding-top:1px}
.li .body{min-width:0;flex:1 1 auto}
.li b{display:block;font-weight:600;font-size:11px;color:var(--ink)}
.li p{margin:2px 0 0;color:var(--ink2);font-size:10.5px;line-height:1.45;
  font-family:var(--sans);white-space:pre-wrap}
.li.sys b{color:var(--teal)} .li.warn b{color:var(--amber)} .li.bad b{color:var(--red)}
.li.ok b{color:var(--teal)}
.li .num{color:var(--teal);font-family:var(--mono)}
.li.run b::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--teal);margin-left:6px;animation:blink .8s steps(2) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.15}}

.proposal{border-top:1px solid var(--violet);background:linear-gradient(180deg,rgba(155,140,255,.09),transparent 70%);
  padding:11px 14px;max-height:44vh;overflow-y:auto;flex:0 0 auto}
.prophead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.proplabel{font:600 9px/1 var(--mono);letter-spacing:.14em;color:var(--violet)}
.prophead span:last-child{font:500 10px/1 var(--mono);color:var(--ink3)}
.propgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-bottom:9px}
.propgrid div{background:var(--panel2);padding:7px 9px}
.propgrid span{display:block;font:600 9px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);margin-bottom:4px}
.propgrid b{font:600 13px/1 var(--mono)}
.propgrid b.up{color:var(--teal)} .propgrid b.down{color:var(--red)} .propgrid b.flat{color:var(--ink2)}
.propmoves{font-family:var(--mono);font-size:10.5px;max-height:170px;overflow-y:auto;margin-bottom:10px}
.mv{display:flex;gap:7px;padding:5px 0;border-bottom:1px solid rgba(30,42,56,.5);cursor:pointer}
.mv:hover{background:rgba(155,140,255,.06)}
.mv .ar{color:var(--violet);flex:0 0 auto}
.mv .txt{min-width:0}
.mv .txt b{display:block;color:var(--ink);font-weight:600}
.mv .txt small{display:block;color:var(--ink3);font-family:var(--sans);font-size:10px;line-height:1.4;margin-top:1px}
.propact{display:flex;gap:7px}

.intelfoot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:7px;flex:0 0 auto}
.primary{background:var(--teal);color:#05201c;font:600 11px/1 var(--mono);letter-spacing:.09em;
  padding:10px 14px;border-radius:5px;transition:filter .15s}
.primary:hover{filter:brightness(1.12)} .primary:disabled{opacity:.4;cursor:default}
.ghostbtn{border:1px solid var(--line2);color:var(--ink2);font:600 10px/1 var(--mono);
  letter-spacing:.09em;padding:10px 12px;border-radius:5px;transition:border-color .15s,color .15s}
.ghostbtn:hover{border-color:var(--teal);color:var(--teal)}
.ghostbtn:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.wide{flex:1 1 auto}

/* ---------- bench ---------- */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:1px;background:var(--line);
  border-top:1px solid var(--line)}
.benchcol{background:var(--bg2);padding:12px 16px}
.benchcol.narrow{background:var(--panel)}
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:7px}
.events button{border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:9px 11px;text-align:left;transition:border-color .15s,background .15s}
.events button:hover{border-color:var(--teal);background:#132029}
.events button b{display:block;font:600 11.5px/1.3 var(--sans)}
.events button small{display:block;font:500 10px/1.3 var(--mono);color:var(--ink3);margin-top:2px}
.events button.danger:hover{border-color:var(--red);background:#20141a}
.events button.danger b{color:var(--red)}

.strategy{display:flex;gap:5px;margin-bottom:8px}
.strategy button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:5px;
  padding:8px 5px;font:600 10px/1.2 var(--mono);color:var(--ink3);letter-spacing:.03em}

.hint{margin:0 0 9px;font:500 10.5px/1.5 var(--sans);color:var(--ink3)}
.autorow{margin-bottom:9px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;
  background:#0b1117;border:1px solid var(--line2);border-left:3px solid var(--teal);
  padding:11px 16px;border-radius:6px;z-index:90;pointer-events:none;max-width:520px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{display:block;font-size:12px;margin-bottom:2px}
.toast p{margin:0;color:var(--ink2);font-size:11px;line-height:1.45}
.toast.bad{border-left-color:var(--red)} .toast.bad b{color:var(--red)}
.toast.warn{border-left-color:var(--amber)} .toast.warn b{color:var(--amber)}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(4,7,10,.72);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:26px;backdrop-filter:blur(3px)}
.sheetinner{background:var(--panel);border:1px solid var(--line2);border-radius:9px;
  max-width:760px;width:100%;max-height:84vh;overflow-y:auto;padding:22px 24px;position:relative;
  box-shadow:0 24px 70px rgba(0,0,0,.65)}
.sheetclose{position:absolute;top:12px;right:14px;font-size:22px;color:var(--ink3);line-height:1}
.sheetclose:hover{color:var(--ink)}
.sheetinner h3{font-size:17px;margin-bottom:3px}
.sheetinner h4{font:600 10px/1 var(--mono);letter-spacing:.13em;color:var(--ink3);
  margin:20px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sheetinner p{color:var(--ink2);font-size:12px;line-height:1.55}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:12px 0}
.facts div{background:var(--panel2);padding:8px 10px}
.facts.c3{grid-template-columns:repeat(3,1fr)}
.facts.c2{grid-template-columns:repeat(2,1fr)}
.facts span{display:block;font:600 9px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);margin-bottom:4px}
.facts b{font:600 12.5px/1.2 var(--mono)}
.rows2{font-family:var(--mono);font-size:11px}
.rw{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(30,42,56,.5);align-items:baseline}
.rw .tick{flex:0 0 14px}
.rw.pass .tick{color:var(--teal)} .rw.fail .tick{color:var(--red)}
.rw .l{flex:1 1 auto;color:var(--ink)}
.rw .r{color:var(--ink3);flex:0 0 auto}
.rw.fail .r{color:var(--red)}
.cand{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid rgba(30,42,56,.5);font-family:var(--mono);font-size:11px}

.cand.no .v{color:var(--red)} .cand.yes .v{color:var(--teal)}
.cand .d{color:var(--ink2);font-family:var(--sans);font-size:11px;line-height:1.45}
.sheetacts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.banner{border-radius:6px;padding:11px 14px;margin:14px 0;font-size:12px;line-height:1.5}
.banner.ok{background:rgba(47,220,196,.08);border:1px solid var(--teal-d);color:var(--teal)}
.banner.bad{background:rgba(255,95,109,.08);border:1px solid var(--red-d);color:var(--red)}
.banner.warn{background:rgba(247,185,85,.08);border:1px solid var(--amber-d);color:var(--amber)}

@media(max-width:1280px){

/* ---------- accessibility ---------- */

   colour and text, so none of it is load-bearing and all of it can go. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important; animation-iteration-count:1!important;

  }
}

<script>
/* ---- core.js ---- */
/* Harmony - core world model.
   Deterministic synthetic operation: geography, travel time, fleet, crew, demand.
   Everything downstream reads from here. Nothing in this file is display text. */
(function (G) {
'use strict';

/* ---------- deterministic RNG (mulberry32) ---------- */
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, a) => a[Math.floor(r() * a.length)];
const gint = (r, a, b) => a + Math.floor(r() * (b - a + 1));

/* ---------- geography: Philadelphia region, miles on a local plane ---------- */
const LOC = {
  PHL:  { name: 'PHL Airport',       x:  -4.0, y:  -6.0, air: true },
  CC:   { name: 'Center City',       x:   0.0, y:   0.0 },
  UCTY: { name: 'University City',   x:  -2.0, y:   0.5 },
  RITT: { name: 'Rittenhouse',       x:  -0.8, y:   0.4 },
  NAVY: { name: 'Navy Yard',         x:  -1.0, y:  -4.0 },
  BALA: { name: 'Bala Cynwyd',       x:  -5.0, y:   4.0 },
  MANA: { name: 'Manayunk',          x:  -6.0, y:   6.0 },
  CHIL: { name: 'Chestnut Hill',     x:  -4.0, y:   9.0 },
  ARDM: { name: 'Ardmore',           x:  -9.0, y:   5.0 },
  BRYN: { name: 'Bryn Mawr',         x: -11.0, y:   6.0 },
  VILL: { name: 'Villanova',         x: -13.0, y:   6.0 },
  WAYN: { name: 'Wayne',             x: -15.0, y:   7.0 },
  KOP:  { name: 'King of Prussia',   x: -17.0, y:  10.0 },
  CONS: { name: 'Conshohocken',      x:  -9.0, y:   9.0 },
  PLYM: { name: 'Plymouth Meeting',  x: -10.0, y:  12.0 },
  FTWA: { name: 'Fort Washington',   x:  -6.0, y:  14.0 },
  MALV: { name: 'Malvern',           x: -21.0, y:   8.0 },
  EXTN: { name: 'Exton',             x: -25.0, y:   8.0 },
  WCHE: { name: 'West Chester',      x: -22.0, y:   1.0 },
  NEWT: { name: 'Newtown Square',    x: -14.0, y:   2.0 },
  MEDA: { name: 'Media',             x: -12.0, y:  -5.0 },
  WILM: { name: 'Wilmington',        x: -27.0, y: -12.0 },
  CHER: { name: 'Cherry Hill',       x:   7.0, y:  -1.0 },
  DOYL: { name: 'Doylestown',        x:   2.0, y:  26.0 },
  PRIN: { name: 'Princeton',         x:  32.0, y:  20.0 },
  GARA: { name: 'Conshohocken Yard', x:  -8.6, y:   8.6, depot: true },
  GARS: { name: 'Essington Yard',    x:  -5.4, y:  -6.8, depot: true }
};
const ROAD_FACTOR = 1.28;

function miles(a, b) {
  if (a === b) return 0;
  const A = LOC[a], B = LOC[b];
  return Math.hypot(A.x - B.x, A.y - B.y) * ROAD_FACTOR;
}
/* longer hops use highways, so average speed rises with distance */
function mph(d) { return 24 + Math.min(d, 35) * 0.62; }

/* time-of-day congestion multiplier applied to travel TIME */
function congestion(min) {
  const h = (min % 1440) / 60;
  if (h >= 6 && h <= 10)    return 1 + 0.42 * Math.exp(-Math.pow((h - 8.0) / 1.15, 2));
  if (h >= 15 && h <= 19.5) return 1 + 0.50 * Math.exp(-Math.pow((h - 17.2) / 1.25, 2));
  if (h < 5 || h > 22)      return 0.86;
  return 1;
}

/* the single travel-time oracle. Every projected minute in the product comes through here. */
function travelMin(a, b, atMin, traffic) {
  if (a === b) return 0;
  const d = miles(a, b);
  return (d / mph(d)) * 60 * congestion(atMin) * (traffic || 1) + 3;
}

/* ---------- time helpers (minutes from midnight) ---------- */
function hhmm(m) {
  m = Math.round(m) % 1440; if (m < 0) m += 1440;
  let h = Math.floor(m / 60); const mi = m % 60; const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + String(mi).padStart(2, '0') + ' ' + ap;
}
function hhmm24(m) {
  m = Math.round(m) % 1440; if (m < 0) m += 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

/* ---------- fleet & crew ---------- */
const CLASS_LABEL = { sedan: 'Sedan', suv: 'SUV', van: 'Van' };
const CAP = { sedan: 3, suv: 6, van: 13 };

/* Substitution lattice, written out rather than inferred from an ordering:
   an SUV may cover a sedan request; nothing covers an SUV or a van but itself. */
const SUBSTITUTES = { sedan: ['sedan', 'suv'], suv: ['suv'], van: ['van'] };
function canCover(vehCls, reqCls) { return SUBSTITUTES[reqCls].indexOf(vehCls) !== -1; }

const TIER = { 1: 'Associate', 2: 'Professional', 3: 'Principal' };
const VIP_MIN_TIER = 2;

const MODELS = {
  sedan: ['Cadillac CT6', 'Mercedes E 350', 'Lincoln Continental', 'BMW 740i'],
  suv:   ['Cadillac Escalade', 'Chevrolet Suburban', 'Lincoln Navigator'],
  van:   ['Mercedes Sprinter', 'Ford Transit Executive']
};
const NAMES = ['Marcus Bell','Dana Whitfield','Priya Raman','Tomas Herrera','Grace Okafor',
  'Elliot Shaw','Nadia Kaur','Victor Ruiz','Imani Brooks','Sean Delaney','Yuki Tanaka',
  'Andre Ferreira','Rachel Stern','Omar Haddad','Lena Kovac','Curtis Boyd','Sofia Marchetti',
  'Devon Pike','Hana Salim','Bruno Castellan','Ivy Lockhart','Rafael Ortiz','Mei-Lin Chow',
  'Gordon Ashby','Talia Berman','Kwame Mensah','Erin Doyle','Pavel Novak','Simone Duval',
  'Hector Vela','Nora Kelleher','Julius Vance','Anika Dutta','Roman Petrov','Clara Bendix'];

function buildFleet() {
  const r = rng(0xC0FFEE);
  const vehicles = [];
  /* Mix follows the substitution lattice: the SUV is the flexible asset (it can
     cover sedan work, nothing can cover it), so a real operator over-indexes on
     SUVs rather than buying sedans it cannot redeploy. */
  const spec = [['sedan', 10], ['suv', 16], ['van', 4]];
  let n = 101;
  spec.forEach(function (s) {
    for (let i = 0; i < s[1]; i++) {
      const cls = s[0];
      vehicles.push({
        id: 'V' + n,
        label: (cls === 'sedan' ? 'S-' : cls === 'suv' ? 'X-' : 'W-') + n,
        cls: cls, cap: CAP[cls], model: pick(r, MODELS[cls]),
        base: r() < 0.62 ? 'GARA' : 'GARS',
        oos: null
      });
      n += r() < 0.5 ? 3 : 4;
    }
  });
  const chauffeurs = NAMES.map(function (nm, i) {
    /* 16 / 13 / 6. Deliberately NOT enough Professionals and Principals to cover
       all 20 SUVs and vans: if the roster could staff every VIP-capable car with
       a senior chauffeur, the VIP tier rule would be satisfied by construction
       and could never bind. It has to be possible to get this wrong. */
    const tier = i < 16 ? 1 : i < 29 ? 2 : 3;
    /* Demand peaks 06:00-09:00, so the roster is weighted to the morning.
       The late shift exists to carry the evening airport bank. */
    const early = (i % 5) < 3;
    return {
      id: 'C' + (201 + i), name: nm, tier: tier,
      shiftStart: early ? gint(r, 285, 345)  : gint(r, 510, 585),
      shiftEnd:   early ? gint(r, 1020, 1110): gint(r, 1320, 1440),
      available: true
    };
  });
  return { vehicles: vehicles, chauffeurs: chauffeurs };
}

/* ---------- demand ---------- */
const ACCOUNTS = ['Northbank Capital','Tidewater Executive','Larkspur Health','Lockhart & Pryce',
  'Fenwick Bio','Orion Board','Nexa Group','Millrace Partners','Hollins Advisors',
  'Ashgrove Exec Ed','Quillon Re','Bellweather Media','Copperline Chemical','Delancey Trust',
  'Chatham Equity','Bridgemont Pharma','Aldridge Family Office','Grand Hotel Concierge'];
const PAX = ['Harper','Mitchell','Adams','Nguyen','Klein','Carter','Foster','Wilson','Morgan',
  'Davis','Singh','Garcia','Allen','Hayes','Brooks','Whitman','Okonkwo','Reyes','Lindqvist',
  'Chen','Abbott','Baptiste','Sorensen','Ferrante','Nakamura','Odell','Pryor','Vance'];
const SUBURBS = ['ARDM','BRYN','VILL','WAYN','KOP','MALV','EXTN','WCHE','NEWT','MEDA','CONS',
  'PLYM','FTWA','CHIL','BALA','MANA','CHER','DOYL','WILM','PRIN'];
const CITY = ['CC','RITT','UCTY','NAVY'];
const AIRLINES = ['AA', 'UA', 'DL', 'AS', 'B6'];

/* relative demand weight by hour of day */
const PROFILE = [0,0,0,0,0.2,1.4,3.2,4.4,3.6,2.4,2.0,2.2,2.4,2.2,2.4,3.0,4.2,4.6,3.6,2.6,1.8,1.2,0.6,0.2];
const PROFILE_TOTAL = PROFILE.reduce((a, b) => a + b, 0);
function sampleHour(r) {
  let x = r() * PROFILE_TOTAL;
  for (let h = 0; h < 24; h++) { x -= PROFILE[h]; if (x <= 0) return h; }
  return 17;
}

function makeTrip(r, refNo, cfg) {
  const h = sampleHour(r);
  const pickupMin = h * 60 + gint(r, 0, 59);
  const isAirport = r() < cfg.airportRate;
  const vip = r() < cfg.vipRate;
  let svc, from, to, hourlyMin = 0, flight = null, waitMin = 0;

  if (isAirport) {
    if (r() < 0.55) {
      svc = 'arrival'; from = 'PHL'; to = pick(r, r() < 0.45 ? CITY : SUBURBS);
      flight = { code: pick(r, AIRLINES) + ' ' + gint(r, 100, 2899), sched: pickupMin - 35, delayMin: 0 };
    } else {
      svc = 'departure'; from = pick(r, r() < 0.45 ? CITY : SUBURBS); to = 'PHL';
      flight = { code: pick(r, AIRLINES) + ' ' + gint(r, 100, 2899), sched: pickupMin + 150, delayMin: 0 };
    }
  } else if (r() < 0.62) {
    svc = 'waitreturn'; from = pick(r, r() < 0.5 ? CITY : SUBURBS);
    to = pick(r, SUBURBS.concat(CITY).filter(x => x !== from));
    waitMin = pick(r, [45, 60, 90, 120]);
  } else {
    svc = 'hourly'; from = pick(r, r() < 0.6 ? CITY : SUBURBS); to = from;
    hourlyMin = pick(r, [120, 180, 180, 240]);
  }

  const pax = svc === 'hourly' ? gint(r, 1, 4) : (r() < 0.10 ? gint(r, 5, 11) : gint(r, 1, 3));
  /* Plenty of VIPs ride a sedan - an executive alone does not need an Escalade.
     That matters: it is what puts VIP work on cars an Associate might be driving. */
  let reqCls = pax > 6 ? 'van' : pax > 3 ? 'suv' : (vip && r() < 0.45 ? 'suv' : (r() < 0.3 ? 'suv' : 'sedan'));
  if (pax > CAP[reqCls]) reqCls = 'van';

  return {
    id: 'T' + refNo, ref: String(refNo),
    account: r() < 0.55 ? pick(r, ACCOUNTS) : null,
    pax: pax, paxName: pick(r, PAX),
    svc: svc, from: from, to: to,
    pickup: pickupMin, basePickup: pickupMin,
    reqCls: reqCls, vip: vip, flight: flight,
    waitMin: waitMin, hourlyMin: hourlyMin,
    locked: false,
    notified: r() < 0.38,      /* chauffeur already named to the customer */
    prefChauffeur: null,
    injected: false, affiliate: false
  };
}

function makeDay(cfg) {
  const r = rng(cfg.seed);
  const trips = [];
  for (let i = 0; i < cfg.count; i++) trips.push(makeTrip(r, cfg.refBase + i, cfg));
  trips.sort((a, b) => a.pickup - b.pickup);
  return {
    id: cfg.id, name: cfg.name, sub: cfg.sub, date: cfg.date,
    traffic: cfg.traffic, baseTraffic: cfg.traffic, trips: trips,
    brief: cfg.brief, seed: cfg.seed, nextRef: cfg.refBase + cfg.count
  };
}

function serviceMin(trip, startMin, traffic) {
  if (trip.svc === 'hourly') return trip.hourlyMin;
  if (trip.svc === 'waitreturn') {

<script>
/* ---- model.js ---- */
/* Harmony - schedule projection, hard constraints, objective function.
   This module is the ONLY place that decides whether an assignment is legal
   and what a plan costs. The optimizer, the UI and the independent auditor all
   call in here, so there is no second opinion to drift out of sync. */
(function (G) {
'use strict';
const H = G.HX;

/* ---------- constraint codes ---------- */
const CODE = {
  CLASS:      'VEHICLE_CLASS',
  CAPACITY:   'CAPACITY',
  TIER:       'CHAUFFEUR_TIER',
  NO_CREW:    'NO_CHAUFFEUR',
  OOS:        'VEHICLE_OUT_OF_SERVICE',
  SHIFT:      'SHIFT_WINDOW',
  CREW_DUP:   'CHAUFFEUR_DOUBLE_BOOKED',
  UNASSIGNED: 'UNASSIGNED',
  LOCKED:     'LOCK_BROKEN',
  HISTORY:    'HISTORY_CONFLICT'
};
const CODE_TEXT = {
  VEHICLE_CLASS:            'vehicle class cannot cover the requested class',
  CAPACITY:                 'passenger count exceeds vehicle capacity',
  CHAUFFEUR_TIER:           'VIP trip requires a Professional or Principal chauffeur',
  NO_CHAUFFEUR:             'vehicle has no chauffeur assigned',
  VEHICLE_OUT_OF_SERVICE:   'vehicle is out of service during the trip window',
  SHIFT_WINDOW:             'trip falls more than 120 min outside the chauffeur shift',
  CHAUFFEUR_DOUBLE_BOOKED:  'chauffeur is crewed to more than one vehicle',
  UNASSIGNED:               'reservation has no vehicle',
  LOCK_BROKEN:              'locked assignment was moved',
  HISTORY_CONFLICT:         'the car cannot reach a trip it has already begun'
};

/* how far past shift end we will still let a chauffeur run before it is illegal */
const OVERTIME_HARD_CAP = 120;
/* lateness beyond this is treated as a service failure in the KPIs */
const LATE_THRESHOLD = 5;
const SERVICE_FAIL   = 20;
/* affiliate farm-out */
const AFFILIATE_FEE  = 145;

/* ================= trip lifecycle =================
   Status is derived from the clock against the PROJECTED leg, not the booked
   pickup. A car running 20 minutes behind is still "on location" when its
   booked pickup time passes - which is exactly what being late looks like. */
const STATUS = ['dispatched', 'enroute', 'onlocation', 'onboard', 'complete'];
const STATUS_LABEL = {
  dispatched: 'Dispatched', enroute: 'Enroute', onlocation: 'On location',
  onboard: 'Client onboard', complete: 'Complete',
  missed: 'Missed', unassigned: 'Unassigned', affiliate: 'Affiliate'
};
const ENROUTE_LEAD = 60;     /* driver sets off an hour before */
const ONLOCATION_LEAD = 15;  /* on the curb a quarter hour before */

function statusOf(state, trip, leg) {
  const a = state.plan.assign[trip.id];
  if (a === 'AFFILIATE') return 'affiliate';
  if (!a || !leg) return state.clock > trip.pickup ? 'missed' : 'unassigned';
  const c = state.clock;
  if (c >= leg.end) return 'complete';
  if (c >= leg.start) return 'onboard';
  if (c >= leg.start - ONLOCATION_LEAD) return 'onlocation';
  if (c >= leg.start - ENROUTE_LEAD) return 'enroute';
  return 'dispatched';
}

/* A trip the car has already begun cannot be reassigned by anyone - the
   client is in the vehicle. This is the rule that makes the clock mean
   something to the optimizer. */
function committed(state, trip) { return trip.startedAt != null; }
/* Currently carrying: started and not yet finished. Distinct from committed() -
   a car whose morning job is long since complete is not mid-run. */
function midRun(state, trip) { return trip.startedAt != null && !trip.actual; }

/* ---------- weight presets ---------- */
const PRESETS = {
  service:    { name: 'Service First',   late: 4.0, deadhead: 0.8, overtime: 0.6, disruption: 0.8, affiliate: 0.5, unassigned: 400, pref: 6 },
  balanced:   { name: 'Balanced',        late: 2.2, deadhead: 1.6, overtime: 1.1, disruption: 1.4, affiliate: 1.0, unassigned: 400, pref: 4 },
  efficiency: { name: 'Efficiency First',late: 1.0, deadhead: 3.2, overtime: 2.4, disruption: 2.6, affiliate: 2.2, unassigned: 400, pref: 2 }
};

/* ---------- plan shape ----------
   plan = { assign: { tripId -> vehicleId | null | 'AFFILIATE' },
            crew:   { vehicleId -> chauffeurId | null } }
   A chauffeur is crewed to a vehicle for the day, which is how livery
   operations actually run; the optimizer may re-pair crew to vehicles. */

function emptyPlan() { return { assign: {}, crew: {} }; }
function clonePlan(p) { return { assign: Object.assign({}, p.assign), crew: Object.assign({}, p.crew) }; }

/* ---------- state ----------
   state = { fleet:{vehicles,chauffeurs}, day, plan, weights, byId:{...} } */
function index(state) {
  state.vById = {}; state.fleet.vehicles.forEach(v => state.vById[v.id] = v);
  state.cById = {}; state.fleet.chauffeurs.forEach(c => state.cById[c.id] = c);
  state.tById = {}; state.day.trips.forEach(t => state.tById[t.id] = t);
  return state;
}

/* ================= projection =================
   Walks one vehicle's day forward in time. Nothing here is estimated twice:
   the start of each trip is whatever the previous trip and the drive between
   them actually allow. Lateness therefore cascades, which is the entire point. */
function projectVehicle(state, vehicleId, tripIds) {
  const veh = state.vById[vehicleId];
  const traffic = state.day.traffic;
  const crewId = state.plan.crew[vehicleId];
  const crew = crewId ? state.cById[crewId] : null;
  const legs = [];
  let cursorLoc = veh.base;
  let cursorTime = crew ? crew.shiftStart : 300;
  let deadheadMi = 0, lateMin = 0, driveMin = 0, revenueMin = 0, failures = 0;

  const sorted = tripIds.slice().sort((a, b) => state.tById[a].pickup - state.tById[b].pickup);

  for (let i = 0; i < sorted.length; i++) {
    const t = state.tById[sorted[i]];

    /* A completed trip is history: its realised times are replayed, never
       recomputed. Otherwise raising traffic at 2pm would retroactively make
       the morning late, and "actual on-time" would be a moving target. */
    if (t.actual) {
      legs.push({ tripId: t.id, repoMin: t.actual.repoMin, repoMi: t.actual.repoMi,
        earliest: cursorTime, start: t.actual.start, end: t.actual.end,
        late: t.actual.late, slack: 0, dur: t.actual.dur, frozen: true,
        /* The car demonstrably made this drive, so re-costing it against
           this afternoon's worse traffic proves nothing. Only a previous leg
           still running at this departure is a real contradiction. */
        impossible: cursorTime > t.actual.start + 0.5 });
      deadheadMi += t.actual.repoMi; driveMin += t.actual.repoMin; revenueMin += t.actual.dur;
      lateMin += t.actual.late; if (t.actual.late > SERVICE_FAIL) failures++;
      cursorLoc = H.endLoc(t); cursorTime = t.actual.end;
      continue;
    }

    const repoMin = H.travelMin(cursorLoc, t.from, cursorTime, traffic);
    const repoMi  = H.miles(cursorLoc, t.from);
    const earliest = cursorTime + repoMin;
    /* A trip already under way departed when it departed; only the drive still
       ahead of it is re-costed against current traffic. */
    const start = t.startedAt != null ? t.startedAt : Math.max(t.pickup, earliest);
    const late = Math.max(0, start - t.pickup);
    const dur = H.serviceMin(t, start, traffic);
    const end = start + dur;

    legs.push({
      tripId: t.id, repoMin, repoMi, earliest, start, end, late,
      slack: Math.max(0, t.pickup - earliest), dur, started: t.startedAt != null,
      /* a started trip departed when it departed; only a previous leg still
         running at that moment is physically impossible */
      impossible: t.startedAt != null && cursorTime > t.startedAt + 0.5
    });
    deadheadMi += repoMi; driveMin += repoMin; revenueMin += dur;
    lateMin += late; if (late > SERVICE_FAIL) failures++;
    cursorLoc = H.endLoc(t); cursorTime = end;
  }

  const shiftEnd = crew ? crew.shiftEnd : 1440;
  const overtimeMin = Math.max(0, cursorTime - shiftEnd);
  return { vehicleId, crewId, legs, deadheadMi, lateMin, driveMin, revenueMin,
           overtimeMin, failures, finishAt: cursorTime, finishLoc: cursorLoc };

/* full projection: every vehicle, plus the trip-level index the UI reads */
function project(state) {
  const byVehicle = {};
  state.fleet.vehicles.forEach(v => byVehicle[v.id] = []);
  const unassigned = [], affiliate = [];
  state.day.trips.forEach(function (t) {
    const a = state.plan.assign[t.id];
    if (a === 'AFFILIATE') affiliate.push(t.id);
    else if (a && byVehicle[a]) byVehicle[a].push(t.id);
    else unassigned.push(t.id);
  });

  const vehicles = {}, leg = {};
  let deadheadMi = 0, lateMin = 0, overtimeMin = 0, failures = 0, revenueMin = 0, driveMin = 0;
  let onTime = 0, assignedCount = 0, thinBuffer = 0;

  state.fleet.vehicles.forEach(function (v) {
    const p = projectVehicle(state, v.id, byVehicle[v.id]);
    vehicles[v.id] = p;
    p.legs.forEach(function (l) {
      leg[l.tripId] = l; assignedCount++;
      if (l.late <= LATE_THRESHOLD) onTime++;
      if (l.slack > 0 && l.slack < 10) thinBuffer++;
    });
    deadheadMi += p.deadheadMi; lateMin += p.lateMin; overtimeMin += p.overtimeMin;
    failures += p.failures; revenueMin += p.revenueMin; driveMin += p.driveMin;
  });

  /* Lifecycle roll-up, and the honest split: what actually happened so far is
     measured, what is still ahead is projected. Reporting one number for both
     would let a good morning hide a broken afternoon, and vice versa. */
  const byStatus = { dispatched: 0, enroute: 0, onlocation: 0, onboard: 0,
                     complete: 0, missed: 0, unassigned: 0, affiliate: 0 };
  const status = {};
  let doneCount = 0, doneOnTime = 0;
  state.day.trips.forEach(function (t) {
    const s = statusOf(state, t, leg[t.id]);
    status[t.id] = s; byStatus[s]++;
    if (s === 'complete') { doneCount++; if (leg[t.id].late <= LATE_THRESHOLD) doneOnTime++; }
  });

  const total = state.day.trips.length;
  return {
    byVehicle, vehicles, leg, unassigned, affiliate, status, byStatus,
    totals: {
      trips: total, assigned: assignedCount,
      completed: doneCount, completedOnTime: doneOnTime,
      actualOnTimePct: doneCount ? (doneOnTime / doneCount) * 100 : null,
      unassigned: unassigned.length, affiliate: affiliate.length,
      deadheadMi, lateMin, overtimeMin, failures, revenueMin, driveMin, thinBuffer,
      onTime, onTimePct: total ? (onTime / total) * 100 : 100,
      vehiclesUsed: state.fleet.vehicles.filter(v => byVehicle[v.id].length).length,
      utilPct: revenueMin + driveMin > 0
        ? (revenueMin / (revenueMin + driveMin)) * 100 : 0
    }
  };
}

/* ================= hard constraints =================
   Static feasibility of putting `trip` on `vehicle` with the vehicle's crew.
   Returns [] when legal. Used identically by the optimizer, drag-and-drop,
   and the auditor. */
function staticViolations(state, trip, vehicleId, proj) {
  const out = [];
  const veh = state.vById[vehicleId];
  if (!veh) { out.push({ code: CODE.UNASSIGNED, trip: trip.id }); return out; }

  /* Class and capacity are properties of the vehicle and the booking, so they
     hold for a trip whenever it ran. Everything after them - crew, shifts,
     service windows - describes the car's CURRENT state, and judging a trip
     that already happened against it reports the past as illegal because of
     something that happened afterwards. */
  const history = trip.startedAt != null;

  if (!H.canCover(veh.cls, trip.reqCls))
    out.push({ code: CODE.CLASS, trip: trip.id, vehicle: vehicleId,
      detail: H.CLASS_LABEL[veh.cls] + ' cannot cover a ' + H.CLASS_LABEL[trip.reqCls] + ' request' });

  if (trip.pax > veh.cap)
    out.push({ code: CODE.CAPACITY, trip: trip.id, vehicle: vehicleId,
      detail: trip.pax + ' passengers, capacity ' + veh.cap });

  if (history) return out;

  const crewId = state.plan.crew[vehicleId];
  if (!crewId) {
    out.push({ code: CODE.NO_CREW, trip: trip.id, vehicle: vehicleId,
      detail: veh.label + ' has no chauffeur' });
  } else {
    const c = state.cById[crewId];
    if (trip.vip && c.tier < H.VIP_MIN_TIER)
      out.push({ code: CODE.TIER, trip: trip.id, vehicle: vehicleId, chauffeur: crewId,
        detail: c.name + ' is ' + H.TIER[c.tier] + '; VIP requires ' + H.TIER[H.VIP_MIN_TIER] + ' or above' });
  }

  /* timing-dependent checks need the projected window */
  const l = proj && proj.leg[trip.id];
  const start = l ? l.start : trip.pickup;
  const end   = l ? l.end   : trip.pickup + 60;

  if (veh.oos && start < veh.oos.to && end > veh.oos.from)
    out.push({ code: CODE.OOS, trip: trip.id, vehicle: vehicleId,
      detail: veh.label + ' out of service ' + H.hhmm(veh.oos.from) + '-' + H.hhmm(veh.oos.to) });

  if (crewId) {
    const c = state.cById[crewId];
    /* start-of-shift is tested against the BOOKED pickup: the projection has
       already pushed the trip to the driver's on-duty time, so comparing the
       projected start would be comparing shiftStart to itself. */
    if (trip.pickup < c.shiftStart - 15 || end > c.shiftEnd + OVERTIME_HARD_CAP)
      out.push({ code: CODE.SHIFT, trip: trip.id, vehicle: vehicleId, chauffeur: crewId,
        detail: c.name + ' shift ' + H.hhmm(c.shiftStart) + '-' + H.hhmm(c.shiftEnd) +
                ', trip booked ' + H.hhmm(trip.pickup) + ' and runs to ' + H.hhmm(end) });
  }
  return out;
}

/* Whole-plan validation. Enumerates the PLAN, not a written checklist, so a
   trip nobody remembered to look at still gets checked. */
function validate(state, proj) {
  proj = proj || project(state);
  const v = [];

  state.day.trips.forEach(function (t) {
    const a = state.plan.assign[t.id];
    if (a === 'AFFILIATE') return;
    if (!a) { v.push({ code: CODE.UNASSIGNED, trip: t.id, detail: 'no vehicle assigned' }); return; }
    staticViolations(state, t, a, proj).forEach(x => v.push(x));
  });

  /* the plan must not contradict what already happened */
  state.day.trips.forEach(function (t) {
    const l = proj.leg[t.id];
    if (l && l.impossible)
      v.push({ code: CODE.HISTORY, trip: t.id, vehicle: state.plan.assign[t.id],
        detail: t.ref + ' departed at ' + H.hhmm(l.start) + ' but the car cannot get there until ' +
                H.hhmm(l.earliest) });
  });

  /* a chauffeur may crew at most one vehicle */
  const seen = {};
  Object.keys(state.plan.crew).forEach(function (vid) {
    const cid = state.plan.crew[vid]; if (!cid) return;
    if (seen[cid]) v.push({ code: CODE.CREW_DUP, chauffeur: cid, vehicle: vid,
      detail: state.cById[cid].name + ' is crewed to ' + state.vById[seen[cid]].label +
              ' and ' + state.vById[vid].label });
    else seen[cid] = vid;
  });

  /* an unavailable chauffeur must not be crewed at all */
  Object.keys(state.plan.crew).forEach(function (vid) {
    const cid = state.plan.crew[vid]; if (!cid) return;
    const c = state.cById[cid];
    if (!c.available) v.push({ code: CODE.SHIFT, chauffeur: cid, vehicle: vid,
      detail: c.name + ' is marked unavailable' });
  });

  return v;
}

/* ================= objective =================
   Decomposable so the optimizer can re-score one vehicle at a time. */
function latePenalty(min) {
  if (min <= 0) return 0;
  let p = min;
  if (min > 15) p += (min - 15) * 2;
  if (min > 30) p += (min - 30) * 3;   /* convex: one 45-min failure beats three 15s */
  return p;
}
function disruptionPenalty(state, trip, fromV, toV) {
  if (fromV === toV) return 0;
  if (!fromV) return 0;                /* placing an unassigned trip is free */
  let p = 8;
  if (trip.notified) p *= 3;           /* chauffeur already named to the customer */
  if (trip.vip)      p *= 2;
  /* The closer the car is to the curb, the more a change costs. Recalling a
     driver who set off an hour ago is bad; turning one away who is already
     parked outside the client's building is worse. */
  const s = state.lastStatus && state.lastStatus[trip.id];
  if (s === 'enroute')    p *= 2;
  if (s === 'onlocation') p *= 4;
  return p;
}

function vehicleCost(state, w, p) {
  return w.late * p.legs.reduce((s, l) => s + latePenalty(l.late), 0)
       + w.deadhead * p.deadheadMi
       + w.overtime * p.overtimeMin;

function cost(state, proj, baseline) {
  const w = state.weights;
  proj = proj || project(state);
  let c = 0;
  state.fleet.vehicles.forEach(v => { c += vehicleCost(state, w, proj.vehicles[v.id]); });
  c += w.unassigned * proj.unassigned.length;
  /* Farming out must be priced against lateness in the same units, or the
     optimizer discovers that giving the trip away is cheaper than running it
     four minutes late. At the balanced weights this sits between a 20-minute
     delay (~66) and a 45-minute service failure (~330). */
  c += w.affiliate * proj.affiliate.length * AFFILIATE_FEE;

    state.day.trips.forEach(function (t) {
      c += w.disruption * disruptionPenalty(state, t, baseline.assign[t.id], state.plan.assign[t.id]);
    });
  }
  state.day.trips.forEach(function (t) {
    if (t.prefChauffeur) {
      const vid = state.plan.assign[t.id];
      const cid = vid && vid !== 'AFFILIATE' ? state.plan.crew[vid] : null;
      if (cid !== t.prefChauffeur) c += w.pref;
    }
  });
  return c;
}

/* money view - kept separate from the objective so nobody confuses a weight with a dollar */
function economics(proj) {
  return {
    deadheadMi: proj.totals.deadheadMi,
    deadheadCost: proj.totals.deadheadMi * 1.15,
    overtimeCost: (proj.totals.overtimeMin / 60) * 41,
    affiliateCost: proj.totals.affiliate * AFFILIATE_FEE
  };
}

G.HM = {
  CODE, CODE_TEXT, PRESETS, AFFILIATE_FEE, LATE_THRESHOLD, SERVICE_FAIL, OVERTIME_HARD_CAP,
  STATUS, STATUS_LABEL, ENROUTE_LEAD, ONLOCATION_LEAD, statusOf, committed, midRun,
  emptyPlan, clonePlan, index, project, projectVehicle,
  staticViolations, validate, cost, vehicleCost, latePenalty, disruptionPenalty, economics
};
})(window);
