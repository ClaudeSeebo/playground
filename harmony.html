<script>
/* ---- optimizer.js ---- */
/* Harmony - dispatch optimizer.
   Greedy construction, constraint repair, crew re-pairing, then time-boxed
   ruin-and-recreate local search. Every counter reported to the UI is
   incremented here by work that actually happened. */
(function (G) {
'use strict';
const H = G.HX, M = G.HM;

function workState(state, plan) {
  /* clock and lastStatus travel with the working state: without them the
     optimizer cannot tell the past from the future and will happily re-plan
     trips that already happened. */
  return { fleet: state.fleet, day: state.day, weights: state.weights,
           vById: state.vById, cById: state.cById, tById: state.tById,
           clock: state.clock == null ? 0 : state.clock,
           lastStatus: state.lastStatus, plan: plan };
}

/* Trips the optimizer is not allowed to touch: pinned by the operator, or
   already under way. */
function immovable(state, t) { return t.locked || M.committed(state, t); }

/* trips currently on a vehicle */
function tripsOn(plan, day, vehicleId) {
  const out = [];
  for (let i = 0; i < day.trips.length; i++) {
    const t = day.trips[i];
    if (plan.assign[t.id] === vehicleId) out.push(t.id);
  }
  return out;
}

/* marginal cost of the vehicle, with an explicit trip list */
function vCost(ws, vehicleId, tripIds) {
  return M.vehicleCost(ws, ws.weights, M.projectVehicle(ws, vehicleId, tripIds));
}

/* ---------- candidate evaluation ----------
   Returns {ok, delta, reasons[]} for putting `trip` on `vehicleId`.
   `reasons` is populated on rejection and is what the Explain drawer shows. */
function evaluate(ws, trip, vehicleId, baseTrips, stats) {
  stats.candidates++;
  const veh = ws.vById[vehicleId];
  const reasons = [];

  if (!H.canCover(veh.cls, trip.reqCls))
    reasons.push(H.CLASS_LABEL[veh.cls] + ' cannot cover a ' + H.CLASS_LABEL[trip.reqCls] + ' request');
  if (trip.pax > veh.cap)
    reasons.push('capacity ' + veh.cap + ', trip carries ' + trip.pax);

  const crewId = ws.plan.crew[vehicleId];
  if (!crewId) reasons.push('no chauffeur crewed to this vehicle');
  else {
    const c = ws.cById[crewId];
    if (!c.available) reasons.push(c.name + ' is unavailable');
    if (trip.vip && c.tier < H.VIP_MIN_TIER)
      reasons.push(c.name + ' is ' + H.TIER[c.tier] + '; VIP requires ' + H.TIER[H.VIP_MIN_TIER] + '+');
  }
  if (reasons.length) return { ok: false, reasons: reasons, vehicleId: vehicleId };

  const before = vCost(ws, vehicleId, baseTrips);
  const withT = baseTrips.concat([trip.id]);
  const p = M.projectVehicle(ws, vehicleId, withT);

  /* Time-dependent checks are made against the WHOLE resulting chain, not just
     the trip being placed. Inserting mid-chain pushes everything after it, so a
     check that only looked at this trip's own window would happily build a car
     whose last job finishes three hours past its driver's shift. */
  const leg = p.legs.filter(l => l.tripId === trip.id)[0];

  const broke = p.legs.filter(l => l.impossible)[0];
  if (broke) {
    reasons.push('would put ' + veh.label + ' somewhere else when ' +
                 ws.tById[broke.tripId].ref + ' already departed at ' + H.hhmm(broke.start));
    return { ok: false, reasons: reasons, vehicleId: vehicleId };
  }

  if (veh.oos) {
    const clash = p.legs.filter(l => l.start < veh.oos.to && l.end > veh.oos.from)[0];
    if (clash) {
      reasons.push(veh.label + ' out of service ' + H.hhmm(veh.oos.from) + '-' + H.hhmm(veh.oos.to) +
                   (clash.tripId === trip.id ? '' : ' (would strand ' + ws.tById[clash.tripId].ref + ')'));
      return { ok: false, reasons: reasons, vehicleId: vehicleId };
    }
  }
  if (crewId) {
    const c = ws.cById[crewId];
    /* The start-of-shift test must use the REQUESTED pickup, not the projected
       start: projectVehicle already pushes a trip forward to the moment the
       driver comes on duty, so testing leg.start would compare shiftStart to
       itself and the constraint could never fire. */
    if (trip.pickup < c.shiftStart - 15) {
      reasons.push(c.name + ' comes on duty at ' + H.hhmm(c.shiftStart) +
                   '; pickup is booked for ' + H.hhmm(trip.pickup));
      return { ok: false, reasons: reasons, vehicleId: vehicleId };
    }
    if (p.overtimeMin > M.OVERTIME_HARD_CAP) {
      const last = p.legs[p.legs.length - 1];
      reasons.push(c.name + ' is off at ' + H.hhmm(c.shiftEnd) + '; the car would not finish until ' +
                   H.hhmm(p.finishAt) + ' (' + Math.round(p.overtimeMin) + ' min OT, cap ' +
                   M.OVERTIME_HARD_CAP + ')' +
                   (last && last.tripId !== trip.id ? ' because ' + ws.tById[last.tripId].ref + ' is pushed back' : ''));
      return { ok: false, reasons: reasons, vehicleId: vehicleId };
    }
  }

  stats.feasible++;
  const after = M.vehicleCost(ws, ws.weights, p);
  return { ok: true, delta: after - before, vehicleId: vehicleId,
           late: leg.late, repoMi: leg.repoMi, slack: leg.slack, start: leg.start };
}

/* Best vehicle for a trip. Also returns the near-misses, ranked, for Explain. */
function bestFor(ws, trip, stats, baselinePlan, excludeV) {
  const cache = {};
  let best = null; const rejected = []; const feasible = [];
  for (let i = 0; i < ws.fleet.vehicles.length; i++) {
    const vid = ws.fleet.vehicles[i].id;
    if (vid === excludeV) continue;
    const list = cache[vid] || (cache[vid] = tripsOn(ws.plan, ws.day, vid));
    const r = evaluate(ws, trip, vid, list, stats);
    if (!r.ok) { rejected.push(r); continue; }
    const disr = baselinePlan
      ? ws.weights.disruption * M.disruptionPenalty(ws, trip, baselinePlan.assign[trip.id], vid) : 0;
    r.score = r.delta + disr;
    feasible.push(r);
    if (!best || r.score < best.score) best = r;
  }
  feasible.sort((a, b) => a.score - b.score);
  return { best: best, feasible: feasible, rejected: rejected };
}

/* ---------- crew re-pairing ----------
   Swap chauffeurs between two vehicles when doing so fixes a tier violation or
   lowers overtime. This is a real dispatcher move and it is legible on screen. */
/* Can this chauffeur legally work this car's existing chain? Tier alone is not
   enough - a swap that fixes a VIP tier gap while handing the car to a driver
   who goes off duty three hours early just trades one violation for another. */
function crewFits(ws, vehicleId, chauffeurId, tripIds) {
  if (!chauffeurId) return false;
  const c = ws.cById[chauffeurId];
  if (!c.available) return false;
  for (let i = 0; i < tripIds.length; i++) {
    const t = ws.tById[tripIds[i]];
    /* You cannot change who is driving a car that is already carrying a
       client. Whoever started the trip finishes it. */
    if (M.midRun(ws, t) && ws.plan.crew[vehicleId] !== chauffeurId) return false;
    if (t.vip && c.tier < H.VIP_MIN_TIER) return false;
    if (t.pickup < c.shiftStart - 15) return false;
  }
  if (!tripIds.length) return true;
  const saved = ws.plan.crew[vehicleId];
  ws.plan.crew[vehicleId] = chauffeurId;
  const p = M.projectVehicle(ws, vehicleId, tripIds);
  ws.plan.crew[vehicleId] = saved;
  return p.overtimeMin <= M.OVERTIME_HARD_CAP;
}

function repairCrew(ws, stats, log) {
  const vehicles = ws.fleet.vehicles;
  let fixed = 0;

  /* First: a chauffeur who has called out is crewed to nothing, even an idle
     car. Skipping empty cars leaves an unavailable driver on the roster
     indefinitely and no later pass ever looks at it again. */
  vehicles.forEach(function (v) {
    const cid = ws.plan.crew[v.id];
    /* ...unless they are mid-run. Whoever started a trip finishes it. */
    const midRun = tripsOn(ws.plan, ws.day, v.id).some(id => M.midRun(ws, ws.tById[id]));
    if (cid && !ws.cById[cid].available && !midRun) {
      ws.plan.crew[v.id] = null;
      if (!tripsOn(ws.plan, ws.day, v.id).length)
        log.push({ kind: 'crew', vehicle: v.id, from: cid, to: null, partner: null,
          why: ws.cById[cid].name + ' unavailable; car has no work and is stood down' });
    }
  });

  for (let i = 0; i < vehicles.length; i++) {
    const vid = vehicles[i].id;
    const list = tripsOn(ws.plan, ws.day, vid);
    if (!list.length) continue;
    const needsVip = list.some(id => ws.tById[id].vip);
    const cid = ws.plan.crew[vid];
    const c = cid ? ws.cById[cid] : null;
    const broken = !crewFits(ws, vid, cid, list);
    if (!broken) continue;

    /* find a partner vehicle whose chauffeur can take this and vice versa */
    let done = false;
    for (let j = 0; j < vehicles.length && !done; j++) {
      if (i === j) continue;
      const ovid = vehicles[j].id;
      const ocid = ws.plan.crew[ovid];
      if (!ocid) continue;
      const oc = ws.cById[ocid];
      stats.crewSwapsTested++;
      const olist = tripsOn(ws.plan, ws.day, ovid);
      /* both sides of the swap must end up legal, or it is not a fix */
      if (!crewFits(ws, vid, ocid, list)) continue;
      if (!crewFits(ws, ovid, cid, olist)) continue;

      ws.plan.crew[ovid] = cid || null;
      ws.plan.crew[vid] = ocid;
      log.push({ kind: 'crew', vehicle: vid, from: cid, to: ocid, partner: ovid,
        why: needsVip && (!c || c.tier < H.VIP_MIN_TIER)
          ? 'VIP work on ' + ws.vById[vid].label + ' requires ' + H.TIER[H.VIP_MIN_TIER] + '+'
          : !c ? 'car was unstaffed'
          : !c.available ? c.name + ' is unavailable'
          : 'shift window does not cover the car’s work' });
      fixed++; done = true;
    }
    /* nobody to swap with: pull an idle chauffeur off the bench */
    if (!done) {
      const used = {}; Object.keys(ws.plan.crew).forEach(k => { if (ws.plan.crew[k]) used[ws.plan.crew[k]] = 1; });
      for (let k = 0; k < ws.fleet.chauffeurs.length; k++) {
        const cand = ws.fleet.chauffeurs[k];
        stats.crewSwapsTested++;
        if (used[cand.id]) continue;
        if (!crewFits(ws, vid, cand.id, list)) continue;
        ws.plan.crew[vid] = cand.id;
        log.push({ kind: 'crew', vehicle: vid, from: cid, to: cand.id, partner: null,
          why: 'idle ' + H.TIER[cand.tier] + ' chauffeur available' });
        fixed++; break;
      }
    }
  }
  return fixed;
}

/* ---------- initial construction ---------- */
function buildInitial(state) {
  const plan = M.emptyPlan();
  const ws = workState(state, plan);
  const stats = newStats();

  /* Crew the fleet. Two things matter and they pull against each other:
     shift coverage (demand is morning-heavy, so most cars need an early driver)
     and tier (VIP work can only ride with Professional or Principal). Pair by
     walking both queues, biased toward early shifts in the ratio the demand
     profile actually asks for. */
  const avail = state.fleet.chauffeurs.filter(c => c.available);
  const byTier = (a, b) => b.tier - a.tier || a.shiftStart - b.shiftStart;
  const early = avail.filter(c => c.shiftStart < 480).sort(byTier);
  const late  = avail.filter(c => c.shiftStart >= 480).sort(byTier);
  /* Shift cover is balanced WITHIN each class, not across the fleet as a whole.
     Spreading by fleet position silently correlates shift with class - four vans
     in a row all draw late drivers and then no van can serve a 7am pickup. */
  let ei = 0, li = 0;
  ['suv', 'van', 'sedan'].forEach(function (cls) {
    const group = state.fleet.vehicles.filter(v => v.cls === cls);
    const wantEarlyCount = Math.round(group.length * 0.6);
    group.forEach(function (v, i) {
      const wantEarly = i < wantEarlyCount;
      let c = null;
      if (wantEarly && ei < early.length) c = early[ei++];
      else if (!wantEarly && li < late.length) c = late[li++];
      else if (ei < early.length) c = early[ei++];
      else if (li < late.length) c = late[li++];
      plan.crew[v.id] = c ? c.id : null;
    });
  });

  /* Place trips chronologically within priority bands. Building chains forward
     in time costs far less cascading lateness than inserting mid-chain. */
  const order = state.day.trips.slice().sort(function (a, b) {
    const rank = t => (t.vip ? 0 : 1);
    return (rank(a) - rank(b)) || (a.pickup - b.pickup);
  });
  order.forEach(function (t) {
    const r = bestFor(ws, t, stats, null, null);
    plan.assign[t.id] = r.best ? r.best.vehicleId : null;
  });
  repairCrew(ws, stats, []);
  /* anything still homeless goes to an affiliate rather than silently vanishing */
  state.day.trips.forEach(function (t) {
    if (!plan.assign[t.id]) {
      const r = bestFor(ws, t, stats, null, null);
      plan.assign[t.id] = r.best ? r.best.vehicleId : 'AFFILIATE';
      if (plan.assign[t.id] === 'AFFILIATE') t.affiliate = true;
    }
  });
  return plan;
}

function newStats() {
  return { candidates: 0, feasible: 0, movesTested: 0, movesAccepted: 0,
           iterations: 0, crewSwapsTested: 0, ms: 0, costBefore: 0, costAfter: 0 };
}

/* ---------- the optimizer ---------- */
function optimize(state, opts) {
  opts = opts || {};
  const budgetMs = opts.budgetMs || 220;
  const t0 = (G.performance || Date).now();
  const stats = newStats();
  const baseline = M.clonePlan(state.plan);
  const plan = M.clonePlan(state.plan);
  const ws = workState(state, plan);
  const rnd = H.rng(opts.seed || (state.day.seed ^ Object.keys(plan.assign).length));
  const crewLog = [];
  const explain = {};   /* tripId -> {feasible, rejected} kept for the Explain drawer */

  stats.costBefore = M.cost(workState(state, baseline), M.project(workState(state, baseline)), baseline);

  /* --- phase 1: crew repair (an illegal crewing blocks every trip on the car) --- */
  repairCrew(ws, stats, crewLog);

  /* --- phase 2: constraint repair --- */
  const proj0 = M.project(ws);
  const broken = [];
  state.day.trips.forEach(function (t) {
    if (immovable(state, t)) return;
    const a = plan.assign[t.id];
    if (!a) { broken.push({ t: t, why: 'unassigned' }); return; }
    if (a === 'AFFILIATE') { broken.push({ t: t, why: 'farmed out' }); return; }
    const v = M.staticViolations(ws, t, a, proj0);
    if (v.length) { broken.push({ t: t, why: M.CODE_TEXT[v[0].code] }); return; }
    const leg = proj0.leg[t.id];
    if (leg && leg.late > M.LATE_THRESHOLD) broken.push({ t: t, why: 'projected ' + Math.round(leg.late) + ' min late' });
  });
  broken.sort(function (a, b) {
    const rank = x => (x.t.vip ? 0 : 1);
    return (rank(a) - rank(b)) || (a.t.pickup - b.t.pickup);
  });

  broken.forEach(function (b) {
    const t = b.t;
    const prev = plan.assign[t.id];
    plan.assign[t.id] = null;                       /* lift it out first */
    const r = bestFor(ws, t, stats, baseline, null);
    explain[t.id] = { feasible: r.feasible.slice(0, 6), rejected: dedupeRejects(r.rejected).slice(0, 8), why: b.why };
    if (r.best) {
      plan.assign[t.id] = r.best.vehicleId;
    } else if (opts.allowAffiliate !== false) {
      plan.assign[t.id] = 'AFFILIATE';
    } else {
      plan.assign[t.id] = prev;
    }
  });

  /* --- phase 3: ruin & recreate, time-boxed --- */
  const movable = state.day.trips.filter(t => !immovable(state, t));
  let cur = M.cost(ws, M.project(ws), baseline);
  while ((G.performance || Date).now() - t0 < budgetMs && movable.length > 2) {
    stats.iterations++;
    const k = 2 + Math.floor(rnd() * 4);
    const removed = [], saved = {};
    for (let i = 0; i < k; i++) {
      const t = movable[Math.floor(rnd() * movable.length)];
      if (saved.hasOwnProperty(t.id)) continue;
      saved[t.id] = plan.assign[t.id];
      plan.assign[t.id] = null;
      removed.push(t);
    }
    removed.sort((a, b) => (a.vip ? 0 : 1) - (b.vip ? 0 : 1) || a.pickup - b.pickup);
    removed.forEach(function (t) {
      stats.movesTested++;
      const r = bestFor(ws, t, stats, baseline, null);
      /* No legal home => farm it out. Restoring saved[t.id] here would put the
         trip back on a car the other reinsertions may have just made illegal,
         and the cost check below cannot see a hard violation. */
      plan.assign[t.id] = r.best ? r.best.vehicleId : 'AFFILIATE';
    });
    const next = M.cost(ws, M.project(ws), baseline);
    if (next < cur - 1e-9) { cur = next; stats.movesAccepted++; }
    else { Object.keys(saved).forEach(id => plan.assign[id] = saved[id]); }
  }

  /* --- phase 4: invariant. The optimizer must never HAND BACK an illegal plan.
     An operator may force one by overriding; the optimizer may not produce one.
     Enumerated from the plan, so a violation nobody anticipated still gets
     lifted rather than shipped. --- */
  let guard = 0;
  while (guard++ < 4) {
    const bad = M.validate(ws, M.project(ws));
    if (!bad.length) break;
    const ids = {};
    bad.forEach(x => { if (x.trip && !immovable(state, ws.tById[x.trip])) ids[x.trip] = 1; });
    repairCrew(ws, stats, crewLog);
    const still = M.validate(ws, M.project(ws));
    if (!still.length) break;
    Object.keys(ids).forEach(function (id) {
      plan.assign[id] = null;
      const r = bestFor(ws, ws.tById[id], stats, baseline, null);
      plan.assign[id] = r.best ? r.best.vehicleId : 'AFFILIATE';
    });
    if (!Object.keys(ids).length) break;
  }

  stats.ms = Math.max(1, Math.round((G.performance || Date).now() - t0));
  const finalProj = M.project(ws);
  stats.costAfter = M.cost(ws, finalProj, baseline);

  /* --- diff --- */
  const moves = [];
  state.day.trips.forEach(function (t) {
    const from = baseline.assign[t.id], to = plan.assign[t.id];
    if (from === to) return;
    moves.push({
      tripId: t.id, from: from, to: to,
      fromLabel: from === 'AFFILIATE' ? 'Affiliate' : from ? state.vById[from].label : 'Unassigned',
      toLabel:   to === 'AFFILIATE' ? 'Affiliate' : to ? state.vById[to].label : 'Unassigned',
      why: (explain[t.id] && explain[t.id].why) || 'improves the objective',
      lateBefore: null, lateAfter: finalProj.leg[t.id] ? finalProj.leg[t.id].late : null
    });
  });
  crewLog.forEach(function (c) {
    moves.push({ kind: 'crew', vehicle: c.vehicle,
      fromLabel: c.from ? state.cById[c.from].name : 'Unstaffed',
      toLabel: state.cById[c.to].name, why: c.why,
      vehicleLabel: state.vById[c.vehicle].label });
  });

  const beforeProj = M.project(workState(state, baseline));
  return {
    plan: plan, stats: stats, moves: moves, explain: explain,
    before: beforeProj, after: finalProj,
    delta: {
      onTimePct: finalProj.totals.onTimePct - beforeProj.totals.onTimePct,
      deadheadMi: finalProj.totals.deadheadMi - beforeProj.totals.deadheadMi,
      lateMin: finalProj.totals.lateMin - beforeProj.totals.lateMin,
      failures: finalProj.totals.failures - beforeProj.totals.failures,
      affiliate: finalProj.totals.affiliate - beforeProj.totals.affiliate,
      overtimeMin: finalProj.totals.overtimeMin - beforeProj.totals.overtimeMin,
      unassigned: finalProj.totals.unassigned - beforeProj.totals.unassigned
    }
  };
}

function dedupeRejects(list) {
  const seen = {}, out = [];
  list.forEach(function (r) {
    const key = r.reasons[0];
    if (seen[key] && seen[key] >= 2) return;
    seen[key] = (seen[key] || 0) + 1;
    out.push(r);
  });
  return out;
}

/* On-demand: why is this trip where it is, and what else was possible?
   Runs the same evaluation the optimizer runs, so the answer cannot drift
   away from the decision. */
function explainTrip(state, tripId) {
  const stats = newStats();
  const plan = M.clonePlan(state.plan);
  const trip = state.tById[tripId];
  const currentV = plan.assign[tripId];
  plan.assign[tripId] = null;
  const ws = workState(state, plan);
  const r = bestFor(ws, trip, stats, state.plan, null);
  plan.assign[tripId] = currentV;
  return {
    trip: trip, currentV: currentV, stats: stats,
    feasible: r.feasible.slice(0, 8),
    rejected: dedupeRejects(r.rejected).slice(0, 10)
  };
}

G.HO = { buildInitial, optimize, explainTrip, bestFor, evaluate, workState, tripsOn, newStats };
})(window);

</script>
<script>
/* ---- sim.js ---- */
/* Harmony - scenario days and disruption injection.
   Disruptions change the WORLD. They never touch the plan. Whatever damage
   appears afterwards is damage the model computed, not damage we scripted. */
(function (G) {
'use strict';
const H = G.HX, M = G.HM;

const DAYS = [
  { id: 'tue', seed: 0x6E55, refBase: 4100, count: 68, traffic: 1.00,
    vipRate: 0.12, airportRate: 0.42,
    name: 'Tuesday', date: 'Tue 14 Oct', sub: 'Ordinary weekday',
    brief: 'A normal book of business with slack in the fleet. This is the baseline: if Harmony cannot hold a clean plan here, nothing else matters.' },

  { id: 'fri', seed: 0x5D82, refBase: 4300, count: 98, traffic: 1.12,
    vipRate: 0.17, airportRate: 0.50,
    name: 'Friday', date: 'Fri 17 Oct', sub: 'Near capacity',
    brief: 'Ninety-eight reservations against thirty cars, eighteen of them VIP, with a heavy evening airport bank. The plan is legal but it is already paying for itself in overtime and a handful of late pickups - there is nowhere left to absorb a surprise.' },

  { id: 'chaos', seed: 0xC4A0, refBase: 4500, count: 92, traffic: 1.30,
    vipRate: 0.20, airportRate: 0.55,
    name: 'Storm Thursday', date: 'Thu 23 Oct', sub: 'Complete chaos',
    brief: 'Weather across the Northeast. Two cars already down, three inbound flights holding, two chauffeurs out, traffic up 30%. There is no clean plan here - the question is which compromise Harmony picks and whether it tells you the truth about it.',
    preload: true }
];

function buildDay(cfg) {
  const day = H.makeDay(cfg);
  day.preload = cfg.preload || false;
  return day;
}

/* pre-baked damage for the chaos day, applied to the WORLD before planning */
function preload(state) {
  const veh = state.fleet.vehicles;
  const suvs = veh.filter(v => v.cls === 'suv');
  const outs = [suvs[2], suvs[7]];
  outs.forEach(v => v.oos = { from: 0, to: 1440, reason: 'Mechanical - out all day' });

  const crew = state.fleet.chauffeurs;
  [crew[4], crew[19]].forEach(c => c.available = false);

  const arrivals = state.day.trips.filter(t => t.svc === 'arrival');
  arrivals.slice(0, 3).forEach(function (t, i) {
    const d = [40, 65, 25][i];
    t.flight.delayMin = d; t.pickup = t.basePickup + d;
  });
  return {
    vehiclesOut: outs.map(v => v.label),
    crewOut: [crew[4].name, crew[19].name],
    flights: arrivals.slice(0, 3).map(t => t.flight.code)
  };
}

/* ---------- disruptions ---------- */
/* Each returns { title, detail, affected:[tripId], kind }. `affected` is
   derived from the plan, not asserted. */

function flightDelay(state, minutes, tripId) {
  const proj = M.project(state);
  let t = tripId ? state.tById[tripId] : null;
  if (!t) {
    const cands = state.day.trips.filter(x => x.flight && x.svc === 'arrival' &&
      state.plan.assign[x.id] && state.plan.assign[x.id] !== 'AFFILIATE' &&
      !x.startedAt && x.pickup > state.clock && (!x.flight.delayMin));
    if (!cands.length) return null;
    t = cands[Math.floor(cands.length / 3)];
  }
  t.flight.delayMin += minutes;
  t.pickup = t.basePickup + t.flight.delayMin;
  const vid = state.plan.assign[t.id];
  const downstream = (proj.byVehicle[vid] || []).filter(id => state.tById[id].pickup > t.pickup);
  return {
    kind: 'flight',
    title: 'Flight ' + t.flight.code + ' delayed ' + minutes + ' min',
    detail: t.paxName + ' now lands at ' + H.hhmm(t.pickup - 35) + '. Pickup moves to ' +
            H.hhmm(t.pickup) + ' on ' + (vid ? state.vById[vid].label : 'no vehicle') + '.',
    affected: [t.id].concat(downstream)
  };
}

function breakdown(state, vehicleId) {
  const proj = M.project(state);
  let v = vehicleId ? state.vById[vehicleId] : null;
  if (!v) {
    const busy = state.fleet.vehicles
      .filter(x => !x.oos && proj.byVehicle[x.id].filter(id => !state.tById[id].startedAt).length >= 2);
    if (!busy.length) return null;
    const idle = busy.filter(x => !proj.byVehicle[x.id]
      .some(id => state.tById[id].startedAt && proj.leg[id].end > state.clock));
    const pool = idle.length ? idle : busy;
    v = pool[Math.floor(pool.length / 2)];
  }
  /* A car carrying a client cannot vanish from under them: it completes the
     run it is on, then goes down. */
  const running = proj.byVehicle[v.id]
    .filter(id => state.tById[id].startedAt && proj.leg[id].end > state.clock)
    .map(id => proj.leg[id].end);
  const downFrom = running.length ? Math.max.apply(null, running) : state.clock;
  v.oos = { from: downFrom, to: 1440, reason: 'Mechanical' };
  const stranded = proj.byVehicle[v.id].filter(id => !state.tById[id].startedAt);
  return {
    kind: 'breakdown',
    title: v.label + ' out of service',
    detail: v.model + ' down from ' + H.hhmm(downFrom) +
            (running.length ? ' (finishing its current run first). ' : '. ') + stranded.length +
            ' remaining assignment' + (stranded.length === 1 ? '' : 's') + ' need coverage.',
    affected: stranded
  };
}

function callout(state, chauffeurId) {
  const proj = M.project(state);
  let c = chauffeurId ? state.cById[chauffeurId] : null;
  if (!c) {
    const crewed = {};
    Object.keys(state.plan.crew).forEach(vid => { if (state.plan.crew[vid]) crewed[state.plan.crew[vid]] = vid; });
    const cands = state.fleet.chauffeurs.filter(function (x) {
      if (!x.available || !crewed[x.id]) return false;
      const list = proj.byVehicle[crewed[x.id]];
      /* not mid-run: you cannot pull a driver who has a client in the car */
      if (list.some(id => state.tById[id].startedAt && proj.leg[id].end > state.clock)) return false;
      return list.filter(id => !state.tById[id].startedAt).length >= 2;
    });
    if (!cands.length) return null;
    c = cands[Math.floor(cands.length / 2)];
  }
  c.available = false;
  let vid = null;
  Object.keys(state.plan.crew).forEach(k => { if (state.plan.crew[k] === c.id) vid = k; });
  const affected = vid ? proj.byVehicle[vid].filter(id => !state.tById[id].startedAt) : [];
  return {
    kind: 'callout',
    title: c.name + ' called out',
    detail: H.TIER[c.tier] + ' chauffeur unavailable from ' + H.hhmm(state.clock) +
            (vid ? '. ' + state.vById[vid].label + ' is now unstaffed with ' + affected.length + ' assignments.' : '.'),
    affected: affected
  };
}

function trafficSurge(state, mult) {
  state.day.traffic = Math.min(2.2, state.day.traffic * mult);
  const proj = M.project(state);
  const affected = Object.keys(proj.leg).filter(id =>
    !state.tById[id].startedAt && proj.leg[id].slack < 15 && state.tById[id].pickup > state.clock);
  return {
    kind: 'traffic',
    title: 'Traffic severity raised to ' + state.day.traffic.toFixed(2) + '×',
    detail: 'Every projected drive time recalculated. ' + affected.length +
            ' upcoming trips now have under 15 minutes of buffer.',
    affected: affected
  };
}

function lastMinute(state, n) {
  n = n || 1;
  const r = H.rng((state.day.seed ^ state.day.nextRef) >>> 0);
  const added = [];
  for (let i = 0; i < n; i++) {
    const t = H.makeTrip(r, state.day.nextRef++, { vipRate: 0.25, airportRate: 0.7 });
    t.pickup = t.basePickup = Math.min(1380, state.clock + 40 + Math.floor(r() * 70));
    t.injected = true; t.notified = false;
    if (t.flight) t.flight.sched = t.pickup - 35;
    state.day.trips.push(t); state.tById[t.id] = t;
    state.plan.assign[t.id] = null;
    added.push(t.id);
  }
  state.day.trips.sort((a, b) => a.pickup - b.pickup);
  const first = state.tById[added[0]];
  return {
    kind: 'reservation',
    title: n === 1 ? 'Last-minute reservation ' + first.ref : n + ' new reservations received',
    detail: n === 1
      ? (first.vip ? 'VIP ' : '') + H.CLASS_LABEL[first.reqCls] + ' for ' + first.paxName +
        ', pickup ' + H.hhmm(first.pickup) + ' at ' + H.LOC[first.from].name + '. Unassigned.'
      : 'Inbound bank at PHL. All unassigned, earliest pickup ' + H.hhmm(first.pickup) + '.',
    affected: added
  };
}

function airportSurge(state) {
  const r = H.rng((state.day.seed ^ 0xA17F ^ state.day.nextRef) >>> 0);
  const added = [];
  const base = Math.max(state.clock + 45, 17 * 60);
  for (let i = 0; i < 6; i++) {
    const t = H.makeTrip(r, state.day.nextRef++, { vipRate: 0.2, airportRate: 1 });
    t.svc = 'arrival'; t.from = 'PHL';
    t.to = H.pick(r, H.SUBURBS);
    t.pickup = t.basePickup = base + i * 9 + Math.floor(r() * 7);
    t.flight = { code: H.pick(r, H.AIRLINES) + ' ' + (1200 + Math.floor(r() * 700)), sched: t.pickup - 35, delayMin: 0 };
    t.injected = true; t.notified = false;
    state.day.trips.push(t); state.tById[t.id] = t;
    state.plan.assign[t.id] = null;
    added.push(t.id);
  }
  state.day.trips.sort((a, b) => a.pickup - b.pickup);
  return {
    kind: 'surge',
    title: 'Airport bank - 6 arrivals in 50 minutes',
    detail: 'Diverted aircraft released at PHL from ' + H.hhmm(base) + '. All six unassigned.',
    affected: added
  };
}

function chaos(state) {
  const events = [];
  const seq = [
    () => breakdown(state), () => breakdown(state),
    () => callout(state), () => callout(state),
    () => flightDelay(state, 55), () => flightDelay(state, 35),
    () => trafficSurge(state, 1.28), () => airportSurge(state)
  ];
  seq.forEach(function (f) { const e = f(); if (e) events.push(e); });
  const affected = {};
  events.forEach(e => e.affected.forEach(id => affected[id] = 1));
  return {
    kind: 'chaos',
    title: 'Complete chaos',
    detail: events.length + ' simultaneous disruptions. ' + Object.keys(affected).length +
            ' reservations touched.',
    affected: Object.keys(affected),
    events: events
  };
}

G.HS = { DAYS, buildDay, preload, flightDelay, breakdown, callout, trafficSurge,
         lastMinute, airportSurge, chaos };
})(window);

<script>
/* ---- audit.js ---- */
/* Harmony - independent plan auditor.
   This is deliberately NOT the code that builds the plan. It walks the plan
   that exists and re-derives every hard constraint from the world, including
   the ones the construction code believes it guarantees. A checker written
   from the builder's own list can only find what the builder remembered.

   It is allowed to fail, and when it fails the UI says so. */
(function (G) {
'use strict';
const H = G.HX, M = G.HM;

function audit(state) {
  const checks = [];
  const failures = [];
  let performed = 0;

  function check(name, fn) {
    const res = fn();
    performed += res.n;
    checks.push({ name: name, n: res.n, failed: res.bad.length });
    res.bad.forEach(b => failures.push({ check: name, detail: b }));
  }

  /* 1. every reservation is accounted for exactly once - walked from the day,
        then walked back from the plan, so an orphan in either direction shows */
  check('Reservation coverage', function () {
    const bad = []; let n = 0;
    const seen = {};
    state.day.trips.forEach(function (t) {
      n++;
      if (!state.plan.assign.hasOwnProperty(t.id)) bad.push(t.ref + ' missing from the plan entirely');
      seen[t.id] = 1;
    });
    Object.keys(state.plan.assign).forEach(function (id) {
      n++;
      if (!seen[id]) bad.push(id + ' is in the plan but not in the day');
    });
    return { n: n, bad: bad };
  });

  const proj = M.project(state);

  /* 2. vehicle class substitution */
  check('Vehicle class substitution', function () {
    const bad = []; let n = 0;
    state.day.trips.forEach(function (t) {
      const vid = state.plan.assign[t.id];
      if (!vid || vid === 'AFFILIATE') return;
      n++;
      const v = state.vById[vid];
      if (!H.canCover(v.cls, t.reqCls))
        bad.push(t.ref + ': ' + H.CLASS_LABEL[v.cls] + ' ' + v.label + ' on a ' +
                 H.CLASS_LABEL[t.reqCls] + ' request');
    });
    return { n: n, bad: bad };
  });

  /* 3. seated capacity */
  check('Passenger capacity', function () {
    const bad = []; let n = 0;
    state.day.trips.forEach(function (t) {
      const vid = state.plan.assign[t.id];
      if (!vid || vid === 'AFFILIATE') return;
      n++;
      const v = state.vById[vid];
      if (t.pax > v.cap) bad.push(t.ref + ': ' + t.pax + ' pax in a ' + v.cap + '-seat ' + v.label);
    });
    return { n: n, bad: bad };
  });

  /* 4. VIP chauffeur tier */
  check('VIP chauffeur tier', function () {
    const bad = []; let n = 0;
    state.day.trips.forEach(function (t) {
      if (!t.vip) return;
      const vid = state.plan.assign[t.id];
      if (!vid || vid === 'AFFILIATE') return;
      if (t.startedAt != null) return;    /* it ran, with whoever was driving then */
      n++;
      const cid = state.plan.crew[vid];
      if (!cid) { bad.push(t.ref + ': VIP on unstaffed ' + state.vById[vid].label); return; }
      const c = state.cById[cid];
      if (c.tier < H.VIP_MIN_TIER)
        bad.push(t.ref + ': VIP with ' + H.TIER[c.tier] + ' ' + c.name);
    });
    return { n: n, bad: bad };
  });

  /* 5. vehicle availability windows */
  check('Vehicle service windows', function () {
    const bad = []; let n = 0;
    state.fleet.vehicles.forEach(function (v) {
      if (!v.oos) return;
      proj.byVehicle[v.id].forEach(function (id) {
        /* a run already under way completes; going out of service stops the
           car taking NEW work, it does not undo work already begun */
        if (state.tById[id].startedAt != null) return;
        n++;
        const l = proj.leg[id];
        if (l.start < v.oos.to && l.end > v.oos.from)
          bad.push(state.tById[id].ref + ' runs ' + H.hhmm(l.start) + '-' + H.hhmm(l.end) +
                   ' on ' + v.label + ', out of service ' + H.hhmm(v.oos.from) + '-' + H.hhmm(v.oos.to));
      });
    });
    return { n: n, bad: bad };
  });

  /* 6. chauffeur shift coverage and hard overtime cap */
  check('Chauffeur shift coverage', function () {
    const bad = []; let n = 0;
    state.fleet.vehicles.forEach(function (v) {
      const cid = state.plan.crew[v.id];
      const list = proj.byVehicle[v.id];
      if (!list.length) return;
      n++;
      const future = list.filter(id => state.tById[id].startedAt == null);
      if (!cid) {
        if (future.length)
          bad.push(v.label + ' carries ' + future.length + ' upcoming trips with no chauffeur');
        return;
      }
      const c = state.cById[cid];
      if (!c.available) { bad.push(v.label + ' crewed to ' + c.name + ', who is unavailable'); return; }
      /* booked pickups before the driver comes on duty. Checked against the
         BOOKED time: the projection silently absorbs this as lateness, so a
         check reading the projection would always pass. */
      list.forEach(function (id) {
        const t = state.tById[id];
        if (t.startedAt != null) return;   /* history, judged when it was planned */
        n++;
        if (t.pickup < c.shiftStart - 15)
          bad.push(t.ref + ' booked ' + H.hhmm(t.pickup) + ' on ' + v.label +
                   ', but ' + c.name + ' starts at ' + H.hhmm(c.shiftStart));
      });
      /* The overtime cap governs what the plan may CHOOSE. Once every remaining
         job on the car is already under way, running over is an outcome of the
         day, not an illegal assignment - the optimizer has nothing left it is
         allowed to move. It is reported under service quality instead. */
      const p = proj.vehicles[v.id];
      if (p.overtimeMin > M.OVERTIME_HARD_CAP && future.length)
        bad.push(c.name + ' runs ' + Math.round(p.overtimeMin) + ' min past shift end (cap ' +
                 M.OVERTIME_HARD_CAP + '), with ' + future.length + ' trip' +
                 (future.length === 1 ? '' : 's') + ' still reassignable');
    });
    return { n: n, bad: bad };
  });

  /* 7. one chauffeur, one vehicle */
  check('Chauffeur single-crewing', function () {
    const bad = []; let n = 0; const seen = {};
    Object.keys(state.plan.crew).forEach(function (vid) {
      const cid = state.plan.crew[vid]; if (!cid) return;
      n++;
      if (seen[cid]) bad.push(state.cById[cid].name + ' crewed to both ' +
        state.vById[seen[cid]].label + ' and ' + state.vById[vid].label);
      else seen[cid] = vid;
    });
    return { n: n, bad: bad };
  });

  /* 8. physical impossibility: a vehicle in two places at once.
        The scheduler builds chains sequentially and therefore believes this
        cannot happen. Checked pairwise anyway, which is the point. */
  check('No vehicle double-booked', function () {
    const bad = []; let n = 0;
    state.fleet.vehicles.forEach(function (v) {
      const legs = proj.byVehicle[v.id].map(id => proj.leg[id]).sort((a, b) => a.start - b.start);
      for (let i = 0; i < legs.length; i++) {
        for (let j = i + 1; j < legs.length; j++) {
          n++;
          if (legs[j].start < legs[i].end - 0.01)
            bad.push(v.label + ': ' + state.tById[legs[i].tripId].ref + ' and ' +
                     state.tById[legs[j].tripId].ref + ' overlap');
        }
      }
    });
    return { n: n, bad: bad };
  });

  /* 9. the car cannot teleport between jobs */
  check('Repositioning continuity', function () {
    const bad = []; let n = 0;
    state.fleet.vehicles.forEach(function (v) {
      const ids = proj.byVehicle[v.id].slice().sort((a, b) => proj.leg[a].start - proj.leg[b].start);
      for (let i = 1; i < ids.length; i++) {
        n++;
        const prev = state.tById[ids[i - 1]], cur = state.tById[ids[i]];
        const prevEnd = proj.leg[ids[i - 1]].end, curStart = proj.leg[ids[i]].start;
        if (cur.startedAt != null) {
          /* The car actually made this drive. Re-costing it against traffic
             that got worse afterwards would report history as impossible. The
             only real contradiction is the previous job still running. */
          if (curStart < prevEnd - 0.5)
            bad.push(v.label + ': ' + cur.ref + ' departed at ' + H.hhmm(curStart) +
                     ' while ' + prev.ref + ' was still running until ' + H.hhmm(prevEnd));
          continue;
        }
        const need = H.travelMin(H.endLoc(prev), cur.from, prevEnd, state.day.traffic);
        if (curStart < prevEnd + need - 0.5)
          bad.push(v.label + ': ' + cur.ref + ' starts ' +
                   Math.round(prevEnd + need - curStart) +
                   ' min before the car could arrive');
      }
    });
    return { n: n, bad: bad };
  });

  /* 10. history is immutable: a trip the operation already began must still be
         on the car that began it, and a completed one must keep the times it
         actually ran. Enumerated from the trips that carry recorded actuals. */
  check('Committed trips unchanged', function () {
    const bad = []; let n = 0;
    state.day.trips.forEach(function (t) {
      if (!t.startedAt) return;
      n++;
      const now = state.plan.assign[t.id];
      const ran = t.actual ? t.actual.v : t.startedOn;
      if (ran && now !== ran)
        bad.push(t.ref + ' started on ' + (state.vById[ran] ? state.vById[ran].label : ran) +
                 ' but is now assigned to ' +
                 (now === 'AFFILIATE' ? 'an affiliate' : now ? state.vById[now].label : 'nothing'));
      const l = proj.leg[t.id];
      if (l && Math.abs(l.start - t.startedAt) > 0.5)
        bad.push(t.ref + ' began at ' + H.hhmm(t.startedAt) + ' but the plan now shows ' + H.hhmm(l.start));
    });
    return { n: n, bad: bad };
  });

  /* 11. locked assignments were respected */
  check('Locked assignments', function () {
    const bad = []; let n = 0;
    state.day.trips.forEach(function (t) {
      if (!t.locked) return;
      n++;
      if (state.plan.assign[t.id] !== t.lockedTo)
        bad.push(t.ref + ' was locked to ' +
                 (t.lockedTo ? state.vById[t.lockedTo].label : 'nothing') +
                 ' but sits on ' + (state.plan.assign[t.id] === 'AFFILIATE' ? 'an affiliate'
                   : state.plan.assign[t.id] ? state.vById[state.plan.assign[t.id]].label : 'nothing'));
    });
    return { n: n, bad: bad };
  });

  return {
    checks: checks, failures: failures, performed: performed,
    clean: failures.length === 0,
    proj: proj,
    /* service quality is reported, not asserted clean - lateness is legal */
    service: {
      late: Object.keys(proj.leg).filter(id => proj.leg[id].late > M.LATE_THRESHOLD).length,
      failed: Object.keys(proj.leg).filter(id => proj.leg[id].late > M.SERVICE_FAIL).length,
      unassigned: proj.unassigned.length,
      affiliate: proj.affiliate.length
    }
  };
}

G.HA = { audit };
})(window);

</script>

(function (G) {

    clock: S.clock,
    trips: S.day.trips.map(t => ({ id: t.id, pickup: t.pickup, locked: t.locked,
      lockedTo: t.lockedTo, delay: t.flight ? t.flight.delayMin : 0,
      startedAt: t.startedAt, startedOn: t.startedOn,
      actual: t.actual ? Object.assign({}, t.actual) : null })),

  clearProposal();
  if (S.autoOpt) runOptimize('weights changed');
}
function hintWeights() {
  const w = S.weights;
  $('#wHint').textContent = 'late ×' + w.late + ' · deadhead ×' + w.deadhead + ' · overtime ×' +
    w.overtime + ' · disruption ×' + w.disruption + ' · affiliate ×' + w.affiliate +
    '. These are the real coefficients in the objective function.';
}

function buildBubbles() {
  const n = $('#bubbles'); n.innerHTML = '';
  S.faces.forEach(function (id, i) {
    const b = el('button', 'bub', LIB[id].label);
    b.dataset.face = i;
    b.onclick = () => setFace(i, false);
    n.appendChild(b);
  });
  const a = el('button', 'bub auto', 'Auto');
  a.dataset.face = 'auto';
  a.onclick = () => setFace(frontFace(), !S.overlayAuto);
  n.appendChild(a);
  markBubbles();
}

/* Which face is presented, derived from the free rotation angle rather than
   stored separately - so a wheel-parked prism and a clicked one are the same
   state, and there is nothing to keep in sync. */
function frontFace() { return ((Math.round(S.angle / STEP) % FACES) + FACES) % FACES; }
function offAxis()   { return Math.abs(((S.angle % STEP) + STEP + STEP / 2) % STEP - STEP / 2); }

function setFace(i, auto) {
  S.overlayAuto = !!auto;
  clearInterval(S.autoTimer); S.autoTimer = null;
  /* rotate to the nearest congruent angle so the board never spins the long
     way round to reach an adjacent face */
  const target = i * STEP;
  S.angle = target + 360 * Math.round((S.angle - target) / 360);
  applyRotation(true);
  if (auto) {
    S.autoTimer = setInterval(function () {
      S.angle += STEP;
      applyRotation(true);
    }, S.timing.autoIntervalMs);
  }
}

/* Push the angle onto every prism. The stagger is keyed to horizontal
   position, so the board turns as one wave sweeping left to right instead of
   ninety-eight things twitching at once. */
function applyRotation(animate) {
  const ms = S.overlayAuto ? S.timing.autoMs : S.timing.clickMs;
  document.querySelectorAll('.trip .prism').forEach(function (p) {
    p.style.transitionDuration = animate ? ms + 'ms' : '0ms';
    p.style.setProperty('--rot', S.angle.toFixed(2) + 'deg');
  });
  paintFlat();
  markBubbles();
}

/* Bars too narrow to carry a face swap their label instead of rotating. */
function paintFlat() {
  const proj = S.lastProj; if (!proj) return;
  const id = S.faces[frontFace()];
  document.querySelectorAll('.trip.flat .nm').forEach(function (nm) {
    const host = nm.closest('.trip'); if (!host) return;
    const t = S.tById[host.dataset.t]; if (!t) return;
    const next = overlayText(t, proj.leg[t.id], proj.status[t.id], id);
    if (nm.textContent === next) return;
    nm.textContent = next;
    nm.classList.remove('swap'); void nm.offsetWidth; nm.classList.add('swap');
  });
}

function markBubbles() {
  const front = frontFace(), between = offAxis() > 12;
  document.querySelectorAll('#bubbles .bub').forEach(function (b) {
    if (b.dataset.face === 'auto') {
      b.classList.toggle('on', S.overlayAuto);
      b.classList.remove('near');
      return;
    }
    const isFront = +b.dataset.face === front;
    b.classList.toggle('on', isFront && !between);
    b.classList.toggle('near', isFront && between);
  });
  $('#angleRead').textContent = between
    ? Math.round(offAxis()) + '° off ' + LIB[S.faces[front]].label.toLowerCase()
    : LIB[S.faces[front]].label;
}

function overlayText(t, l, st, which) {
  const o = LIB[which || S.faces[frontFace()]];
  return o ? String(o.text(t, l, st)) : '';
}

/* Pick legible ink for an arbitrary background. A colour picker will hand us
   anything, so contrast has to be derived, not chosen. */
function inkFor(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return '#05090d';
  const n = parseInt(m[1], 16);
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin((n >> 16) & 255) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
  return L > 0.34 ? '#05090d' : '#f2f6fa';
}
function overlayColor(id) { return S.faceColor[id] || (LIB[id] && LIB[id].color) || '#5c6b7e'; }

function applyOverlayColors() {
  const r = document.documentElement;
  OVERLAY_LIB.forEach(function (o) {
    if (!o.color) return;                       /* status has no colour of its own */
    const c = overlayColor(o.id);
    r.style.setProperty('--ov-' + o.id, c);
    r.style.setProperty('--ovink-' + o.id, inkFor(c));
  });
}

/* ================= board setup =================
   A popover rather than a modal, deliberately: colour and speed are judged by
   looking at the board, so the board has to stay visible while you change them. */
function buildSetup() {
  const n = $('#setup');
  const opts = id => OVERLAY_LIB.map(o =>
    '<option value="' + o.id + '"' + (o.id === id ? ' selected' : '') + '>' + o.label + '</option>').join('');

  n.innerHTML =
    '<div class="setuphead"><b>Board setup</b>' +
      '<button class="setupclose" id="setupClose" aria-label="Close">×</button></div>' +

    '<p class="setupnote">Three of ' + OVERLAY_LIB.length +
      ' overlays load onto the prism’s three faces.</p>' +
    '<div class="slots" id="slots">' +
      S.faces.map(function (id, i) {
        return '<div class="slot"><span class="slotno">' + (i + 1) + '</span>' +
          '<select data-slot="' + i + '">' + opts(id) + '</select>' +
          (id === 'status'
            ? '<span class="bystatus" title="Status carries the lifecycle colour">by status</span>'
            : '<input type="color" data-col="' + id + '" value="' + overlayColor(id) + '">') +
          '</div>';
      }).join('') +
    '</div>' +

    '<h5>Face background</h5>' +
    '<div class="segrow" id="bgSeg">' +
      '<button data-bg="status"' + (S.faceBg === 'status' ? ' class="on"' : '') + '>Status colour</button>' +
      '<button data-bg="overlay"' + (S.faceBg === 'overlay' ? ' class="on"' : '') + '>Overlay colour</button>' +
    '</div>' +
    '<p class="setupnote">Status colour shows every face in the trip’s lifecycle colour. ' +
      'Overlay colour gives each face its own — except Status, which always tracks the lifecycle.</p>' +

    '<h5>Auto rotation</h5>' +
    '<div class="sliderow"><input type="range" id="spdRange" min="300" max="1600" step="10" ' +
      'value="' + S.timing.autoMs + '"><span id="spdRead"></span></div>' +
    '<p class="setupnote">Turns every 6s. The wheel is unaffected — it follows your hand ' +
      'with no animation at all, so you keep precise control.</p>';

  $('#setupClose').onclick = closeSetup;

  n.querySelectorAll('select[data-slot]').forEach(function (sel) {
    sel.onchange = function () {
      const i = +sel.dataset.slot, id = sel.value, had = S.faces.indexOf(id);
      /* if it is already on another face, swap them rather than leaving a duplicate */
      if (had !== -1 && had !== i) S.faces[had] = S.faces[i];
      S.faces[i] = id;
      buildSetup(); buildBubbles(); render(); applyRotation(false);
    };
  });

  n.querySelectorAll('input[data-col]').forEach(function (inp) {
    inp.oninput = function () {
      S.faceColor[inp.dataset.col] = inp.value;
      applyOverlayColors();          /* one style write; no re-render needed */
    };
  });

  n.querySelectorAll('#bgSeg button').forEach(function (b) {
    b.onclick = function () {
      S.faceBg = b.dataset.bg;
      buildSetup(); render(); applyRotation(false);
    };
  });

  const rng = $('#spdRange');
  const showSpeed = () => {
    $('#spdRead').textContent = S.timing.autoMs + ' ms · ' +
      Math.round(S.timing.autoMs / AUTO_BASE * 100) + '%';
  };
  rng.oninput = function () { S.timing.autoMs = +rng.value; showSpeed(); };
  showSpeed();
}
function openSetup() { $('#setup').hidden = false; }
function closeSetup() { $('#setup').hidden = true; }

function buildStatusKey() {
  const n = $('#statusKey'); n.innerHTML = '';
  M.STATUS.forEach(function (st) {

/* ================= day loading ================= */
function loadDay(id, first) {
  const cfg = SIM.DAYS.filter(d => d.id === id)[0];
  S.dayCfg = cfg;
  S.fleet = H.buildFleet();          /* deterministic: a fresh, clean world every time */
  S.day = SIM.buildDay(cfg);
  S.plan = M.emptyPlan();
  M.index(S);
  S.clock = 300; S.history = []; S.proposal = null; S.lastSig = ''; S.lastStatus = null;
  $('#undoBtn').disabled = true;

  let pre = null;
  if (cfg.preload) pre = SIM.preload(S);

  S.plan = O.buildInitial(S);
  M.index(S);
  /* The overnight planning run from the design notes: construction gives a
     feasible plan, this settles it. Same optimizer the operator drives by hand. */
  const settle = O.optimize(S, { budgetMs: 900, allowAffiliate: true });
  S.plan = settle.plan;
  M.index(S);
  S.settleStats = settle.stats;

  document.querySelectorAll('#days button').forEach(b => b.classList.toggle('on', b.dataset.day === id));
  $('#brief').innerHTML = '<b>' + cfg.name + ' — ' + cfg.sub + '.</b> ' + cfg.brief;
  $('#log').innerHTML = '';
  clearProposal();
  render();

  const p = S.lastProj;
  logLine('sys', 'Day loaded — ' + cfg.name,
    S.day.trips.length + ' reservations · ' + S.fleet.vehicles.length + ' vehicles · ' +
    S.fleet.chauffeurs.length + ' chauffeurs. Overnight plan built: greedy construction, then ' +
    S.settleStats.iterations.toLocaleString() + ' local-search iterations over ' +
    S.settleStats.candidates.toLocaleString() + ' evaluated pairings in ' + S.settleStats.ms + ' ms.');
  if (pre) {
    logLine('bad', 'Day begins already damaged',
      'Out of service: ' + pre.vehiclesOut.join(', ') + '. Called out: ' + pre.crewOut.join(', ') +
      '. Holding: ' + pre.flights.join(', ') + '. Traffic ' + S.day.traffic.toFixed(2) + '×.');
  }
  reportState('Initial plan');
  setSpeed(0);
  if (first) setTimeout(() => toast('ok', 'Try to break it', 'Drag a trip onto a car that cannot take it. Inject a disruption. Then hit AUDIT and see whether Harmony is telling you the truth.'), 900);
}

/* ================= rendering ================= */
function render() {
  const proj = M.project(S);
  const viol = M.validate(S, proj);
  S.lastProj = proj; S.lastViol = viol;
  S.lastStatus = proj.status;   /* the objective prices a change by how close the car is */

  const vbad = {};
  viol.forEach(v => { if (v.trip) (vbad[v.trip] = vbad[v.trip] || []).push(v); });

  renderKpis(proj, viol);
  renderRows(proj, vbad);
  renderUnassigned(proj, vbad);
  renderStatus(proj, viol);

  markBubbles();
  $('#boardsub').textContent = S.day.trips.length + ' reservations · ' +
    proj.totals.vehiclesUsed + '/' + S.fleet.vehicles.length + ' vehicles working · traffic ' +
    S.day.traffic.toFixed(2) + '×';
  positionNow();
}

function renderKpis(proj, viol) {
  const t = proj.totals;
  const econ = M.economics(proj);
  const tiles = [
    { k: t.completed ? 'ON-TIME, WHOLE DAY' : 'PROJECTED ON-TIME', v: t.onTimePct.toFixed(1) + '%',
      s: t.completed ? t.completed + ' measured, ' + (t.trips - t.completed) + ' projected'
                     : t.onTime + ' of ' + t.trips + ' within ' + M.LATE_THRESHOLD + ' min',
      cls: t.onTimePct > 93 ? 'good' : t.onTimePct > 82 ? 'warn' : 'bad' },
    { k: 'HARD VIOLATIONS', v: String(viol.length),
      s: viol.length ? 'plan is illegal' : 'all constraints hold',
      cls: viol.length ? 'bad' : 'good' },
    { k: 'SERVICE FAILURES', v: String(t.failures),
      s: 'over ' + M.SERVICE_FAIL + ' min late',
      cls: t.failures ? 'warn' : 'good' },
    { k: 'UNASSIGNED', v: String(t.unassigned),
      s: t.affiliate + ' farmed to affiliate', cls: t.unassigned ? 'bad' : '' },
    { k: 'COMPLETED', v: t.completed + ' of ' + t.trips,
      s: t.actualOnTimePct == null ? 'day has not started'
        : t.actualOnTimePct.toFixed(1) + '% on time, actual',
      cls: t.actualOnTimePct == null ? '' : t.actualOnTimePct > 93 ? 'good' : t.actualOnTimePct > 82 ? 'warn' : 'bad' },
    { k: 'DEADHEAD', v: Math.round(t.deadheadMi) + ' mi',
      s: '$' + Math.round(econ.deadheadCost) + ' unbilled', cls: '' },
    { k: 'OVERTIME', v: Math.round(t.overtimeMin) + ' min',
      s: '$' + Math.round(econ.overtimeCost) + ' premium', cls: t.overtimeMin > 240 ? 'warn' : '' }
  ];
  $('#kpis').innerHTML = tiles.map(x =>
    '<div class="kpi"><span>' + x.k + '</span><strong class="' + x.cls + '">' + x.v +
    '</strong><em>' + x.s + '</em></div>').join('');
}

/* Violations sitting on assignments the operator pinned. Harmony will not break
   a lock to fix itself, so these are reported as a standoff rather than as the
   optimizer having failed. */
function lockedConflicts(viol) {
  const s = {};
  viol.forEach(v => { if (v.trip && S.tById[v.trip] && S.tById[v.trip].locked) s[v.trip] = 1; });
  return Object.keys(s);
}

function renderStatus(proj, viol) {
  const p = $('#statepill'), t = proj.totals;
  const lc = lockedConflicts(viol);
  let cls = '', txt = 'PLAN STABLE';
  if (viol.length && lc.length === viol.length) {
    cls = 'bad'; txt = lc.length + ' LOCK CONFLICT' + (lc.length > 1 ? 'S' : '');
  }
  else if (viol.length) { cls = 'bad'; txt = viol.length + ' CONSTRAINT' + (viol.length > 1 ? 'S' : '') + ' BROKEN'; }
  else if (t.unassigned) { cls = 'bad'; txt = t.unassigned + ' UNASSIGNED'; }
  else if (t.failures) { cls = 'risk'; txt = t.failures + ' SERVICE FAILURE' + (t.failures > 1 ? 'S' : ''); }
  else if (t.onTimePct < 97) { cls = 'risk'; txt = 'AT RISK'; }
  p.className = 'statepill ' + cls;
  p.querySelector('span').textContent = txt;
  $('#intelTitle').textContent =
    viol.length && lc.length === viol.length ? 'Blocked by locks' :
    viol.length ? 'Plan is illegal' : t.unassigned ? 'Coverage gap' :
    t.failures ? 'Degraded service' : 'Monitoring';
}

/* Which background a face wears.
   In status mode every face shows the trip's lifecycle colour. In overlay mode
   each face wears its own - except Status, whose colour IS its data, so it
   always tracks the lifecycle regardless of mode. */
function faceVars(id, i) {
  const useStatus = (S.faceBg === 'status' || id === 'status' || !id);
  return '--i:' + i +
    ';--fbg:' + (useStatus ? 'var(--bar)' : 'var(--ov-' + id + ')') +
    ';--fink:' + (useStatus ? 'var(--barink)' : 'var(--ovink-' + id + ')');
}

function prismHtml(t, l, st, wide) {
  const face = (id, i) =>
    '<div class="face" style="' + faceVars(id, i) + '">' +
      '<span class="ref">' + t.ref + '</span>' +
      '<span class="svc" title="' + svcName(t) + '">' + SVC_GLYPH[t.svc] + '</span>' +
      '<span class="nm">' + overlayText(t, l, st, id) + '</span>' +
    '</div>';
  /* A narrow bar gets a single face and never turns: rotating a 24px sliver is
     motion without information. */
  return '<div class="prism">' +
    (wide ? S.faces.map((id, i) => face(id, i)).join('')
          : face(S.faces[frontFace()], 0)) +
    '</div>';
}

function renderRows(proj, vbad) {
  const wrap = $('#rows');
  const ghosts = S.proposal ? S.proposal.plan.assign : null;
  const trackW = Math.max(200, $('#gridwrap').clientWidth - 150);
  wrap.innerHTML = '';
  S.fleet.vehicles.forEach(function (v) {
    const p = proj.vehicles[v.id];
    const crewId = S.plan.crew[v.id];
    const c = crewId ? S.cById[crewId] : null;
    const row = el('div', 'vrow' + (v.oos ? ' oos' : ''));
    row.dataset.v = v.id;

    const crewCls = !c || !c.available ? 'none' : 't' + c.tier;
    const crewTxt = !c ? 'UNSTAFFED' : (!c.available ? c.name + ' — OUT' : c.name + ' · ' + H.TIER[c.tier]);
    row.appendChild(el('div', 'vlabel',
      '<span class="cls ' + v.cls + '">' + H.CLASS_LABEL[v.cls].toUpperCase().slice(0, 3) + '</span>' +
      '<span class="vmeta"><b>' + v.label + (v.oos ? ' ✕' : '') + '</b>' +
      '<small class="' + crewCls + '">' + crewTxt + '</small></span>'));

    const track = el('div', 'track');
    p.legs.forEach(function (l) {
      const t = S.tById[l.tripId];
      const broken = vbad[t.id] && vbad[t.id].length;
      const st = proj.status[t.id];
      const cls = 'trip st-' + st + (t.vip ? ' vip' : '') +
        (broken ? ' broken' : l.late > M.LATE_THRESHOLD ? ' late' : '') +
        (t.locked ? ' locked' : '') + (M.committed(S, t) ? ' committed' : '') +
        (t.injected ? ' injected' : '') +
        (S.problemsOnly && !broken && l.late <= M.LATE_THRESHOLD ? ' dim' : '') +
        (ghosts && ghosts[t.id] !== v.id ? ' moving' : '');
      const wPct = Math.max(1.1, (Math.min(l.end, T1) - Math.max(l.start, T0)) / SPAN * 100);
      const wide = (wPct / 100) * trackW >= PRISM_MIN_PX;
      const b = el('div', cls + (wide ? '' : ' flat'), prismHtml(t, l, st, wide));
      b.style.left = xp(l.start) + '%';
      b.style.width = wPct + '%';
      b.querySelector('.prism').style.setProperty('--rot', S.angle.toFixed(2) + 'deg');
      b.draggable = !t.locked && !M.committed(S, t);
      b.dataset.t = t.id;
      b.title = tipFor(t, l, vbad[t.id]);
      b.tabIndex = 0;   /* the board is operable from the keyboard, not just the mouse */
      b.addEventListener('dragstart', onDragStart);
      b.addEventListener('click', e => { e.stopPropagation(); openTrip(t.id); });
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openTrip(t.id); }
      });
      track.appendChild(b);
    });

    if (ghosts) {
      Object.keys(ghosts).forEach(function (tid) {
        if (ghosts[tid] !== v.id || S.plan.assign[tid] === v.id) return;
        const t = S.tById[tid];
        const gl = S.proposal.after.leg[tid];
        if (!gl) return;
        const g = el('div', 'ghost', t.ref + ' ' + t.paxName);
        g.style.left = xp(gl.start) + '%';
        g.style.width = Math.max(1.1, (Math.min(gl.end, T1) - Math.max(gl.start, T0)) / SPAN * 100) + '%';
        track.appendChild(g);
      });
    }

    row.appendChild(track);
    row.addEventListener('dragover', onDragOver);
    row.addEventListener('dragleave', () => row.classList.remove('drop', 'nodrop'));
    row.addEventListener('drop', onDrop);
    wrap.appendChild(row);
  });
}

function renderUnassigned(proj, vbad) {
  const n = $('#unrow');
  const list = proj.unassigned.concat(proj.affiliate);
  n.innerHTML = '';
  const lbl = el('div', 'vlabel', '<span class="vmeta"><b>UNASSIGNED</b><small>' +
    proj.unassigned.length + ' open · ' + proj.affiliate.length + ' affiliate</small></span>');
  n.appendChild(lbl);
  const track = el('div', 'track');
  if (!list.length) track.appendChild(el('div', '',
    '<span style="font:500 10.5px/28px var(--mono);color:var(--ink3);padding-left:8px">Every reservation has a car.</span>'));
  list.forEach(function (id) {
    const t = S.tById[id];
    const aff = S.plan.assign[id] === 'AFFILIATE';
    const missed = !aff && S.clock > t.pickup;
    const b = el('div', 'trip flat ' + (aff ? 'st-affiliate' : missed ? 'st-missed' : 'st-unassigned') +
      (t.vip ? ' vip' : '') + (aff ? '' : ' broken') + (t.injected ? ' injected' : ''),
      '<div class="prism"><div class="face" style="--i:0">' +
      '<span class="ref">' + t.ref + '</span><span class="nm">' + t.paxName + ' · ' +

      '</span></div></div>');

    b.addEventListener('dragstart', onDragStart);
    b.addEventListener('click', e => { e.stopPropagation(); openTrip(t.id); });
