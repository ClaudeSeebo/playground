<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCT</title>
<style>
  :root{
    --ink:#1a1a1a; --muted:#6a6a6a; --line:#e4e4e0; --paper:#f6f6f4; --panel:#fbfbfa;
    --accent:#2f4fb0; --accent-soft:#eaeef9; --ok:#1b7f4b; --okbg:#e7f4ec;
    --bad:#b3261e; --badbg:#fbeae9; --none:#c9c9c4;
    --leaf:#33689a; --optional:#9a7133;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); display:flex; flex-direction:column; height:100vh; }

  header{ display:flex; align-items:center; gap:18px; padding:10px 18px; border-bottom:1px solid var(--line); background:#fff; flex:none; }
  .brand{ font-weight:800; letter-spacing:.02em; font-size:16px; }
  .modes{ display:flex; gap:4px; }
  .mode{ font:inherit; font-size:13px; font-weight:600; border:0; background:transparent; color:var(--muted);
    padding:7px 14px; border-radius:8px; cursor:pointer; }
  .mode:hover{ background:var(--paper); }
  .mode.active{ background:var(--accent-soft); color:var(--accent); }
  /* header status cluster: connection · save · counts */
  .pills{ display:flex; align-items:center; gap:8px; margin-left:20px; }
  .pills .counts{ font-size:12px; color:var(--muted); margin-left:6px; white-space:nowrap; }
  .pill{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:20px; }
  .pill .pdot{ width:8px; height:8px; border-radius:50%; background:var(--muted); }
  /* connection reads as quiet context, so green means "just saved" on one pill only */
  .pill.conn{ background:var(--paper); color:var(--muted); border:1px solid var(--line); }
  .pill.conn.ok .pdot{ background:var(--ok); }
  .pill.conn.wait .pdot{ background:var(--accent); animation:pulse 1s infinite; }
  .pill.conn.bad{ background:var(--badbg); color:var(--bad); border-color:transparent; }
  .pill.conn.bad .pdot{ background:var(--bad); }

  /* truthful save-status: green=saved, blue=saving, red=failed */
  .savestate{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600;
    padding:5px 11px; border-radius:20px; }
  .savestate .sdot{ width:8px; height:8px; border-radius:50%; }
  .savestate.saved{ background:var(--okbg); color:var(--ok); } .savestate.saved .sdot{ background:var(--ok); }
  .savestate.saving{ background:#e8eef9; color:var(--accent); } .savestate.saving .sdot{ background:var(--accent); animation:pulse 1s infinite; }
  .savestate.failed{ background:var(--badbg); color:var(--bad); } .savestate.failed .sdot{ background:var(--bad); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  /* brief confirmation glow after a save lands */
  .savestate.justsaved{ animation:savedpulse 1.5s ease-out; }
  @keyframes savedpulse{
    0%{ box-shadow:0 0 0 0 rgba(27,127,75,.45); transform:scale(1.05); }
    35%{ transform:scale(1); }
    100%{ box-shadow:0 0 0 12px rgba(27,127,75,0); transform:scale(1); }
  }
  .savestate .retry{ margin-left:6px; font:inherit; font-size:11px; font-weight:700; border:0; background:var(--bad); color:#fff; border-radius:5px; padding:2px 7px; cursor:pointer; display:none; }
  .savestate.failed .retry{ display:inline-block; }

  /* project zone: visually separated on the right, its own labeled group */
  .projzone{ margin-left:auto; display:flex; align-items:center; gap:8px;
    padding:5px 12px 5px 16px; border-left:2px solid var(--line); }
  .projzone .pzlabel{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .projzone select{ font-size:13px; font-weight:600; max-width:200px; }

  main{ display:flex; flex:1; min-height:0; }
  .left{ width:340px; flex:none; border-right:1px solid var(--line); background:var(--panel); overflow:auto; padding:10px; }
  .right{ flex:1; overflow:auto; padding:22px 26px; }

  .lefthead{ display:flex; align-items:center; gap:8px; margin:4px 6px 10px; }
  .lefthead .ttl{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .lefthead .sys{ margin-left:auto; }
  select,input,textarea{ font:inherit; font-size:14px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); }
  select.sys{ font-size:12px; padding:4px 6px; }

  ul.tree, ul.tree ul{ list-style:none; margin:0; padding:0; }
  ul.tree ul{ margin-left:14px; border-left:1px solid var(--line); padding-left:10px; }
  .tn{ display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:7px; cursor:pointer; margin:1px 0; }
  .tn:hover{ background:var(--paper); }
  .tn.sel{ background:var(--accent-soft); outline:1px solid var(--accent); }
  .tw{ width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.12); flex:none; }
  .tn .nm{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---- alias mode (3b) ----
     A node shows the selected system's own word for it. The point is to read
     the tree in a vendor's vocabulary during a session with that vendor, so
     the highlight marks WHICH names were substituted — without it you cannot
     tell a translated name from an untranslated one, and you would quote a
     term the vendor has never used. */
  .aliasbtn{ font:inherit; font-size:11.5px; font-weight:700; margin-left:auto;
    border:1px solid var(--line); background:#fff; color:var(--muted);
    border-radius:20px; padding:3px 10px; cursor:pointer; white-space:nowrap; }
  .aliasbtn:hover{ border-color:var(--accent); color:var(--accent); }
  .aliasbtn.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .lefthead .aliasbtn + .sys{ margin-left:6px; }
  .tn .nm.aliased{ background:#cfe6c6; box-shadow:0 0 0 3px #cfe6c6; border-radius:4px; }
  .tn.sel .nm.aliased{ background:#bcdcb0; box-shadow:0 0 0 3px #bcdcb0; }
  .aliasnone{ font-size:11px; color:var(--muted); font-style:italic; margin-left:6px; }
  .tn .mini{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:0 4px; border-radius:10px; flex:none;
    background:var(--accent-soft); color:var(--accent); }
  .mini.leaf{ background:#e7eff7; color:var(--leaf);}
  /* .mini.opt removed 2026-08-30 with the Essential checkbox — nothing renders it. */
  /* Data elements read as a CREAM FIELD rather than a badge: the whole row is
     tinted, borderless, so a block of them is one visual group instead of a
     column of repeated labels. Cream is chosen because no rating palette in any
     project uses it — the swatch still owns saturated colour, which is the
     signal a room actually reads. Replaced a violet pill plus a left bracket,
     which said the same thing twice and competed with the swatch. */
  .tn.datarow{ background:#fbf3e2; border-radius:6px; }
  .tn.datarow.sel{ background:#f6e8c8; }
  .npill.kid.datakid{ background:#fbf3e2; color:#7a5c12; border:1px solid #f2e4c4; }
  .npill.kid.datakid:hover{ background:#f6e8c8; border-color:#e0cb96; }
  .datatag{ display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase;
            letter-spacing:.04em; padding:2px 8px; border-radius:10px;
            background:#fbf3e2; color:#7a5c12; margin-bottom:8px; }
  .addbtn.dataadd{ color:#7a5c12; border-color:#f2e4c4; }
  .addbtn.dataadd:hover:not(:disabled){ background:#fbf3e2; }
  .addbtn.addoff{ opacity:.35; cursor:not-allowed; }
  .addbtn.addoff:hover{ background:transparent; }
  .ordctl{ display:flex; gap:2px; margin-left:6px; }
  .ordbtn{ font:inherit; font-size:10px; line-height:1; padding:3px 5px; cursor:pointer;
           border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:4px; }
  .ordbtn:hover:not(:disabled){ background:var(--paper); color:var(--ink); }
  .ordbtn:disabled{ opacity:.3; cursor:default; }
  .mini.rdy{ background:var(--okbg); color:var(--ok); }
  .mini.hold{ background:#fff0e0; color:#8a5a00; }
  table.matrix td.heldcell{ background:#fafafa; }
  table.matrix td.mname.heldname .mnm{ color:var(--muted); }
  .heldtag{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    background:#fff0e0; color:#8a5a00; padding:0 5px; border-radius:10px; margin-left:6px; }
  .caret{ width:12px; text-align:center; color:var(--muted); flex:none; cursor:pointer; font-size:11px; user-select:none; }

  .addbar{ display:flex; gap:6px; margin:6px; padding-top:8px; border-top:1px dashed var(--line); }
  .addbar input{ flex:1; font-size:13px; }
  .addbar button, .btn{ font:inherit; font-size:13px; font-weight:600; background:var(--accent); color:#fff; border:0; border-radius:7px; padding:7px 12px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .btn.sm{ padding:5px 9px; font-size:12px; }
  .btn:disabled{ opacity:.5; cursor:default; }

  h2{ font-size:17px; margin:0 0 2px; } .crumb{ font-size:12px; color:var(--muted); margin-bottom:16px; }
  .field{ margin-bottom:14px; max-width:520px; } .field label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px; }
  .field input, .field textarea, .field select{ width:100%; } textarea{ min-height:60px; resize:vertical; }
  .checks{ display:flex; gap:18px; margin:10px 0; } .checks label{ display:flex; gap:7px; align-items:center; font-size:14px; }
  .msg{ margin:12px 0; padding:10px 12px; border-radius:8px; font-size:13px; display:none; max-width:520px; }
  .msg.ok{ background:var(--okbg); color:var(--ok); display:block; } .msg.bad{ background:var(--badbg); color:var(--bad); display:block; white-space:pre-wrap; }
  .empty{ color:var(--muted); font-style:italic; margin-top:30px; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:2px 0 18px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; } .chip{ width:12px;height:12px;border-radius:3px; }
  .rate-row{ display:flex; align-items:center; gap:10px; margin:10px 0; } .rate-row .sw{ width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.15);}
  .saved{ font-size:12px; color:var(--ok); opacity:0; transition:opacity .2s; } .saved.show{ opacity:1; }
  .kv{ font-size:13px; color:var(--muted); margin:6px 0; } .kv b{ color:var(--ink); font-weight:600; }
  .rollbig{ display:inline-flex; align-items:center; gap:9px; font-size:15px; font-weight:700; margin:6px 0 14px; }
  .rollbig .sw{ width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.15); }

  /* node search (type-ahead) */
  .searchwrap{ position:relative; margin:0 6px 8px; }
  .searchwrap input{ width:100%; font-size:13px; padding:6px 9px; }
  .sresults{ display:none; position:absolute; left:0; right:0; top:100%; z-index:20; margin-top:3px;
    background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.10);
    max-height:300px; overflow:auto; }
  .sresults.open{ display:block; }
  .sres{ padding:6px 9px; cursor:pointer; border-bottom:1px solid var(--paper); }
  .sres:last-child{ border-bottom:0; }
  .sres.active, .sres:hover{ background:var(--accent-soft); }
  .sres .sname{ font-size:13px; font-weight:600; display:block; }
  .sres .sname mark{ background:#fdf0c2; color:inherit; padding:0 1px; border-radius:2px; }
  .sres .spath{ font-size:11px; color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .snone{ padding:8px 9px; font-size:12px; color:var(--muted); font-style:italic; }

  /* position navigator: ancestors ▸ current (+ sibling, + child), children beneath */
  .navstrip{ display:flex; align-items:flex-start; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .npill{ font:inherit; font-size:13px; font-weight:600; border-radius:20px; padding:6px 14px;
    max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .npill.anc{ border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .npill.anc:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .npill.cur{ background:var(--accent); color:#fff; border:1px solid var(--accent); cursor:default; }
  .npill.kid{ background:#dbe4f8; color:var(--accent); border:1px solid #c6d3f0; cursor:pointer; font-size:12.5px; padding:5px 12px; }
  .npill.kid:hover{ background:#cbd8f4; border-color:var(--accent); }
  .nsep{ color:var(--none); font-size:15px; line-height:32px; }
  .curcol{ display:flex; flex-direction:column; align-items:flex-start; gap:7px; }
  .currow{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .kidsrow{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; max-width:640px; }
  .addslot{ display:flex; align-items:center; min-height:32px; }
  .addbtn{ font:inherit; font-size:12px; font-weight:600; color:var(--muted); background:transparent;
    border:1px dashed var(--line); border-radius:20px; padding:5px 12px; cursor:pointer; }
  .addbtn:hover{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .addinp{ font-size:13px; padding:5px 10px; border-radius:20px; min-width:190px; }
  .navnote{ font-size:12px; color:var(--ok); min-height:18px; margin-bottom:10px; opacity:0; transition:opacity .2s; }
  .navnote.show{ opacity:1; }

  /* multi-line paste preview (S14) */
  .pv-list{ display:flex; flex-wrap:wrap; gap:6px; max-height:240px; overflow:auto;
    padding:10px; border:1px solid var(--line); border-radius:8px; background:#fafbfd; margin-bottom:12px; }
  .pv-item{ font-size:13px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:4px 11px; }
  .pv-more{ font-size:12.5px; color:var(--muted); align-self:center; padding:4px 6px; font-style:italic; }
  .pv-note{ font-size:12.5px; line-height:1.5; margin-bottom:7px; }
  .pv-note.warn{ color:#8a5a00; } .pv-note.info{ color:var(--muted); }
  .pv-big{ font-size:13px; font-weight:700; color:var(--bad); margin-bottom:10px; }
  .pv-bar{ display:flex; gap:8px; margin-top:16px; }

  /* notes to administrator (B14) */
  .notebtn{ font:inherit; font-size:12px; line-height:1; border:1px solid var(--line); background:#fff;
    color:var(--muted); border-radius:6px; padding:2px 6px; cursor:pointer; margin-left:6px; }
  .notebtn:hover{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .notedot{ color:#c77700; font-size:10px; margin-left:5px; vertical-align:middle; }
  #notesbtn.hasnotes{ background:#fff5e6; border-color:#c77700; color:#8a5a00; }
  .notearea{ width:100%; font:inherit; font-size:13.5px; padding:9px 11px; border:1px solid var(--line);
    border-radius:8px; resize:vertical; margin:10px 0 8px; }
  .notecard{ border:1px solid var(--line); border-left:3px solid #c77700; border-radius:8px;
    padding:10px 12px; margin-bottom:10px; background:#fff; }
  .notecard.done{ border-left-color:var(--line); opacity:.62; }
  .notehead{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .notelink{ font:inherit; font-size:12.5px; font-weight:700; color:var(--accent); background:transparent;
    border:0; padding:0; cursor:pointer; text-align:left; }
  .notelink:disabled{ color:var(--muted); cursor:default; }
  .notemeta{ font-size:11.5px; color:var(--muted); margin-left:auto; }
  .notebody{ font-size:13.5px; line-height:1.5; white-space:pre-wrap; margin-bottom:8px; }

  /* screenshots / evidence (S5) */
  .matrix .cell{ position:relative; }
  .shotfold{ position:absolute; top:2px; right:3px; width:0; height:0;
    border-top:9px solid var(--accent); border-left:9px solid transparent; cursor:pointer; }
  .shotfold:hover{ border-top-color:#0b3ea8; }
  .shotmark{ color:var(--accent); font-size:10px; margin-left:5px; vertical-align:middle; }
  .shotbtn{ font:inherit; font-size:12px; line-height:1; border:1px solid var(--line); background:#fff;
    color:var(--muted); border-radius:6px; padding:2px 6px; cursor:pointer; margin-left:5px; }
  .shotbtn:hover{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .shotgrid{ display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 12px; }
  .shotcard{ width:150px; border:1px solid var(--line); border-radius:8px; padding:7px; background:#fff; }
  .shotcard img{ width:100%; height:86px; object-fit:cover; border-radius:5px; cursor:zoom-in; display:block; }
  .shotmeta{ font-size:11.5px; color:var(--muted); margin:5px 0 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .shotadd{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; max-width:660px; }
  .shotadd select{ max-width:250px; }
  .shotadd input:not([type=file]){ flex:1; min-width:150px; }
  .shotadd input[type=file]{ display:none; }
  .shotzone{ max-width:660px; }
  .shotzone{ border:1px dashed var(--line); border-radius:8px; padding:11px; text-align:center;
    font-size:12.5px; color:var(--muted); cursor:text; outline:none; }
  .shotzone:focus{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .shotmodal{ width:680px; }
  .shotfull{ width:100%; border-radius:8px; display:block; }
  .shotcap{ font-size:13.5px; margin-top:10px; }
  .shotmeta2{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .backchip{ font:inherit; font-size:12px; font-weight:600; border:1px solid var(--accent); background:var(--accent-soft);
    color:var(--accent); border-radius:20px; padding:4px 11px; cursor:pointer; margin-bottom:10px; }
  .noteres{ font-size:12.5px; color:var(--ok); border-top:1px dashed var(--line); padding-top:7px; white-space:pre-wrap; }
  .noteres.bare{ color:var(--muted); font-style:italic; }
  .resolvearea{ margin:2px 0 8px; }
  .resolveslot .pv-bar{ margin-top:0; }

  /* aliases */
  .aliaslist{ display:flex; flex-direction:column; gap:6px; }
  .aliasrow{ display:flex; align-items:center; gap:10px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .acode{ font-family:ui-monospace,Menlo,monospace; font-size:11px; font-weight:700; letter-spacing:.04em;
    background:var(--paper); border:1px solid var(--line); border-radius:5px; padding:2px 7px; flex:none; cursor:help; }
  .amid{ flex:1; min-width:0; }
  .aterm{ font-size:13.5px; font-weight:600; }
  .anote{ font-size:11.5px; color:var(--muted); }
  .aliasform{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .aliasform input{ font-size:13px; }

  /* stale ratings */
  .cell.stalecell{ position:relative; }
  .staleflag{ position:absolute; top:1px; right:2px; font-size:10px; font-weight:800; line-height:1;
    color:#fff; background:var(--optional); border-radius:50%; width:13px; height:13px;
    display:flex; align-items:center; justify-content:center; cursor:help; z-index:1; }

  /* ===================================================================
     B18 — THE LETTER-BOX GRID (migration 22)
     Ported from mockup-apptypes.html, which Seebo approved in principle
     2026-08-22. A cell is now node × system × CHANNEL, and holds one small
     box per scale value: F P W N. Click to set, click again to clear.
     =================================================================== */
  .box{ display:inline-flex; align-items:center; justify-content:center;
        width:20px; height:20px; border-radius:5px; border:1px solid #cfd3dc;
        font-size:11px; font-weight:800; background:#fff; color:#98a0ad;
        cursor:pointer; user-select:none; }
  .box + .box{ margin-left:3px; }
  .box:hover{ border-color:var(--accent); color:var(--accent); }
  .box.on{ border-color:rgba(0,0,0,.28); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .box.off{ cursor:not-allowed; opacity:.4; }
  .box.off:hover{ border-color:#cfd3dc; color:#98a0ad; }
  .boxgrp{ display:inline-flex; align-items:center; white-space:nowrap; }

  /* two-row header: system, then its channels beneath */
  th.sysname{ text-align:center; font-size:12.5px; font-weight:700;
              padding:6px 10px; border-left:2px solid var(--line); white-space:nowrap; }
  th.sysname .scode{ font-family:ui-monospace,Menlo,monospace; font-size:10.5px;
                     font-weight:600; color:var(--muted); margin-left:6px; }
  th.chan{ text-align:center; font-size:10.5px; font-weight:800; text-transform:uppercase;
           letter-spacing:.05em; color:var(--muted); padding:5px 8px; white-space:nowrap; }
  th.chan.first, td.cell.first{ border-left:2px solid var(--line); }
  th.chan .csurf{ display:block; font-weight:600; text-transform:none; letter-spacing:0;
                  font-size:9.5px; opacity:.75; }

  /* ⚠ 3a — AUTHORSHIP LIVES IN THE CELL BACKGROUND, THE SUPPORT LEVEL LIVES
     IN THE BOX. Seebo's design, and it is what made this possible: before
     the letter-boxes the cell background WAS the rating colour, so there was
     nowhere to put "whose is this" except a fiddly corner mark. Now the two
     never compete.
        blue  = yours       cream = somebody else's      white = unrated  */
  td.cell{ padding:3px 6px; text-align:center; white-space:nowrap; background:#fff; }
  td.cell.minecell { background:#eaf3fb; }

<script>
const SUPABASE_URL="https://szvlvfgslymhlgdsjzyd.supabase.co";
const SUPABASE_KEY="sb_publishable_oEhQnbZ6uyM3Mr1mWp7Z1Q_exCnRIfm";
// H is deliberately a MUTABLE object, not a frozen literal. Roughly twenty call
// sites already spread it as {...H, "Prefer": ...}; because the spread happens
// at call time, rewriting H.Authorization in one place (applyAuthHeader, below)
// puts the signed-in user's token on every request without touching any of
// them. Signed out, it falls back to the publishable key — which is what keeps
// the app working while RLS is still off.
const H={ "apikey":SUPABASE_KEY, "Authorization":"Bearer "+SUPABASE_KEY, "Content-Type":"application/json" };
const $=id=>document.getElementById(id);
function el(t,c,x){ const n=document.createElement(t); if(c)n.className=c; if(x!==undefined)n.textContent=x; return n; }
// Every request reports on the connection: reaching the server (even with a
// 4xx) proves we're connected; only a network-level throw means we're not.
async function api(p,o){
  try{ const r=await fetch(SUPABASE_URL+"/rest/v1/"+p,{headers:H,...o}); setConn("ok"); return r; }
  catch(err){ setConn("bad"); throw err; }
}

/* =========================================================================
   AUTH  (S18 step 2a)

   Hand-rolled against Supabase's auth REST endpoints rather than pulling in
   supabase-js. The password grant is one POST and a token refresh; the library
   would be a dependency in a file that is deliberately self-contained and
   opened straight off disk.

   ⚠ RLS IS STILL OFF. This is UX, not enforcement — the publishable key still
   reads and writes without a token. Enforcement arrives with
   12_rls_policies.sql, once signing in is proven to work. Nothing here can
   lock anyone out yet, and that is on purpose.
   ========================================================================= */

const AUTH_URL   = SUPABASE_URL + "/auth/v1";
const SESSION_KEY = "cct.session";

let SESSION = null;          // { access_token, refresh_token, expires_at, user }

function applyAuthHeader(){
  H.Authorization = "Bearer " + ((SESSION && SESSION.access_token) || SUPABASE_KEY);
}
function loadSession(){
  try{ SESSION = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }
  catch(e){ SESSION = null; }
  applyAuthHeader();
  return SESSION;
}
function saveSession(s){
  SESSION = s;
  if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
  else  localStorage.removeItem(SESSION_KEY);
  applyAuthHeader();
}

async function signIn(email, password){
  const r = await fetch(AUTH_URL + "/token?grant_type=password", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });
  const body = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(body.error_description || body.msg || body.message || ("Sign-in failed (" + r.status + ")"));
  saveSession({
    access_token: body.access_token,
    refresh_token: body.refresh_token,
    expires_at: Date.now() + (body.expires_in || 3600) * 1000,
    user: body.user
  });
  return SESSION;
}

async function refreshSession(){
  if(!SESSION || !SESSION.refresh_token) return null;
  let r;
  try{
    r = await fetch(AUTH_URL + "/token?grant_type=refresh_token", {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: SESSION.refresh_token })
    });
  }catch(e){ return SESSION; }          // offline: keep what we have, don't sign out
  if(!r.ok){ saveSession(null); return null; }
  const body = await r.json();
  saveSession({
    access_token: body.access_token,
    refresh_token: body.refresh_token,
    expires_at: Date.now() + (body.expires_in || 3600) * 1000,
    user: body.user || SESSION.user
  });
  return SESSION;
}

// Refresh a minute early rather than discovering expiry mid-save.
async function ensureFreshSession(){
  if(!SESSION) return null;
  if(Date.now() > (SESSION.expires_at - 60000)) return await refreshSession();
  return SESSION;
}

async function signOut(){
  if(SESSION && SESSION.access_token){
    try{ await fetch(AUTH_URL + "/logout", { method:"POST",
      headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer "+SESSION.access_token } }); }
    catch(e){ /* the local sign-out is the part that matters */ }
  }
  saveSession(null);
  location.reload();
}

/* ---------- who am I ---------- */

// Global role from user_profiles. Null means no profile row, which will mean no
// access at all once RLS is on — deliberately fails closed.
async function loadRole(){
  S.role = null; S.fullName = null;
  if(!SESSION || !SESSION.user) return null;
  try{
    const r = await api("user_profiles?select=role,full_name&user_id=eq." + SESSION.user.id);
    if(!r.ok) return null;
    const rows = await r.json();
    if(rows.length){ S.role = rows[0].role; S.fullName = rows[0].full_name || null; }
  }catch(e){ /* offline — renderWhoAmI will show "no role" */ }
  return S.role;
}

// The caller's membership row for the current project. This is what replaces
// the "Evaluating as" picker: you are who you signed in as.
function myEvaluatorFor(){
  if(!SESSION || !SESSION.user) return null;
  return S.evaluators.find(e => e.user_id === SESSION.user.id) || null;
}

// Called before any write that needs attribution.
//
// Role is global; MEMBERSHIP is per-project. An admin or superadmin administers
// the whole install, so they can legitimately land in a project nobody has
// added them to — rather than dead-end them, we create the membership row the
// first time they actually need one. Below admin, no membership row means not
// a member of this project, and that is an answer, not an accident.
async function ensureMyEvaluator(){
  const mine = myEvaluatorFor();
  if(mine) return mine;
  if(!atLeast("admin")) return null;
  const name = S.fullName || ((SESSION.user||{}).email || "").split("@")[0];
  const res = await saveOp(() => api("evaluators", {
    method:"POST", headers:{ ...H, "Prefer":"return=representation" },
    body: JSON.stringify({ project_id:S.projectId, name, user_id:SESSION.user.id })
  }));
  if(!res) return null;
  const row = (await res.json())[0];
  S.myEvaluatorId = row.id;      // ratingIsMine() shades by this, so it must be set here too
  S.evaluators.push(row);
  S.evaluator = row.name;
  return row;
}

// Who the app writes as. Derived from the session — never picked from a list.
function setIdentityFromSession(){
  const mine = myEvaluatorFor();
  S.evaluator = mine ? mine.name
              : (S.fullName || ((SESSION && SESSION.user && SESSION.user.email) || "").split("@")[0] || "unattributed");
  S.myEvaluatorId = mine ? mine.id : null;
}

// THE ONE PLACE that decides "is this rating mine". Four call sites used to
// each carry their own copy of the rule, and all four compared the evaluator
// NAME TEXT. That is the defect that split one human into "Chip" and "Seebo",
// hid 29 ratings, and then produced contradictory duplicate rows once the two
// names were merged. See D9 and migration 15.
//
// evaluator_id is a foreign key to evaluators.id. The name column stays on the
// row as a readable snapshot of who rated it at the time, and is never matched
// on again.
//
// Fails CLOSED. If S.myEvaluatorId is null — you are signed in but not on this
// project's evaluator list — this returns nothing rather than matching every
// orphaned row whose evaluator_id is also null. An unrated cell is the honest
// answer there; silently adopting a deleted person's ratings is not.
/* ⚠ RENAMED FROM myRating() AND IT NO LONGER LOOKS AT WHO RATED IT.

   ONE RATING PER NODE × SYSTEM, SHARED BY THE WHOLE PROJECT — Seebo's
   decision 2026-09-01, enforced in the database by migration `21`
   (UNIQUE (node_id, system_id), and any member may update any row).

   The old version filtered on `evaluator_id === S.myEvaluatorId`. It loaded
   every rating in the project and then discarded everyone else's, so two
   people rating the same taxonomy could not see each other's work at all —
   each believed the other's nodes were unrated. Found by signing in as
   `[address removed]` for the first time.

   That filter was deliberate once: S25 (2026-08-17) split roll-up per
   evaluator so one person's None could not colour another person's view.
   The per-evaluator LOOKUP came along with it and outlived the reason.

   ⚠ THE NAME WAS THE TRAP. `myRating` kept reading as "the rating" at every
   call site while meaning "the rating I personally left". Renamed so the
   next reader cannot make that mistake. */
/* ⚠ A RATING IS NOW node × system × CHANNEL (B18, migration 22).
   channelId is REQUIRED. It is not defaulted and not optional: `Reschedule
   × Livery Coach × Office·Desktop` and `× Customer·Web` are different
   judgments about different things, and a lookup that quietly ignored the
   channel would merge them — the same class of mistake as the per-evaluator
   filter this function was rescued from a day earlier. */
function ratingFor(nodeId, systemId, channelId){
  if(!channelId) return null;
  return S.evals.find(e => e.node_id === nodeId
                        && e.system_id === systemId
                        && e.channel_id === channelId) || null;
}

// Channels a system actually offers, in display order. A system with none
// cannot be rated — migration 22 seeds one per system so that cannot happen
// by accident, but a channel deleted in Settings can bring it back.
function channelsFor(systemId){
  return S.channels.filter(c => c.system_id === systemId)
                   .sort((a,b) => (a.sort_order||0)-(b.sort_order||0)
                                  || (a.short_name||"").localeCompare(b.short_name||""));
}
function channelById(id){ return S.channels.find(c => c.id === id) || null; }
function channelLabel(c){ return c ? (c.audience + " · " + c.surface) : "—"; }

// Readable ink for a filled box. Ported from the mockup: a dark scale colour
// like #000040 needs white text or the code vanishes.
function ink(hex){
  const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||"");
  if(!m) return "#1a1a1a";
  const [r,g,b]=[1,2,3].map(i=>parseInt(m[i],16));
  return (r*299 + g*587 + b*114)/1000 > 140 ? "#1a1a1a" : "#ffffff";
}

// Whose judgment is on screen. For SHADING ONLY — never for deciding whether
// a rating exists, which is the mistake this whole change is undoing.
function ratingIsMine(ex){
  return !!(ex && S.myEvaluatorId && ex.evaluator_id === S.myEvaluatorId);
}

// The display name of whoever set it, for the tooltip on someone else's rating.
function raterName(ex){
  if(!ex) return null;
  const e = S.evaluators.find(x => x.id === ex.evaluator_id);
  return (e && e.name) || ex.evaluator || "someone else";

// --- connection pill: driven by real traffic, never by a guess ---
// Green means a request genuinely succeeded recently. A network-level failure
// (or the browser reporting itself offline) turns it red; an HTTP error does
// NOT — that's the database answering, so the connection is fine.
function setConn(state,label){
  const p=$("connpill");
  p.className="pill conn "+state;
  $("conntext").textContent = label || (state==="ok"?"Connected" : state==="bad"?"Offline" : "Connecting…");
}
function isNetworkError(err){ return err instanceof TypeError || !navigator.onLine; }
async function pingDb(){
  setConn("wait");
  try{ const r=await api("projects?select=id&limit=1"); setConn(r.ok?"ok":"bad", r.ok?null:"DB error"); }
  catch{ setConn("bad"); }
}
window.addEventListener("offline",()=>setConn("bad"));
window.addEventListener("online",pingDb);

// --- truthful save status: every write goes through saveOp() ---
// Writes usually land in <200ms, so blue would flicker past unseen. We hold
// "Saving…" for a minimum beat, then pulse the green pill so a save is always
// perceptible. Failures are never delayed — bad news shows immediately.
const SAVE_MIN_MS=500, SAVE_PULSE_MS=1500;
let lastFailedOp=null, saveSeq=0, pulseTimer=null;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function setSave(state){
  const box=$("savestate"), txt=$("savetext");
  box.className="savestate "+state;
  txt.textContent = state==="saving"?"Saving…" : state==="failed"?"Not saved" : "Saved";
}
function pulseSaved(){
  const box=$("savestate");
  clearTimeout(pulseTimer); box.classList.remove("justsaved");
  void box.offsetWidth;                       // restart the animation
  box.classList.add("justsaved");
  pulseTimer=setTimeout(()=>box.classList.remove("justsaved"), SAVE_PULSE_MS);
}
let lastSaveError=null;

/* =========================================================================
   ⚠ A WRITE REFUSED BY ROW-LEVEL SECURITY IS NOT AN HTTP ERROR.

   PostgREST answers a refused UPDATE or DELETE with **200 and an EMPTY ARRAY**:
   zero rows matched the policy. At the HTTP layer that is indistinguishable
   from "I did exactly what you asked" — so `res.ok` is true, the pill goes
   green, and the write never happened.

   That is the defect opened in Session 8 and it is silent at BOTH ends: the
   evaluator sees "Saved", the administrator later sees missing data, and
   nothing anywhere connects the two. Worse for a rating — `Object.assign(ex,
   undefined)` is a no-op that does not throw, so the old value stays on screen
   looking correct until a reload wipes it.

   The tell is already on the wire. Every write that sends
   `Prefer: return=representation` gets its row back, so an empty array means
   refused. This is the ONE place that has to look, instead of ~20 call sites
   each having to remember.

   ⚠ SCOPE, deliberately narrow. Only a JSON array of length 0 counts. A 204,
   an empty body, or any non-array payload is left alone — a DELETE sent without
   `Prefer` legitimately returns no content, and treating that as a refusal
   would break every delete in the app.

   ⚠ res.clone() is REQUIRED. Callers read the body themselves after saveOp
   returns; consuming the original here would break every one of them.
   ========================================================================= */
const REFUSED_MSG =
  "The database refused this write (row-level security). NOTHING WAS SAVED — "+
  "reload the page before trusting what is on screen.";

async function assertNotRefused(res){
  if(!res || typeof res.clone !== "function") return;   // not a Response
  if(res.status===204 || res.status===205) return;      // no content, by design
  let body;
  try{ body = await res.clone().json(); }
  catch(_){ return; }                                   // not JSON → nothing to judge
  if(Array.isArray(body) && body.length===0) throw new Error(REFUSED_MSG);
}

async function saveOp(fn){
  const seq=++saveSeq, t0=Date.now();
  clearTimeout(pulseTimer); $("savestate").classList.remove("justsaved");
  setSave("saving");
  try{
    const res=await fn();
    if(res && res.ok===false){ throw new Error("HTTP "+res.status+" "+(await res.text())); }
    await assertNotRefused(res);        // 200 + [] is a refusal, not a success
    const left=SAVE_MIN_MS-(Date.now()-t0); if(left>0) await wait(left);
    if(seq===saveSeq){ setSave("saved"); pulseSaved(); }   // a later save owns the pill
    setConn("ok");
    lastFailedOp=null;
    return res;
  }catch(err){
    if(seq===saveSeq) setSave("failed");
    if(isNetworkError(err)) setConn("bad");
    lastFailedOp=fn;
    lastSaveError=String(err && err.message || err);   // so callers can show the REAL reason
    console.error("save failed:",err);
    return null;
  }
}

const S={ mode:"build", nodes:[], systems:[], scaleValues:[], evals:[], projects:[], evaluators:[], aliases:[], notes:[], shots:[], cameFrom:null,
  projectId:null, currentId:null, currentSystem:null, evaluator:"Seebo", coEvaluator:null, collapsed:new Set(),
  evalDomain:"all", chartMulti:false, meaningChanges:{},
  channels:[], currentChannel:null,       // B18 — a rating is node x system x CHANNEL
  aliasMode:false,                        // 3b — show the selected system's own words in the tree
  role:null, fullName:null,              // set by loadRole(); null = no access once RLS is on
  myEvaluatorId:null };                  // set by setIdentityFromSession(); used for SHADING only, never for lookup

function svById(id){ return S.scaleValues.find(v=>v.id===id); }
function svByLabel(l){ return S.scaleValues.find(v=>v.label===l); }
// Siblings are ordered MANUALLY (migration 18), with name as the tie-break.
// Alphabetical was actively wrong for a sequence — Create, Find, Modify, Set
// Status reads as Communications, Create, Find, Modify, Set Status — and is
// worse again for the data nodes of migration 19, where "name, address, phone"
// is meaningful and "address, name, phone" is noise.
// The name tie-break matters: two rows sharing a number must not flap between
// page loads. That is the unordered-.find() defect of migration 15, remembered.
// Defensive on name: it is NOT NULL in the database, so a nameless row cannot
// come from the server — but one bad object here would throw inside Array.sort
// and take the WHOLE tree render down. This app has already had a silent
// tree-wide failure once (D9); a two-character guard is cheaper than the hunt.
function bySibling(a,b){ return (a.sort_order||0)-(b.sort_order||0) || (a.name||"").localeCompare(b.name||""); }
function childrenOf(id){ return S.nodes.filter(n=>n.parent_id===id).sort(bySibling); }
function roots(){ return S.nodes.filter(n=>!n.parent_id || !S.nodes.some(p=>p.id===n.parent_id)).sort(bySibling); }
const KIND_CAP = "capability", KIND_DATA = "data";
function isData(n){ return n && n.kind === KIND_DATA; }
// The kind a new child of `parent` MUST be, or null if the group is empty and
// the caller may choose. Mirrors the nodes_kind_guard trigger in migration 19;
// the trigger is the authority, this only avoids offering an invalid option.
function forcedChildKind(parentId){
  const kids = parentId ? childrenOf(parentId) : roots();
  return kids.length ? (kids[0].kind || KIND_CAP) : null;
}
// New nodes land at the end of their sibling group, never at the top.
function siblingsOf(parentId){ return parentId ? childrenOf(parentId) : roots(); }
function nextSortOrder(parentId){
  const sibs=siblingsOf(parentId);
  return sibs.length ? Math.max(...sibs.map(x=>x.sort_order||0))+1 : 1;
}
// ⚠ CURRENTLY UNUSED. Its only caller was the grp/leaf pill, dropped 2026-08-30.
// Kept because the collapse-data-by-default work wants exactly this, and it is
// one correct line. Delete it if that work does not happen.
function isLeaf(n){ return !S.nodes.some(c=>c.parent_id===n.id); }
function nodeById(id){ return S.nodes.find(n=>n.id===id); }
// --- move / re-parent helpers ---
function descendantIds(id){            // self + everything under it (cycle guard)
  const out=new Set([id]); const stack=[id];
  while(stack.length){ const cur=stack.pop();
    S.nodes.filter(n=>n.parent_id===cur).forEach(c=>{ if(!out.has(c.id)){ out.add(c.id); stack.push(c.id); } }); }
  return out;
}
function ancestorsOf(id){ const out=[]; let c=nodeById(id); while(c && c.parent_id){ c=nodeById(c.parent_id); if(c) out.push(c); } return out; }
function pathOf(n){ const p=[]; let c=n; while(c){ p.unshift(c.name); c=nodeById(c.parent_id); } return p.join("  ›  "); }

/* ---------- NAVIGATION: one door into a node ---------- */
// Every route to a node — tree click, navigator pill, search hit — comes
// through here, so selection, expansion, history and scroll never disagree.
function goTo(id,opts={}){
  const n=nodeById(id); if(!n) return;
  S.currentId=id;
  ancestorsOf(id).forEach(a=>S.collapsed.delete(a.id));   // reveal it if buried
  if(S.mode!=="build") setMode("build"); else { renderTree(); renderRight(); }
  if(opts.scroll!==false) scrollTreeTo(id);
}
function scrollTreeTo(id){
  const row=document.querySelector('.tn[data-id="'+id+'"]');
  if(row) row.scrollIntoView({block:"nearest"});
}

// A node is coloured by ITS OWN rating for the current system, and by nothing
// else. No roll-up. Every node — parent, child, ancestor — is independent, so a
// parent may read Full while a child reads Partial. That looks impossible and
// isn't: in a working session a capability gets provisionally parented, or the
// room agrees to call a parent Full for a reason not yet written down. Forcing
// parent/child consistency to satisfy a scoring rule would make the tool argue
// with the room. Decision D9.
//
// The cost, stated plainly: an unrated parent shows grey even when all of its
// children are rated. That is the honest reading — it is unrated — and it beats
// borrowing confidence from below.
//
// This replaced a read of the node_rollup view. That read had never worked: it
// filtered on r.evaluator, and the view has no evaluator column, so the
// comparison was undefined===name and false on every row. The swatch had been
// unconditionally grey since the filter was added. See D9.
/* ⚠ THE TREE AND CHART SHOW ONE CHANNEL AT A TIME.
   With B18 a node has up to one rating per system PER CHANNEL, and a single
   swatch cannot honestly show several. So the tree paints the current system
   × the current channel, chosen in the header, and the matrix is where you
   see them all at once.

   ⚠ Falls back to the system's FIRST channel rather than to "any rating".
   "Any" would let a Customer·Web rating colour a swatch the reader is
   reading as Office·Desktop — quietly answering a different question from
   the one asked, which is exactly what D9 retired roll-up for. */
function currentChannelFor(systemId){
  const list = channelsFor(systemId);
  if(!list.length) return null;
  const picked = list.find(c => c.id === S.currentChannel);
  return picked || list[0];
}
function colorForSystem(nodeId, sys, channelId){
  if(!sys) return null;
  const ch = channelId || (currentChannelFor(sys) || {}).id;
  const ex = ratingFor(nodeId, sys, ch);
  if(!ex) return null;
  const sv=svById(ex.scale_value_id);
  if(!sv) return null;
  return { label:sv.label, color:sv.color, derived:false };
}
function colorFor(nodeId){ return colorForSystem(nodeId, S.currentSystem); }

/* ---------- LEFT TREE ---------- */

function syncQuickAddHint(){
  const q=$("quickadd"); if(!q) return;

    : "Add child to selected… (Enter)";
}

function renderTree(){

/* Alias mode owns the system picker's visibility. Off, there is nothing to
   choose; on, the picker is the whole point — "aliases" means nothing without
   "whose". Kept in one function so the button, the picker and the tree can
   never disagree about which state they are in. */
function syncAliasChrome(){
  const btn=$("aliasbtn"), sp=$("syspick");
  if(!btn||!sp) return;
  btn.classList.toggle("on", S.aliasMode);
  const show = S.aliasMode && S.mode!=="evaluate" && S.systems.length>0;
  sp.style.display = show ? "" : "none";
  if(show){
    if(S.currentSystem) sp.value=S.currentSystem;
    const sys=S.systems.find(x=>x.id===S.currentSystem);
    const n=S.aliases.filter(a=>a.system_id===S.currentSystem).length;
    btn.title = sys
      ? "Showing "+sys.name+"'s own words — "+n+" node"+(n===1?"":"s")+" renamed. Click to turn off."
      : "Showing system aliases. Click to turn off.";
  } else {
    btn.title = "Show each system's own word for these nodes";
  }
}

function treeNode(n){
  const li=el("li");
  const kids=childrenOf(n.id);
  const row=el("div","tn"+(n.id===S.currentId?" sel":""));
  row.dataset.id=n.id;
  const hasKids=kids.length>0;
  const caret=el("span","caret", hasKids?(S.collapsed.has(n.id)?"▶":"▼"):"");
  if(hasKids){ caret.addEventListener("click",e=>{ e.stopPropagation(); if(S.collapsed.has(n.id))S.collapsed.delete(n.id); else S.collapsed.add(n.id); renderTree(); }); }
  row.appendChild(caret);
  // color swatch in evaluate/chart modes
  if(S.mode!=="build"){ const c=colorFor(n.id); const sw=el("span","tw"); sw.style.background=c?c.color:"var(--none)"; row.appendChild(sw); }
  if(isData(n)) row.classList.add("datarow");
  // 3b — in alias mode, show the selected system's term where one exists.
  // Nodes with no alias keep their real name and get NO highlight, so the
  // gaps are visible: an unhighlighted row is one this system has no word for.
  const alias = S.aliasMode ? aliasTermFor(n.id, S.currentSystem) : null;
  const nm = el("span","nm"+(alias?" aliased":""), alias || n.name);
  if(alias){
    const sys = S.systems.find(x=>x.id===S.currentSystem);
    nm.title = (sys?sys.name:"This system")+" calls this “"+alias+"”.\nCanonical name: "+n.name;
  }
  row.appendChild(nm);
  // No grp/leaf/data pill. The caret already says whether a node has children,
  // and a data element is now shown by the cream row behind it. "on hold" stays
  // — it is a state nothing else reports.
  if(S.mode==="build" && !n.evaluation_ready) row.appendChild(el("span","mini hold","on hold"));
  row.addEventListener("click",()=>goTo(n.id,{scroll:false}));
  li.appendChild(row);
  if(hasKids && !S.collapsed.has(n.id)){ const ul=el("ul"); kids.forEach(k=>ul.appendChild(treeNode(k))); li.appendChild(ul); }
  return li;
}

function renderRight(){

/* ---------- POSITION NAVIGATOR ----------
   Ancestors ▸ current, with the add buttons placed where the new node will
   land: to the RIGHT for a sibling (same level), BELOW for a child (one level
   down). Position carries the meaning, so the buttons need no explanation.
   No "add parent" — inserting a level above is a re-parent, not an add.      */
function renderNavStrip(r,n){
  const strip=el("div","navstrip");

  const chain=[]; let c=nodeById(n.parent_id); while(c){ chain.unshift(c); c=nodeById(c.parent_id); }
  chain.forEach(a=>{
    const pill=el("button","npill anc",a.name);
    pill.title="Go to “"+a.name+"”";
    pill.addEventListener("click",()=>goTo(a.id));
    strip.appendChild(pill);
    strip.appendChild(el("span","nsep","›"));
  });

  // Current node and its children share one column, so the children row starts
  // exactly at the current node's left edge — the indent IS the level change.
  // The add buttons live inside the top row, so a wide children row can't push
  // them away from the node they act on.
  const col=el("div","curcol");

  const top=el("div","currow");
  top.appendChild(el("div","npill cur",n.name));
  if(atLeast("builder")){
    const sibs=siblingsOf(n.parent_id||null);
    const idx=sibs.findIndex(x=>x.id===n.id);
    if(sibs.length>1){
      const ord=el("div","ordctl");
      [["▲",-1,"Move up among its siblings"],["▼",1,"Move down among its siblings"]].forEach(([glyph,dir,tip])=>{
        const b=el("button","ordbtn",glyph);
        b.title=tip;
        b.disabled = dir<0 ? idx<=0 : idx>=sibs.length-1;
        // Not awaited and not disabled: the move is local and instant, and the
        // save follows once the clicking stops.
        b.addEventListener("click",()=>{
          if(moveSibling(n,dir)) flashNav("Moved “"+n.name+"” "+(dir<0?"up":"down")+".");
        });
        ord.appendChild(b);
      });
      top.appendChild(ord);
    }
    const sibSlot=el("div","addslot"); sibSlot.appendChild(addControl(n,"sibling",sibSlot)); top.appendChild(sibSlot);
    // A data node is terminal by construction (migration 19), so it simply has
    // no "add child" control. Better than offering one that always errors.
    if(!isData(n)){
      const forced = forcedChildKind(n.id);
      // BOTH are always shown. The one the rule forbids is disabled and says
      // why. Hiding it, or silently coercing to the allowed kind, is how a
      // user ends up with a data node they did not ask for.
      [KIND_CAP, KIND_DATA].forEach(k=>{
        const cs=el("div","addslot");
        const ctl=addControl(n,"child",cs,k);
        if(forced && forced!==k){
          ctl.disabled=true;
          ctl.classList.add("addoff");
          ctl.title = (forced===KIND_DATA)
            ? "“"+n.name+"” already holds data elements, and children must all be one kind. "
              +"To add a capability here, move the data elements under a child capability first."
            : "“"+n.name+"” already has capability children, and children must all be one kind. "
              +"To add data elements here, put them under a child capability instead.";
        }
        cs.appendChild(ctl); top.appendChild(cs);
      });
    }
  }
  col.appendChild(top);

  strip.appendChild(col);
  if(childrenOf(n.id).length) refreshKidsRow(n,col);   // same builder the live refresh uses

  r.appendChild(strip);
  const note=el("div","navnote"); note.id="navnote"; r.appendChild(note);
}

// The button and its inline entry box swap in and out of the same slot.
// `rel` is "child" or "sibling" — the RELATIONSHIP being created. Renamed from
// `kind` on 2026-08-30, because migration 19 gives nodes a `kind` of their own
// (capability | data) and two senses of one word inside one function is how a
// wrong node gets created without anyone noticing.
function addControl(n,rel,slot,kind){
  const isD = kind===KIND_DATA;
  // Tagged so syncChildAddButtons() can find and re-evaluate them without
  // redrawing the panel and destroying an open input.
  const btn=el("button","addbtn"+(isD?" dataadd":""),
               rel==="child" ? (isD?"+ data type":"+ child") : "+ sibling");
  btn.dataset.rel = rel;
  btn.dataset.kind = kind || "";
  btn.dataset.node = n.id;
  btn.title = rel==="child"
    ? (isD ? "Add a data element under “"+n.name+"” — a field or value, with no children of its own"
           : "Add a node one level under “"+n.name+"”")
    : "Add a node beside “"+n.name+"”, under the same parent";
  btn.addEventListener("click",()=>{
    slot.innerHTML="";
    const inp=el("input","addinp");
    inp.placeholder = rel==="child"
      ? (isD ? "New data element under "+n.name+"…" : "New child of "+n.name+"…")
      : "New sibling…";
    slot.appendChild(inp); inp.focus();
    inp.addEventListener("keydown",async e=>{
      if(e.key==="Escape"){ slot.innerHTML=""; slot.appendChild(addControl(n,rel,slot,kind)); return; }
      if(e.key!=="Enter") return;
      const name=inp.value.trim(); if(!name) return;
      inp.value=""; inp.disabled=true;
      const ok=await addNodeRelative(n,rel,name,kind);
      inp.disabled=false; inp.focus();                 // stay put: keep entering at this level
      if(ok) flashNav("Added “"+name+"”"+(rel==="child"?" under ":" beside ")+n.name+".");
    });
    inp.addEventListener("paste",e=>{
      // sibling pastes go under this node's parent; child pastes go under it
      const target = rel==="child" ? n : (n.parent_id ? nodeById(n.parent_id) : null);
      handleMultiPaste(e, target, created=>{
        inp.value="";
        renderTree();
        if(rel==="child"){ refreshKidsRow(n); syncChildAddButtons(n.id); }
        inp.focus();
        flashNav("Added "+created.length+(rel==="child"?" children under ":" siblings beside ")+n.name+".");
      }, rel==="child" ? kind : (n.kind||KIND_CAP));
    });
    inp.addEventListener("blur",()=>{ if(!inp.value.trim()){ slot.innerHTML=""; slot.appendChild(addControl(n,rel,slot,kind)); } });
  });
  return btn;
}
/* ---------- REORDER: optimistic, with a debounced flush ----------
 * The first version awaited two saveOp() calls per click, and every click cost
 * a full second of deliberate waiting with the button disabled. The network was
 * never the problem: SAVE_MIN_MS is a 500 ms MINIMUM DISPLAY TIME so the
 * "saving" pill is actually visible, and a swap paid it twice.
 *
 * So there are three fixes here and debouncing is only one of them:
 *   1. The move happens LOCALLY first and re-renders immediately. Clicking is
 *      instant regardless of what the network is doing.
 *   2. A burst of clicks coalesces into ONE flush after the user stops.
 *   3. That flush is a SINGLE saveOp wrapping all the PATCHes in parallel, so
 *      the 500 ms floor is paid once per burst instead of twice per click.
 *
 * 600 ms: there is no universal standard. ~100 ms reads as instantaneous,
 * 300 ms is the classic type-ahead debounce, and ~1 s is Nielsen's threshold
 * for keeping a user's flow of thought unbroken. For coalescing discrete
 * clicks, 500-700 ms is the usual autosave-on-idle range. One constant, one
 * edit to change it.
 */
const REORDER_IDLE_MS = 600;
let orderTimer = null, orderFlushing = false;
const orderDirty = new Set();
function reorderPending(){ return !!orderTimer || orderFlushing || orderDirty.size > 0; }

// Renumbers the whole sibling group 1..n rather than swapping a pair. Swapping
// is fine for one move; across a debounced burst it can cancel itself out and
// leave the screen and the database disagreeing.
function moveSibling(n, dir){
  const sibs = siblingsOf(n.parent_id||null);
  const i = sibs.findIndex(x=>x.id===n.id);
  const j = i + dir;
  if(i<0 || j<0 || j>=sibs.length) return false;       // already at the end
  sibs.splice(j, 0, sibs.splice(i,1)[0]);
  sibs.forEach((x,k)=>{ if(x.sort_order !== k+1){ x.sort_order = k+1; orderDirty.add(x.id); } });
  renderTree(); renderRight();
  clearTimeout(orderTimer);
  orderTimer = setTimeout(flushOrder, REORDER_IDLE_MS);
  return true;
}

async function flushOrder(){
  clearTimeout(orderTimer); orderTimer = null;
  if(orderFlushing || !orderDirty.size) return true;
  const ids = [...orderDirty]; orderDirty.clear();
  orderFlushing = true;
  let ok = false;
  try{
    const rows = ids.map(nodeById).filter(Boolean);
    const res = await saveOp(async ()=>{
      const out = await Promise.all(rows.map(x =>
        api("nodes?id=eq."+x.id, {
          method:"PATCH",
          headers:{...H, "Prefer":"return=representation"},
          body: JSON.stringify({ sort_order: x.sort_order })
        })));
      const bad = out.find(r => r && r.ok === false);
      if(bad) return bad;
      // ⚠ A refused UPDATE under RLS is NOT an error — it returns 200 with an
      // EMPTY array, so checking res.ok would report "Saved" on a write the
      // database declined. Asking for the representation back is what makes
      // the refusal visible. (Open defect from Session 8, closed here for this
      // operation; the same treatment is owed to every other PATCH.)
      const bodies = await Promise.all(out.map(r => r.clone().json().catch(()=>null)));
      const refused = bodies.filter(b => Array.isArray(b) && b.length === 0).length;
      if(refused) throw new Error(refused+" of "+out.length+
        " reorder writes were refused by the database (row-level security). "+
        "The order on screen has NOT been saved.");
      return out[0];
    });
    ok = !!res;
    if(!ok) ids.forEach(id => orderDirty.add(id));     // failed: still dirty, retry later
  } finally {
    orderFlushing = false;
  }
  if(orderDirty.size && !orderTimer) orderTimer = setTimeout(flushOrder, REORDER_IDLE_MS);
  return ok;
}

// Anything that navigates away from the current arrangement flushes first.
window.addEventListener("beforeunload", e=>{
  if(reorderPending()){ e.preventDefault(); e.returnValue=""; }
});

// Re-evaluate the child add buttons in place. Called after anything that
// changes a node's children, because the panel is NOT redrawn while an add
// input is open — and a button that was right when drawn is a button that
// silently goes wrong.
function syncChildAddButtons(nodeId){
  const n = nodeById(nodeId); if(!n) return;
  const forced = forcedChildKind(n.id);
  document.querySelectorAll('.currow .addbtn[data-rel="child"]').forEach(btn=>{
    if(btn.dataset.node !== n.id) return;
    const k = btn.dataset.kind || KIND_CAP;
    const off = !!(forced && forced !== k);
    btn.disabled = off;
    btn.classList.toggle("addoff", off);
    if(off){
      btn.title = (forced===KIND_DATA)
        ? "“"+n.name+"” already holds data elements, and children must all be one kind. "
          +"To add a capability here, move the data elements under a child capability first."
        : "“"+n.name+"” already has capability children, and children must all be one kind. "
          +"To add data elements here, put them under a child capability instead.";
    }
  });
}

function flashNav(text){
  const note=$("navnote"); if(!note) return;
  note.textContent=text; note.classList.add("show");
  clearTimeout(flashNav._t); flashNav._t=setTimeout(()=>note.classList.remove("show"),2600);
}
async function addNodeRelative(n,rel,name,kind){
  const parentId = rel==="child" ? n.id : (n.parent_id||null);   // sibling of a root is a new root
  const forced = rel==="sibling" ? (n.kind||KIND_CAP) : forcedChildKind(parentId);

  // ⚠ REFUSE, never silently coerce. The earlier version quietly rewrote the
  // requested kind to the forced one, which produced data nodes the user had
  // not asked for and read, correctly, as the rule not working. A disabled
  // button is the first line of defence and it can go STALE: the add input
  // deliberately stays open after each entry, so the buttons beside it are not
  // re-evaluated. That is exactly how "data 1/2/3" were created by clicking a
  // "+ child" button that had been correct when it was drawn.
  if(rel==="child" && forced && kind && forced!==kind){
    flashNav("Can't add a "+kind+" node here — “"+n.name+"” already has "+forced+
             " children, and children must all be one kind.");
    return false;
  }

  const k = forced || kind || KIND_CAP;
  const body={ project_id:S.projectId, parent_id:parentId, name, kind:k,
               is_evaluable:true, is_essential:true, sort_order:nextSortOrder(parentId) };
  const res=await saveOp(()=>api("nodes",{method:"POST",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(body)}));
  if(!res) return false;
  S.nodes.push((await res.json())[0]);
  if(parentId) S.collapsed.delete(parentId);
  renderTree();
  // rebuild just the children row — a full re-render would destroy the open input
  if(rel==="child"){ refreshKidsRow(n); syncChildAddButtons(n.id); }
  return true;
}
function refreshKidsRow(n,col){
  col = col || document.querySelector(".curcol");   // passed in at render, looked up on live adds
  if(!col) return;
  let row=col.querySelector(".kidsrow");
  if(!row){ row=el("div","kidsrow"); col.appendChild(row); }
  row.innerHTML="";
  childrenOf(n.id).forEach(k=>{
    const pill=el("button","npill kid"+(isData(k)?" datakid":""),k.name);
    pill.title="Go to “"+k.name+"”";
    pill.addEventListener("click",()=>goTo(k.id));
    row.appendChild(pill);
  });
}

function renderBuild(r,n){
  if(!atLeast("builder")) return renderBuildReadOnly(r,n);

  const nameF=el("div","field"); nameF.appendChild(el("label",null,"Name"));
  const nameI=Object.assign(el("input"),{value:n.name}); nameF.appendChild(nameI); r.appendChild(nameF);

  // Problem solved: a node that can't name a problem may be vanity, redundant,
  // or mis-decomposed. Soft prompt only — no hard gate (backlog #10).
  const defF=el("div","field");
  defF.appendChild(el("label",null,"Problem solved"));
  const defI=el("textarea");
  defI.placeholder="What problem or business requirement does this node address?";
  defI.value=n.problem_solved||""; defF.appendChild(defI); r.appendChild(defF);

  const detF=el("div","field");
  detF.appendChild(el("label",null,"Details"));
  const detI=el("textarea");
  detI.placeholder = isData(n)
    ? "What this element holds — format, allowed values, whether it is required…"
    : "How this works, or the kinds of information involved…";
  detI.value=n.details||""; detF.appendChild(detI); r.appendChild(detF);

  // The Evaluable and Essential checkboxes were removed 2026-08-30.
  //   is_evaluable was PROVABLY INERT — nothing in this file ever branched on
  //     it. Its only consumer was node_rollup, which D9 stopped reading.
  //   is_essential drove an "opt"/"optional" badge, but its label promised it
  //     "counts in roll-up" and there is no roll-up since D9. A control whose
  //     stated reason is dead is worse than no control.
  // Both COLUMNS remain (not null, default true) and both stay in the history
  // field labels, so old audit entries still read correctly. See S11/D2 — this
  // is the last of the two-type node model abandoned in Session 3, and the
  // question it was asking is reopened properly by node `kind`.

  const save=el("button","btn","Save changes");
  const msg=el("div","msg");
  save.addEventListener("click",async()=>{
    const newName=nameI.value.trim()||n.name, newProb=defI.value.trim()||null;
    // Warn, don't block: meaning-changing edits are allowed, but the ratings
    // riding on them deserve a moment's thought — and get flagged stale after.
    const meaningMoved = MEANING_TRACKING &&
      (newName!==n.name || newProb!==(n.problem_solved||null));
    const riders = meaningMoved ? ratingsUnder(n.id) : 0;
    if(riders && !confirm(
        "This changes what “"+n.name+"” means, and "+riders+" rating"+(riders>1?"s":"")+
        " already ride on it or its descendants.\n\nThe edit is allowed and will be logged, "+
        "and affected ratings will be flagged stale for review.\n\nContinue?")) return;
    const body={ name:newName, problem_solved:newProb, details:detI.value.trim()||null };
    const res=await saveOp(()=>api("nodes?id=eq."+n.id,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(body)}));
    if(res){
      const u=(await res.json())[0]; Object.assign(n,u);
      if(meaningMoved) await loadMeaningChanges();     // staleness recomputes from the log
      msg.className="msg ok"; msg.textContent="Saved."+(riders?" "+riders+" rating(s) flagged for review.":"");
      renderTree();
    }
    else { msg.className="msg bad"; msg.textContent="Save failed — see the status indicator up top."; }
  });
  r.appendChild(save);

  const hist=el("button","btn ghost sm","History");
  hist.style.marginLeft="8px";
  hist.addEventListener("click",()=>openHistory(n));
  r.appendChild(hist);

  const del=el("button","btn ghost sm","Delete node");
  del.style.marginLeft="8px";
  del.addEventListener("click",async()=>{
    if(!confirm("Delete “"+n.name+"” and all its descendants? This can't be undone."))return;
    const res=await api("nodes?id=eq."+n.id,{method:"DELETE"});
    if(res.ok){ S.currentId=n.parent_id; await reload(); }
    else { msg.className="msg bad"; msg.textContent="Delete failed: "+(await res.text()); }
  });
  r.appendChild(del);
  r.appendChild(msg);

  const hint=el("div","kv"); hint.innerHTML="Use the box on the left to rapidly add children under this node.";
  r.appendChild(hint);

  if(S.cameFrom==="evaluate"){
    const back=el("button","backchip","← Back to Evaluate");
    back.addEventListener("click",()=>{ S.cameFrom=null; setMode("evaluate"); });
    r.insertBefore(back, r.firstChild);
  }
  const nbar=el("div","kv"); nbar.style.marginTop="10px";
  nbar.appendChild(document.createTextNode("Something the administrator should know about this node?"));
  nbar.appendChild(noteButton(n,()=>{ renderTree(); renderRight(); }));
  const bdot=noteDot(n); if(bdot) nbar.appendChild(bdot);
  r.appendChild(nbar);

  renderShotBlock(r,n);
  renderAliasBlock(r,n);
  renderMoveBlock(r,n);
}

/* ---------- ALIASES (per node × system vocabulary) ----------
   An alias is a FACT about a system, not a judgment: shared across the project,
   no evaluator axis, one term per node × system. Meaning-preserving, so it
   stays editable regardless of evaluation readiness.                          */
function aliasesFor(nodeId){
  return S.aliases.filter(a=>a.node_id===nodeId)
    .sort((a,b)=>{
      const sa=S.systems.find(s=>s.id===a.system_id), sb=S.systems.find(s=>s.id===b.system_id);
      return (sa?sa.name:"").localeCompare(sb?sb.name:"");
    });
}
// The selected system's own word for a node, or null. Exact match on
// system_id only — an alias belongs to one system and must never be borrowed
// from another, which would put a competitor's vocabulary on screen during
// that vendor's session.
function aliasTermFor(nodeId, systemId){
  if(!systemId) return null;
  const a = S.aliases.find(x => x.node_id===nodeId && x.system_id===systemId);
  return (a && a.term && a.term.trim()) ? a.term.trim() : null;
}

function renderAliasBlock(r,n){
  const box=el("div","moveblock");
  box.appendChild(el("div","mvttl","Aliases — what each system calls this"));

  if(!S.systems.length){
    box.appendChild(el("div","kv","No systems yet. Add them in ⚙ Settings first."));
    r.appendChild(box); return;
  }

  const list=el("div","aliaslist");
  const mine=aliasesFor(n.id);
  if(!mine.length) list.appendChild(el("div","kv","None recorded yet."));
  mine.forEach(a=>list.appendChild(aliasRow(a,n,box)));
  box.appendChild(list);

  if(!atLeast("builder")){ r.appendChild(box); return; }   // aliases are readable by all, editable by builders

  const used=new Set(mine.map(a=>a.system_id));
  const free=S.systems.filter(s=>!used.has(s.id));
  const slot=el("div","addslot"); slot.style.marginTop="10px";
  if(!free.length){
    slot.appendChild(el("span","kv","Every system has a term for this node."));
  } else {
    const btn=el("button","addbtn","+ add alias");
    btn.addEventListener("click",()=>aliasForm(slot,n,null,free,box));
    slot.appendChild(btn);
  }
  box.appendChild(slot);
  r.appendChild(box);
}

function aliasRow(a,n,box){
  const row=el("div","aliasrow");
  const sys=S.systems.find(s=>s.id===a.system_id);
  const code=el("span","acode",sys?(sys.code||sys.name.slice(0,3).toUpperCase()):"???");
  code.title=sys?sys.name:"unknown system";
  row.appendChild(code);
  const mid=el("div","amid");
  mid.appendChild(el("div","aterm",a.term));
  if(a.note) mid.appendChild(el("div","anote",a.note));
  row.appendChild(mid);
  if(!atLeast("builder")) return row;

  const edit=el("button","btn ghost sm","Edit");
  edit.addEventListener("click",()=>{
    const slot=el("div"); row.replaceWith(slot);
    aliasForm(slot,n,a,[sys].filter(Boolean),box);
  });
  row.appendChild(edit);

  const del=el("button","btn ghost sm","Delete");
  del.style.marginLeft="4px";

    if(res){ S.aliases=S.aliases.filter(x=>x.id!==a.id); renderRight(); }

  return row;
}

// One form for both add and edit; `existing` null means add.
function aliasForm(slot,n,existing,systems,box){
  slot.innerHTML="";
  const f=el("div","aliasform");
  const sysSel=el("select");
  systems.forEach(s=>sysSel.appendChild(Object.assign(el("option",null,s.name),{value:s.id})));
  if(existing) sysSel.value=existing.system_id;
  if(existing) sysSel.disabled=true;         // changing the system is a different alias
  f.appendChild(sysSel);

  const term=Object.assign(el("input"),{placeholder:"This system's term",value:existing?existing.term:""});
  const note=Object.assign(el("input"),{placeholder:"Note (optional) — e.g. “pro edition only”",value:existing&&existing.note?existing.note:""});
  note.style.minWidth="220px";
  f.appendChild(term); f.appendChild(note);

  const save=el("button","btn sm",existing?"Save":"Add");
  const cancel=el("button","btn ghost sm","Cancel");
  cancel.addEventListener("click",()=>renderRight());
  const msg=el("div","smsg");

  const commit=async()=>{
    const t=term.value.trim();
    if(!t){ msg.className="smsg bad"; msg.textContent="A term is required."; return; }
    const body={ term:t, note:note.value.trim()||null };
    let res;
    if(existing){
      res=await saveOp(()=>api("aliases?id=eq."+existing.id,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(body)}));
      if(res) Object.assign(existing,(await res.json())[0]);
    } else {
      res=await saveOp(()=>api("aliases",{method:"POST",headers:{...H,"Prefer":"return=representation"},
        body:JSON.stringify({...body, project_id:S.projectId, node_id:n.id, system_id:sysSel.value})}));
      if(res) S.aliases.push((await res.json())[0]);
    }
    if(res) renderRight();
    else { msg.className="smsg bad"; msg.textContent="Couldn't save — this system may already have a term for this node."; }
  };
  save.addEventListener("click",commit);
  term.addEventListener("keydown",e=>{ if(e.key==="Enter") commit(); });
  note.addEventListener("keydown",e=>{ if(e.key==="Enter") commit(); });

  f.appendChild(save); f.appendChild(cancel);
  slot.appendChild(f); slot.appendChild(msg);
  term.focus();
}

/* ---------- MOVE / RE-PARENT ---------- */
function renderMoveBlock(r,n){
  // --- evaluation-ready signal (softened freeze) ---
  const rb=el("div","moveblock");
  rb.appendChild(el("div","mvttl","Ready to evaluate"));
  const hr=holdRoot(n);
  const rw=el("div","checks");
  const rchk=Object.assign(el("input"),{type:"checkbox",checked:!!n.evaluation_ready});
  const rlbl=el("label"); rlbl.appendChild(rchk);
  rlbl.appendChild(el("span",null,"Ready to evaluate (this node and everything under it)"));
  rw.appendChild(rlbl); rb.appendChild(rw);
  if(hr && hr.id!==n.id){
    rb.appendChild(el("div","kv bad","Held back by “"+hr.name+"” — an ancestor is unchecked, so this branch cannot be rated until that one is ticked again."));
  }
  rb.appendChild(el("div","kv","On by default: new nodes are open for rating straight away. Uncheck it while there is work to do — evaluators then cannot rate this node or anything under it, and it shows as ON HOLD. Editing is never blocked; edits are logged and flag affected ratings stale."));
  rchk.addEventListener("change",async()=>{
    const res=await saveOp(()=>api("nodes?id=eq."+n.id,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},
      body:JSON.stringify({evaluation_ready:rchk.checked})}));
    if(res){ Object.assign(n,(await res.json())[0]); renderTree(); renderRight(); }
    else rchk.checked=!rchk.checked;
  });
  r.appendChild(rb);

  // --- move / re-parent ---
  const box=el("div","moveblock");
  box.appendChild(el("div","mvttl","Move (re-parent)"));

  const kids=descendantIds(n.id);                       // self + subtree: never valid targets
  const targets=S.nodes.filter(t=>!kids.has(t.id)).map(t=>({t,path:pathOf(t)}))
                       .sort((a,b)=>a.path.localeCompare(b.path));

  const f=el("div","field"); f.appendChild(el("label",null,"New parent"));
  const sel=el("select");
  sel.appendChild(Object.assign(el("option",null,"— Top level (no parent) —"),{value:""}));
  targets.forEach(({t,path})=>sel.appendChild(Object.assign(el("option",null,path),{value:t.id})));
  sel.value = n.parent_id || "";
  f.appendChild(sel); box.appendChild(f);

  const btn=el("button","btn ghost sm","Move node");
  const mmsg=el("div","msg");
  btn.addEventListener("click",async()=>{
    const newParent = sel.value || null;
    if((n.parent_id||null)===newParent){ mmsg.className="msg bad"; mmsg.textContent="That's already its parent — nothing to move."; return; }
    const where = newParent ? "under “"+nodeById(newParent).name+"”" : "to the top level";
    const count = kids.size-1;
    const riders = ratingsUnder(n.id);   // context is part of meaning, so a move counts
    let warn="Move “"+n.name+"” "+where+"?"+(count?" Its "+count+" descendant"+(count>1?"s":"")+" move with it.":"");
    if(riders) warn+="\n\n"+riders+" rating"+(riders>1?"s":"")+" ride on this subtree. Context is part of a node's meaning, so they'll be flagged stale for review.";
    if(!confirm(warn)) return;
    const res=await saveOp(()=>api("nodes?id=eq."+n.id,{method:"PATCH",headers:{...H,"Prefer":"return=representation"},
      body:JSON.stringify({parent_id:newParent})}));
    if(res){
      await reload();
      ancestorsOf(n.id).forEach(a=>S.collapsed.delete(a.id));   // reveal it in its new home
      renderTree(); renderRight();
    } else {
      mmsg.className="msg bad"; mmsg.textContent="Move failed — see the status indicator up top.";
      box.appendChild(mmsg);
    }
  });
  box.appendChild(btn); box.appendChild(mmsg);
  box.appendChild(el("div","kv","Its whole subtree travels with it. A node can't be moved into its own descendants, so those aren't listed."));
  r.appendChild(box);
}

function orderedForMatrix(){
  // depth-first list of nodes with depth, for matrix rows.
  // If a specific domain is selected, only that subtree is shown.
  const out=[];
  const walk=(n,d)=>{ out.push({node:n,depth:d}); childrenOf(n.id).forEach(c=>walk(c,d+1)); };
  if(S.evalDomain && S.evalDomain!=="all"){
    const dom=nodeById(S.evalDomain);
    if(dom) walk(dom,0);
  } else {
    roots().forEach(r=>walk(r,0));
  }
  return out;
}

function renderMatrix(r){
  if(!S.systems.length){ r.appendChild(el("div","empty","No systems yet. Add systems in ⚙ Settings first.")); return; }

  // header: who's evaluating + co-evaluator + domain filter
  const bar=el("div","evalbar");
  // Identity is no longer a choice — you rate as whoever signed in. The picker
  // it replaces let one laptop be passed around a table; that convenience is
  // exactly what made attribution untrustworthy.
  const mine=myEvaluatorFor();
  const whoWrap=el("div","evalwho");
  whoWrap.appendChild(el("span","elbl","Evaluating as"));
  const whoName=el("div","evalme");
  whoName.appendChild(el("span","evalmenm", S.evaluator));
  const assigned=mine && mine.default_system_id
    ? S.systems.find(s=>s.id===mine.default_system_id) : null;

  const cols = [];                       // flattened [{sys, chan, first}]

    if(shotsFor(n.id,null).length){                       // untagged: no cell to sit on

    const held=holdRoot(n);
    const nameTd=el("td","mname depth"+Math.min(item.depth,4)+(held?" heldname":""));
    nameTd.appendChild(el("span","mnm",n.name));
    if(held){
      const h=el("span","heldtag","on hold");
      h.title = held.id===n.id
        ? "Held back — not ready to evaluate yet"
        : "Held back by “"+held.name+"”, an ancestor that is not ready to evaluate";
      nameTd.appendChild(h);
    }
    tr.appendChild(nameTd);
    cols.forEach(col=>{
      const s=col.sys, ch=col.chan;
      const td=el("td","cell"+(col.first?" first":"")
                     +(assigned && s.id===assigned.id ? " assignedcol" : ""));
      // Screenshots are tagged per node × SYSTEM, not per channel — evidence is

      if(col.first){ const fold=shotFold(n,s.id); if(fold) td.appendChild(fold); }

        td.appendChild(flag);

          : "Held back by “"+held.name+"” — an ancestor is not ready to evaluate";
      } else if(locked){
        td.title = "You are not on this project's evaluator list, so ratings cannot be attributed to you.";
      }

      /* One box per scale value. Clicking the box that is already on CLEARS
         the rating — the mockup's behaviour, and the reason there is no "—"
         option taking up a fifth box. */
      const grp=el("span","boxgrp");
